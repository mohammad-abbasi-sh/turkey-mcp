<style>
:root{
  --bg:#F5F7FC; --card:#FFFFFF; --elev:#FFFFFF; --text:#101B35; --muted:#5A6B8C;
  --line:#E4E9F4; --primary:#6657E8; --primary-2:#7C6FF0; --primary-soft:#EFEDFD;
  --secondary:#19C6B3; --secondary-soft:#E2F8F5; --accent:#FFB86B; --accent-soft:#FFF3E2;
  --navy:#101B35; --danger:#E5484D; --ok:#0E9F6E;
  --shadow:0 10px 30px rgba(16,27,53,.08); --shadow-lg:0 24px 60px rgba(16,27,53,.14);
  --radius:18px; --radius-sm:12px;
  --font-fa:"Vazirmatn",system-ui,Tahoma,sans-serif;
  --font-lat:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
[data-theme="dark"]{
  --bg:#0B1120; --card:#141E32; --elev:#1B2940; --text:#F5F7FC; --muted:#9AA8C7;
  --line:#24314F; --primary:#8B80FF; --primary-2:#A39CFF; --primary-soft:#23264D;
  --secondary:#32DCC7; --secondary-soft:#123B38; --accent:#FFB86B; --accent-soft:#3A2B17;
  --shadow:0 10px 30px rgba(0,0,0,.35); --shadow-lg:0 24px 60px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
  html,body{overflow-x:clip}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);line-height:1.75;font-family:var(--font-lat);transition:background .35s ease,color .35s ease}
[dir="rtl"] body,[lang="fa"] body{font-family:var(--font-fa)}
h1,h2,h3,h4{line-height:1.35;margin:0 0 .5em;font-weight:800}
p{margin:0 0 1em}
a{color:var(--primary);text-decoration:none}
a:hover{text-decoration:underline}
img,svg{display:block;max-width:100%}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px;width:100%;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.88em;background:var(--primary-soft);border-radius:6px;padding:1px 6px;direction:ltr;unicode-bidi:isolate}
pre{background:var(--navy);color:#E6EBF7;border-radius:14px;padding:16px 18px;overflow-x:auto;font-size:13px;line-height:1.7;direction:ltr;text-align:left;margin:0}
pre code{background:none;padding:0;color:inherit}
.wrap{max-width:1160px;margin:0 auto;padding-inline:20px}
.section{padding:72px 0 8px}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:28px;flex-wrap:wrap}
.section-head h2{font-size:30px;margin:0}
.section-head p{color:var(--muted);margin:6px 0 0;max-width:640px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:.02em;color:var(--primary);background:var(--primary-soft);border-radius:999px;padding:5px 14px;margin-bottom:14px}
.eyebrow .dot{width:8px;height:8px;border-radius:50%;background:var(--secondary)}
/* ---------- header / nav ---------- */
header.site{position:sticky;top:0;z-index:60;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);background:color-mix(in srgb,var(--bg) 78%,transparent);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:14px;height:66px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;color:var(--text);text-decoration:none;white-space:nowrap}
.brand:hover{text-decoration:none}
.brand .mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--primary),#9B8CFF 55%,var(--secondary));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:19px;box-shadow:0 6px 16px rgba(102,87,232,.35)}
.brand small{display:block;font-size:11px;font-weight:600;color:var(--muted);line-height:1}
nav.main{display:flex;gap:2px;margin-inline-start:8px}
nav.main a{color:var(--muted);font-size:14.5px;font-weight:600;padding:8px 12px;border-radius:999px;text-decoration:none;white-space:nowrap}
nav.main a:hover{color:var(--text);background:var(--primary-soft);text-decoration:none}
nav.main a.active{color:var(--primary);background:var(--primary-soft)}
.nav-right{margin-inline-start:auto;display:flex;align-items:center;gap:8px}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);display:inline-flex;align-items:center;justify-content:center;font-size:17px}
.icon-btn:hover{border-color:var(--primary)}
.lang-select{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:0 8px;height:40px;width:auto;font-weight:700;font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:12px 26px;font-size:15px;font-weight:700;border:1px solid transparent;text-decoration:none;transition:transform .15s,box-shadow .2s,background .2s;white-space:nowrap}
.btn:hover{text-decoration:none;transform:translateY(-1px)}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;box-shadow:0 10px 24px rgba(102,87,232,.35)}
.btn-ghost{background:var(--card);border-color:var(--line);color:var(--text)}
.btn-mint{background:var(--secondary);color:#06231F;box-shadow:0 10px 24px rgba(25,198,179,.3)}
.btn-sm{padding:9px 18px;font-size:14px}
.btn-block{width:100%}
.burger{display:none}
.mobile-menu{display:none;border-top:1px solid var(--line);padding:12px 20px 18px;background:var(--bg)}
.mobile-menu.open{display:block}
.mobile-menu a{display:block;padding:11px 4px;font-weight:600;color:var(--text);border-bottom:1px solid var(--line)}
.mobile-menu a:last-child{border-bottom:none}
/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;padding:64px 0 40px}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;background:
  radial-gradient(560px 380px at 88% -5%,color-mix(in srgb,var(--primary) 16%,transparent),transparent 70%),
  radial-gradient(520px 360px at 4% 30%,color-mix(in srgb,var(--secondary) 14%,transparent),transparent 70%),
  radial-gradient(420px 300px at 55% 110%,color-mix(in srgb,var(--accent) 12%,transparent),transparent 70%)}
.hero-grid{position:relative;display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center}
.hero h1{font-size:52px;line-height:1.18;letter-spacing:-.01em}
.hero h1 .grad{background:linear-gradient(120deg,var(--primary),var(--secondary));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .sub{color:var(--muted);font-size:17.5px;max-width:560px}
.hero-search{display:flex;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 16px;box-shadow:var(--shadow);max-width:560px;margin:22px 0 14px}
[dir="ltr"] .hero-search{padding:6px 16px 6px 6px}
.hero-search input{border:none;background:transparent;box-shadow:none;padding:8px 4px}
.hero-search input:focus{box-shadow:none}
.hero-search .btn{flex-shrink:0}
.hero-ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
.hero-stats{display:flex;gap:26px;margin-top:30px;flex-wrap:wrap}
.hero-stats b{display:block;font-size:24px}
.hero-stats span{color:var(--muted);font-size:13.5px}
/* demo card */
.demo{background:linear-gradient(160deg,#141B31,#0B1120);border:1px solid #26304D;border-radius:22px;box-shadow:var(--shadow-lg);overflow:hidden;color:#E6EBF7}
.demo-tabs{display:flex;gap:6px;padding:12px 14px;border-bottom:1px solid #22304F;flex-wrap:wrap}
.demo-tabs button{background:transparent;border:none;color:#8EA0C4;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600}
.demo-tabs button.active{background:#232C47;color:#fff}
.demo-body{padding:20px 22px;min-height:250px}
.demo-body .q{font-weight:700;color:#fff;font-size:16px;margin-bottom:12px;min-height:52px}
.demo-body pre{background:#1A2340;border:1px solid #2A3557}
.demo-body .fn{color:#32DCC7}.demo-body .str{color:#FFB86B}.demo-body .arg{color:#C3CFE8}
.demo-body .status{color:#32DCC7;font-size:13px;font-weight:700;margin:12px 0 4px}
.demo-body .a{color:#C3CFE8;font-size:14px;margin:0 0 12px}
.demo-body .ask{font-size:13px;color:#8EA0C4;margin:0}
.demo-body .ask a{color:#9DB4FF}
.demo-body .cursor{display:inline-block;width:2px;height:1em;background:#32DCC7;vertical-align:text-bottom;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.demo-foot{display:flex;align-items:center;gap:12px;border-top:1px solid #22304F;padding:14px 22px}
.demo-foot span{color:#8EA0C4;font-size:13px}
.demo-foot .btn{padding:9px 20px;font-size:14px}
/* ---------- cards / grids ---------- */
.grid{display:grid;gap:18px}
  .grid>*,.plat-grid>*,.steps>*{min-width:0}
.grid-4{grid-template-columns:repeat(4,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;transition:transform .18s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.card h3{font-size:17.5px;margin:0}
.card .desc{color:var(--muted);font-size:14px;margin:8px 0 14px;flex:1}
.tile{width:48px;height:48px;min-width:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:800;color:#fff}
.card-top{display:flex;gap:12px;align-items:flex-start}
.card-top .latin{color:var(--muted);font-size:12.5px;margin:2px 0 0;direction:ltr;text-align:start;overflow-wrap:anywhere}
.meta-row{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);margin:0 0 4px}
.meta-row .ic{font-size:14px}
.card-bottom{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}
.card-bottom .count{color:var(--muted);font-size:13px}
.card-bottom .btn{margin-inline-start:auto}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px}
.badge-feat{background:var(--accent-soft);color:#B26A00}
[data-theme="dark"] .badge-feat{color:var(--accent)}
.badge-ok{background:var(--secondary-soft);color:#0B7A6E}
[data-theme="dark"] .badge-ok{color:var(--secondary)}
.badge-soon{background:var(--primary-soft);color:var(--primary)}
.badge-verified{background:var(--secondary-soft);color:#0B7A6E}
[data-theme="dark"] .badge-verified{color:var(--secondary)}
.badge-unverified{background:#FDECEC;color:#B42318}
[data-theme="dark"] .badge-unverified{background:#3A1D1D;color:#FF9A94}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--primary-soft);color:var(--primary);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.chip.mint{background:var(--secondary-soft);color:#0B7A6E}
[data-theme="dark"] .chip.mint{color:var(--secondary)}
.star-btn{border:1px solid var(--line);background:var(--card);border-radius:10px;width:36px;height:36px;font-size:17px;color:var(--muted);display:inline-flex;align-items:center;justify-content:center}
.star-btn.on{color:#F5A623;border-color:#F5A623;background:var(--accent-soft)}
/* category cards */
.cat-card{cursor:pointer;text-align:start}
.cat-card .ic{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:14px}
.cat-card h3{font-size:17px}
.cat-card p{color:var(--muted);font-size:13.5px;margin:6px 0 12px;flex:1}
/* platforms */
.plat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.plat-card{text-align:center;align-items:center;padding:28px 18px}
.plat-card .logo{width:60px;height:60px;border-radius:18px;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;margin-bottom:12px}
.plat-card h3{font-size:17px}
.plat-card p{color:var(--muted);font-size:13.5px;flex:1}
/* how it works */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.step{position:relative}
.step .n{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;margin-bottom:14px;box-shadow:0 8px 18px rgba(102,87,232,.3)}
.step h3{font-size:18px}
.step p{color:var(--muted);font-size:14.5px}
/* toolbar: search + filters */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.toolbar .search-box{flex:1;min-width:220px;position:relative}
.toolbar .search-box input{padding-inline-start:40px}
.toolbar .search-box .mag{position:absolute;inset-inline-start:13px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.toolbar select{width:auto;min-width:160px}
.empty{text-align:center;padding:56px 20px;background:var(--card);border:1px dashed var(--line);border-radius:var(--radius)}
.empty .big{font-size:44px;margin-bottom:8px}
.empty h3{font-size:19px}
.empty p{color:var(--muted)}
/* tool detail */
.detail-head{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;margin-bottom:8px}
.detail-head .tile{width:64px;height:64px;border-radius:18px;font-size:28px}
.detail-head h1{font-size:30px;margin:0}
.detail-head .latin{color:var(--muted);direction:ltr;text-align:start}
.table-scroll{overflow-x:auto}
  .tools-table{width:100%;border-collapse:collapse;font-size:14px}
.tools-table th,.tools-table td{text-align:start;padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tools-table th{color:var(--muted);font-size:13px}
.tools-table code{white-space:nowrap}
.install-box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-bottom:18px}
.install-box h3{font-size:16px;margin-bottom:10px}
.copy-row{display:flex;gap:8px;align-items:stretch}
  .copy-row>*{min-width:0}
.copy-row pre{flex:1;margin:0}
.copy-btn{border:1px solid var(--line);background:var(--elev);border-radius:12px;padding:0 16px;font-weight:700;color:var(--text)}
/* forms */
.form-card{max-width:480px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:32px}
.form-card h1{font-size:24px;text-align:center}
.form-card .sub{text-align:center;color:var(--muted);font-size:14.5px}
.field{margin-bottom:16px}
.field .err{color:var(--danger);font-size:13px;margin-top:5px;display:none}
.field.invalid input,.field.invalid textarea{border-color:var(--danger)}
.field.invalid .err{display:block}
.alert{border-radius:12px;padding:12px 16px;font-size:14px;margin-bottom:16px}
.alert-ok{background:var(--secondary-soft);color:#0B7A6E}
[data-theme="dark"] .alert-ok{color:var(--secondary)}
.alert-err{background:#FDECEC;color:#B42318}
[data-theme="dark"] .alert-err{background:#3A1D1D;color:#FF9A94}
.alert-info{background:var(--primary-soft);color:var(--primary)}
.note{font-size:13px;color:var(--muted);background:var(--primary-soft);border-radius:12px;padding:12px 14px;margin-top:16px}
/* blog / tutorial */
.article-body{max-width:760px}
.article-body h2{font-size:22px;margin:28px 0 10px}
.article-body p{color:var(--muted);font-size:16px}
.article-body ol,.article-body ul{color:var(--muted);font-size:16px;line-height:1.9}
.post-meta{display:flex;gap:14px;color:var(--muted);font-size:13.5px;flex-wrap:wrap;margin-bottom:18px}
.cover{height:180px;border-radius:16px 16px 0 0;margin:-22px -22px 18px;display:flex;align-items:center;justify-content:center;font-size:52px;color:#fff}
.cover.g1{background:linear-gradient(135deg,#6657E8,#9B8CFF)}
.cover.g2{background:linear-gradient(135deg,#19C6B3,#5EEAD4)}
.cover.g3{background:linear-gradient(135deg,#F59E0B,#FFB86B)}
.cover.g4{background:linear-gradient(135deg,#0EA5E9,#38BDF8)}
.cover.g5{background:linear-gradient(135deg,#EC4899,#F9A8D4)}
/* dashboard */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:26px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.stat b{font-size:28px;display:block}
.stat span{color:var(--muted);font-size:13.5px}
/* footer */
footer.site{margin-top:90px;border-top:1px solid var(--line);background:var(--card)}
.foot-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:32px;padding:56px 0 32px}
.foot-grid h4{font-size:15px;margin:0 0 14px}
.foot-grid a{display:block;color:var(--muted);font-size:14px;margin-bottom:9px}
.foot-grid p{color:var(--muted);font-size:14px}
.foot-bottom{border-top:1px solid var(--line);padding:18px 0;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.socials{display:flex;gap:8px;margin-top:14px}
.socials a{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:16px}
.socials a:hover{color:var(--primary);border-color:var(--primary);text-decoration:none}
/* toast */
#toast{position:fixed;bottom:22px;inset-inline-start:50%;transform:translateX(50%);background:var(--navy);color:#fff;padding:12px 22px;border-radius:999px;font-size:14px;font-weight:600;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:100}
[dir="ltr"] #toast{transform:translateX(-50%)}
#toast.show{opacity:1}
[dir="rtl"] #toast{transform:translateX(50%)}
.skip{position:absolute;inset-inline-start:-9999px}
.skip:focus{position:fixed;inset-inline-start:16px;top:16px;z-index:200;background:var(--primary);color:#fff;padding:10px 18px;border-radius:999px}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:6px}
/* responsive */
@media (max-width:1020px){
  nav.main{display:none}
  .burger{display:inline-flex}
  .hero-grid{grid-template-columns:1fr;gap:36px}
  .hero h1{font-size:40px}
  .grid-4{grid-template-columns:repeat(2,1fr)}
  .grid-3{grid-template-columns:repeat(2,1fr)}
  .plat-grid{grid-template-columns:repeat(2,1fr)}
  .steps{grid-template-columns:1fr}
  .foot-grid{grid-template-columns:1fr 1fr}
  .stat-grid{grid-template-columns:1fr}
}
@media (max-width:600px){
  .section{padding:48px 0 4px}
  .hero{padding:40px 0 24px}
  .hero h1{font-size:32px}

  steps:{fa:["در Cursor مسیر Settings → MCP → Add new MCP server را باز کن.","Command را uvx و Args را [\"tcmb-mcp\"] بگذار.","ذخیره کن و مطمئن شو وضعیت سرور سبز است.","در چت Cursor بپرس: «ارزان‌ترین هدفون بی‌سیم در Hepsiburada چنده؟» — ولی اول سرور hepsiburada-mcp را اضافه کن."],
         tr:["Cursor'da Settings → MCP → Add new MCP server yolunu açın.","Command alanına uvx, Args alanına [\"tcmb-mcp\"] yazın.","Kaydedin ve sunucu durumunun yeşil olduğundan emin olun.","Cursor sohbetinde sorun: “Hepsiburada'daki en ucuz kablosuz kulaklık ne kadar?” — önce hepsiburada-mcp sunucusunu ekleyin."],
         en:["In Cursor open Settings → MCP → Add new MCP server.","Set Command to uvx and Args to [\"tcmb-mcp\"].","Save and make sure the server status is green.","In the Cursor chat ask: “What is the cheapest wireless earphone on Hepsiburada?” — first add the hepsiburada-mcp server."]}},
 {id:"claude-desktop",level:"intermediate",mins:8,cat:"setup",
  title:{fa:"پیکربندی Claude Desktop",tr:"Claude Desktop yapılandırması",en:"Configure Claude Desktop"},

  steps:{fa:["فایل پیکربندی را باز کن: در macOS مسیر ~/Library/Application Support/Claude/claude_desktop_config.json و در ویندوز %APPDATA%\\Claude\\claude_desktop_config.json","این بخش را اضافه کن: {\"mcpServers\": {\"tcmb\": {\"command\": \"uvx\", \"args\": [\"tcmb-mcp\"]}}}","فایل را ذخیره کن و Claude Desktop را کاملاً ببند و دوباره باز کن.","اگر سرور در چت ظاهر نشد، مسیر نصب uvx را بررسی کن (which uvx)."],
         tr:["Yapılandırma dosyasını açın: macOS'ta ~/Library/Application Support/Claude/claude_desktop_config.json, Windows'ta %APPDATA%\\Claude\\claude_desktop_config.json","Şu bölümü ekleyin: {\"mcpServers\": {\"tcmb\": {\"command\": \"uvx\", \"args\": [\"tcmb-mcp\"]}}}","Dosyayı kaydedin ve Claude Desktop'ı tamamen kapatıp yeniden açın.","Sunucu sohbette görünmezse uvx kurulum yolunu kontrol edin (which uvx)."],

 {id:"troubleshooting",level:"intermediate",mins:7,cat:"fix",
  title:{fa:"عیب‌یابی: وقتی سرور بالا نمی‌آید",tr:"Sorun giderme: sunucu başlamadığında",en:"Troubleshooting: when a server won't start"},
  ex:{fa:"رایج‌ترین خطاها و راه‌حل آن‌ها: uvx پیدا نمی‌شود، سرور متصل نمی‌شود، پاسخ خالی برمی‌گردد.",tr:"En yaygın hatalar ve çözümleri: uvx bulunamadı, sunucu bağlanmadı, boş yanıt döndü.",en:"The most common errors and their fixes: uvx not found, server won't connect, empty replies."},
  steps:{fa:["«uvx: command not found» یعنی uv نصب نیست: pip install uv را اجرا کن و ترمینال را دوباره باز کن.","اگر سرور در Claude Code لیست نمی‌شود، دستور add را دوباره با --scope user اجرا کن.","اگر پاسخ خالی برگشت، اتصال اینترنت را بررسی کن — سرورها داده را زنده از سایت‌ها می‌خوانند.","اگر خطا ادامه داشت، با دستور uvx tcmb-mcp سرور را مستقیم اجرا کن و متن خطا را در گیت‌هاب سرور گزارش کن."],
         tr:["“uvx: command not found” uv'nin kurulu olmadığı anlamına gelir: pip install uv çalıştırın ve terminali yeniden açın.","Sunucu Claude Code'da listelenmiyorsa add komutunu --scope user ile yeniden çalıştırın.","Boş yanıt geliyorsa internet bağlantısını kontrol edin — sunucular veriyi sitelerden canlı okur.","Hata sürerse sunucuyu uvx tcmb-mcp ile doğrudan çalıştırın ve hata metnini sunucunun GitHub sayfasında bildirin."],
         en:["“uvx: command not found” means uv is not installed: run pip install uv and reopen the terminal.","If the server is not listed in Claude Code, run the add command again with --scope user.","If replies come back empty, check your internet connection — the servers read data live from the sites.","If the error persists, run the server directly with uvx tcmb-mcp and report the error text on the server's GitHub page."]}}

const ARTICLES = [
 {id:"what-is-mcp",cat:"basics",date:"2026-11-05",mins:6,cover:"g1",icon:"🔌",
  title:{fa:"MCP چیست؟ به زبان ساده",tr:"MCP nedir? Sade bir dille",en:"What is MCP, in plain language"},
  ex:{fa:"پروتکل اتصال هوش مصنوعی به دنیای واقعی — بدون اصطلاحات پیچیده، با مثال‌های واقعی.",tr:"Yapay zekâyı gerçek dünyaya bağlayan protokol — karmaşık terimler olmadan, gerçek örneklerle.",en:"The protocol that connects AI to the real world — no jargon, with real examples."},
  body:{fa:["مدل‌های هوش مصنوعی متن می‌نویسند، اما به‌تنهایی به دنیای بیرون دسترسی ندارند: نمی‌دانند قیمت دلار امروز چقدر است، در فروشگاه چه کالایی موجود است یا فردا چه اتوبوسی از استانبول به آنکارا می‌رود. MCP یا «پروتکل زمینهٔ مدل» (Model Context Protocol) یک قرارداد استاندارد است که به دستیار هوش مصنوعی اجازه می‌دهد با ابزارهای بیرونی صحبت کند.","به زبان ساده: MCP یک «پریز استاندارد» است. هر سرویس — فروشگاه، سایت آگهی، بانک مرکزی — یک «دوشاخه» می‌سازد و دستیار شما می‌تواند آن را وصل کند و سؤال شما را به یک فراخوانی ابزار تبدیل کند. بدون MCP، هر اتصال یک کار سفارشی و یک‌باره بود؛ با MCP، یک بار وصل می‌شوی و همه‌جا کار می‌کند.","سرورهای این کاتالوگ دقیقاً همین کار را می‌کنند: هر کدام یک سرویس ترکیه را — مثلاً Hepsiburada یا obilet — به دستیار شما وصل می‌کنند. همه فقط‌خواندنی‌اند: داده می‌خوانند، اما هرگز وارد حساب شما نمی‌شوند، خرید نمی‌کنند و چیزی را تغییر نمی‌دهند.","برای شروع، کافی است یک سرور را با uvx نصب کنی و آن را به Claude Code یا Cursor وصل کنی. از آن لحظه، به‌جای باز کردن ده تب مرورگر، از دستیارت می‌پرسی — و جواب را با عدد و منبع می‌گیری."],
         tr:["Yapay zekâ modelleri metin yazar, ancak tek başlarına dış dünyaya erişemezler: bugünkü dolar kurunu, mağazada hangi ürünün stokta olduğunu veya yarın İstanbul'dan Ankara'ya hangi otobüsün gittiğini bilemezler. MCP (Model Context Protocol — Model Bağlam Protokolü), yapay zekâ asistanının dış araçlarla konuşmasını sağlayan standart bir sözleşmedir.","Basitçe söylemek gerekirse MCP standart bir “priz”dir. Her hizmet — mağaza, ilan sitesi, merkez bankası — bir “fiş” yapar ve asistanınız onu takıp sorunuzu bir araç çağrısına dönüştürebilir. MCP olmadan her bağlantı özel ve tek seferlik bir işti; MCP ile bir kez bağlanırsınız ve her yerde çalışır.","Bu katalogdaki sunucular tam olarak bunu yapar: her biri bir Türkiye servisini — örneğin Hepsiburada veya obilet — asistanınıza bağlar. Hepsi salt okunurdur: veri okurlar ama asla hesabınıza girmez, satın alma yapmaz ve hiçbir şeyi değiştirmezler.","Başlamak için bir sunucuyu uvx ile kurup Claude Code veya Cursor'a bağlamanız yeterlidir. O andan itibaren on sekme açmak yerine asistanınıza sorarsınız — ve yanıtı sayı ve kaynakla alırsınız."],
         en:["AI models write text, but on their own they cannot reach the outside world: they don't know today's dollar rate, which products are in stock, or which bus leaves Istanbul for Ankara tomorrow. MCP — the Model Context Protocol — is a standard contract that lets an AI assistant talk to outside tools.","Simply put, MCP is a standard “socket”. Every service — a shop, a listings site, a central bank — builds a “plug”, and your assistant can connect it and turn your question into a tool call. Without MCP, every connection was a custom one-off job; with MCP, you connect once and it works everywhere.","The servers in this catalog do exactly that: each one connects a Turkish service — Hepsiburada or obilet, for example — to your assistant. All of them are read-only: they read data but never log in to your account, never buy anything and never change anything.","To start, just install a server with uvx and connect it to Claude Code or Cursor. From then on, instead of opening ten browser tabs, you ask your assistant — and get the answer with numbers and a source."]}},
 {id:"choose-client",cat:"guides",date:"2026-11-04",mins:5,cover:"g2",icon:"🧭",
  title:{fa:"کدام کلاینت MCP برای شما مناسب است؟",tr:"Hangi MCP istemcisi size uygun?",en:"Which MCP client is right for you?"},
  ex:{fa:"Claude Code، Cursor، Claude Desktop یا VS Code — انتخاب درست به روش کارت بستگی دارد.",tr:"Claude Code, Cursor, Claude Desktop veya VS Code — doğru seçim çalışma şeklinize bağlıdır.",en:"Claude Code, Cursor, Claude Desktop or VS Code — the right choice depends on how you work."},
  body:{fa:["اگر بیشتر در ترمینال کار می‌کنی، Claude Code سریع‌ترین راه است: یک دستور، و سرور وصل است. برای کسانی که با خط فرمان راحت‌اند، هیچ راه ساده‌تری نیست.","اگر برنامه‌نویس هستی و در ویرایشگر کد زندگی می‌کنی، Cursor یا VS Code انتخاب طبیعی است؛ سرور در کنار کدت قرار می‌گیرد و می‌توانی از دستیار بخواهی هم‌زمان کد و دادهٔ واقعی را ببیند.","اگر فقط می‌خواهی گفت‌وگو کنی و سؤال بپرسی، Claude Desktop ساده‌ترین گزینه است: یک بار فایل پیکربندی را ویرایش می‌کنی و بعد همه‌چیز در چت است.","یک نکتهٔ مهم: سرورهای محلی (stdio) فقط روی کامپیوتر خودت اجرا می‌شوند. نسخهٔ وب ChatGPT و Gemini فعلاً با این سرورها تأیید نشده‌اند — پس اگر از نسخهٔ وب استفاده می‌کنی، سراغ کلاینت‌های دسکتاپ یا خط فرمان برو."],
         tr:["Çoğunlukla terminalde çalışıyorsanız Claude Code en hızlı yoldur: tek komut ve sunucu bağlanır. Komut satırıyla rahat olanlar için daha kolayı yoktur.","Programcıysanız ve kod düzenleyicide yaşıyorsanız Cursor veya VS Code doğal seçimdir; sunucu kodunuzun yanında durur ve asistandan kodu ve gerçek veriyi aynı anda görmesini isteyebilirsiniz.","Yalnızca sohbet etmek ve soru sormak istiyorsanız Claude Desktop en basit seçenektir: yapılandırma dosyasını bir kez düzenlersiniz, sonrası sohbettedir.","Önemli bir not: yerel (stdio) sunucular yalnızca kendi bilgisayarınızda çalışır. ChatGPT ve Gemini'nin web sürümleri bu sunucularla henüz doğrulanmadı — web sürümü kullanıyorsanız masaüstü veya komut satırı istemcilerini tercih edin."],
         en:["If you mostly live in the terminal, Claude Code is the fastest path: one command and the server is connected. For anyone comfortable with the command line, there is nothing simpler.","If you are a programmer who lives in a code editor, Cursor or VS Code is the natural choice; the server sits next to your code and you can ask the assistant to see code and real data at the same time.","If you only want to chat and ask questions, Claude Desktop is the simplest option: you edit the config file once, and afterwards everything happens in the chat.","One important note: local (stdio) servers run only on your own computer. The web versions of ChatGPT and Gemini are not yet verified with these servers — so if you use the web version, pick a desktop or command-line client instead."]}},
 {id:"turkey-servers",cat:"guides",date:"2026-11-03",mins:7,cover:"g3",icon:"🇹🇷",
  title:{fa:"سرورهای ترکیه چطور کار می‌کنند؟",tr:"Türkiye sunucuları nasıl çalışır?",en:"How do the Turkey servers work?"},
  ex:{fa:"پشت صحنهٔ بیست‌ودو سرور فقط‌خواندنی: از کجا داده می‌خوانند، چه چیزی را نمی‌توانند انجام دهند و چرا امن‌اند.",tr:"Yirmi iki salt okunur sunucunun perde arkası: veriyi nereden okurlar, neyi yapamazlar ve neden güvenlidirler.",en:"Behind the scenes of twenty-two read-only servers: where they read data, what they cannot do, and why they are safe."},
  body:{fa:["هر سرور این کاتالوگ یک برنامهٔ کوچک پایتون است که با uvx اجرا می‌شود. وقتی دستیارت سؤالی می‌پرسد — مثلاً «ارزان‌ترین هدفون بی‌سیم چنده؟» — سرور به سایت مربوطه سر می‌زند، صفحه را می‌خواند و جواب ساخت‌یافته برمی‌گرداند.","داده‌ها همیشه زنده‌اند: نرخ ارز از XML رسمی بانک مرکزی ترکیه خوانده می‌شود، قیمت کالا از صفحهٔ فروشگاه، و ساعت اتوبوس از obilet. هیچ پایگاه دادهٔ قدیمی و هیچ عدد حدسی در میان نیست.","مهم‌ترین اصل طراحی این سرورها «فقط‌خواندنی» بودن است. آن‌ها هیچ حساب کاربری، رمز عبور یا توکنی ندارند؛ نمی‌توانند وارد حسابت شوی، خرید کنند یا رزرو انجام دهند. بدترین کاری که یک سرور خراب می‌تواند بکند، برگرداندن یک جواب اشتباه است — و تو همیشه می‌توانی آن را با باز کردن سایت بررسی کنی.","همهٔ سرورها متن‌باز‌اند و کدشان در گیت‌هاب است. اگر کنجکاوی، می‌توانی دقیقاً ببینی هر ابزار چه درخواستی می‌فرستد و چه چیزی برمی‌گرداند. شفافیت، به‌جای اعتماد کورکورانه، اصل این پروژه است."],
         tr:["Bu katalogdaki her sunucu uvx ile çalışan küçük bir Python programıdır. Asistanınız bir soru sorduğunda — örneğin “en ucuz kablosuz kulaklık ne kadar?” — sunucu ilgili siteye gider, sayfayı okur ve yapılandırılmış bir yanıt döndürür.","Veriler her zaman canlıdır: döviz kuru Türkiye Cumhuriyet Merkez Bankası'nın resmi XML'inden, ürün fiyatı mağaza sayfasından, otobüs saati obilet'ten okunur. Eski bir veritabanı ve tahminî sayı yoktur.","Bu sunucuların en önemli tasarım ilkesi “salt okunur” olmalarıdır. Hiçbir kullanıcı hesabı, şifre veya jetonları yoktur; hesabınıza giremez, satın alma yapamaz veya rezervasyon yapamazlar. Bozuk bir sunucunun yapabileceği en kötü şey yanlış bir yanıt döndürmektir — ve bunu siteyi açarak her zaman doğrulayabilirsiniz.","Tüm sunucular açık kaynaklıdır ve kodları GitHub'dadır. Merak ediyorsanız her aracın tam olarak hangi isteği gönderdiğini ve ne döndürdüğünü görebilirsiniz. Kör güven yerine şeffaflık bu projenin ilkesidir."],
         en:["Each server in this catalog is a small Python program that runs with uvx. When your assistant asks a question — “what is the cheapest wireless earphone?” — the server visits the relevant site, reads the page and returns a structured answer.","The data is always live: exchange rates come from the Central Bank of Türkiye's official XML, product prices from the shop page, and bus times from obilet. There is no stale database and no guessed numbers.","The most important design principle of these servers is that they are read-only. They have no user account, no password and no token; they cannot log in to your account, buy anything or make a reservation. The worst thing a broken server can do is return a wrong answer — and you can always check it by opening the site.","All servers are open source and their code is on GitHub. If you are curious, you can see exactly what request each tool sends and what it returns. Transparency, instead of blind trust, is this project's principle."]}}
];

const LANGS = {fa:{name:"فارسی",dir:"rtl",locale:"fa-IR"},tr:{name:"Türkçe",dir:"ltr",locale:"tr-TR"},en:{name:"English",dir:"ltr",locale:"en-US"}};

/* ---------------- state & helpers ---------------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const state = {
  lang: store.get("tmp_lang", null) || ((navigator.language||"fa").slice(0,2)==="tr"?"tr":(navigator.language||"").slice(0,2)==="en"?"en":"fa"),
  theme: store.get("tmp_theme", null) || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"),
  page: "home", param: null, anchor: null
};
if(!["fa","tr","en"].includes(state.lang)) state.lang = "fa";
function t(k){ const d = I18N[state.lang]||I18N.en; return d[k]!==undefined?d[k]:(I18N.en[k]!==undefined?I18N.en[k]:k); }
function L(obj){ return obj ? (obj[state.lang]!==undefined?obj[state.lang]:obj.en) : ""; }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
function loc(){ return LANGS[state.lang].locale; }
function fmtNum(n){ try{ return new Intl.NumberFormat(loc()).format(n); }catch(e){ return String(n); } }
function fmtDate(iso){ try{ return new Intl.DateTimeFormat(loc(),{year:"numeric",month:"long",day:"numeric"}).format(new Date(iso+"T00:00:00")); }catch(e){ return iso; } }
function hashFor(page, param){ return "#/" + state.lang + "/" + page + (param?"/"+param:""); }
function catName(id){ return t("cat_"+id.replace("-","_")) || id; }
function catDesc(id){ return t("cat_"+id.replace("-","_")+"_d") || ""; }
function serverDesc(s){ return state.lang==="fa"?s.desc_fa:state.lang==="tr"?s.desc_tr:s.desc; }
function toolSum(tl){ return state.lang==="fa"?tl.sf:state.lang==="tr"?tl.st:tl.s; }
function skillTag(k){ return state.lang==="fa"?k.tag_fa:state.lang==="tr"?k.tag_tr:k.tag; }
function skillGap(k){ return state.lang==="fa"?k.gap_fa:state.lang==="tr"?k.gap_tr:k.gap; }
function favs(){ return store.get("tmp_favs_v1", []); }
function isFav(type,id){ return favs().some(f=>f.type===type&&f.id===id); }
function recent(){ return store.get("tmp_recent_v1", []); }
function pushRecent(type,id){ let r = recent().filter(x=>!(x.type===type&&x.id===id)); r.unshift({type,id,at:Date.now()}); store.set("tmp_recent_v1", r.slice(0,8)); }
function toast(msg){ const el=document.getElementById("toast"); if(!el) return; el.textContent=msg; el.classList.add("show"); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove("show"),2600); }
function copyText(txt, msg){ const done=()=>toast(msg||t("tool_copied"));
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt,done)); }
  else fallbackCopy(txt,done); }
function fallbackCopy(txt, done){ const ta=document.createElement("textarea"); ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); }catch(e){} document.body.removeChild(ta); done(); }

/* ---------------- router ---------------- */
const PAGES = ["home","marketplace","tool","categories","skills","skill","tutorials","tutorial","blog","article","about","contact","favorites","ask"];
function parseHash(){
  const raw = location.hash||"";
  if(raw && !raw.startsWith("#/")){
    const id = raw.slice(1);
    if(/^[A-Za-z][\w-]*$/.test(id)){ state.anchor = id; return; }
  }
  const h = raw.replace(/^#\/?/,"");
  const parts = h.split("/").filter(Boolean);
  let lang = parts[0], page = parts[1]||"home", param = parts[2]||null;
  if(!["fa","tr","en"].includes(lang)){ lang = state.lang; page = parts[0]||"home"; param = parts[1]||null; }
  if(!PAGES.includes(page)){ state.page="404"; state.param=page; state.lang=lang; return; }
  state.lang = lang; state.page = page; state.param = param;
}
function go(page, param){ location.hash = hashFor(page, param); window.scrollTo({top:0}); }

const mp = { q:"", cat:"all", platform:"all", conn:"all", status:"all", sort:"popular" };
function mpFiltered(){
  let list = SERVERS.slice();
  const q = mp.q.trim().toLowerCase();
  if(q) list = list.filter(s => (s.id+" "+s.title+" "+s.title_tr+" "+serverDesc(s)+" "+s.tools.map(x=>x.n+" "+toolSum(x)).join(" ")).toLowerCase().includes(q));
  if(mp.cat!=="all") list = list.filter(s=>s.cat===mp.cat);
  if(mp.status==="available") list = list.filter(()=>true);
  if(mp.sort==="popular") list.sort((a,b)=>b.tools.length-a.tools.length || a.id.localeCompare(b.id));
  if(mp.sort==="newest") list.sort((a,b)=>b.added-a.added);
  if(mp.sort==="alpha") list.sort((a,b)=>a.id.localeCompare(b.id));
  return list;
}
function mpMatches(q){
  const s = q.trim().toLowerCase(); if(!s) return {skills:[],tuts:[],arts:[]};
  return {
    skills: SKILLS.filter(k=>(k.id+" "+skillTag(k)).toLowerCase().includes(s)),

}

/* ---------------- demo typing ---------------- */
let demoIdx = 0, demoTimer = null, typeToken = 0;
function typeText(el, text, speed, token){
  return new Promise(res=>{
    let i=0;
    (function tick(){
      if(token!==typeToken || !document.body.contains(el)) return res();
      el.textContent = text.slice(0, ++i);
      if(i<text.length) setTimeout(tick, speed); else res();
    })();
  });
}
function hlCode(code){
  const m = code.match(/^([a-z0-9_]+)(\(.*\))$/);
  if(!m) return esc(code);
  let args = esc(m[2]).replace(/(&quot;|")([^"]*)(&quot;|")/g, '<span class="str">"$2"</span>');
  return '<span class="fn">'+esc(m[1])+'</span><span class="arg">'+args+'</span>';
}
async function showDemo(){
  const token = ++typeToken;
  const body = document.getElementById("demo-body");
  const tabs = document.getElementById("demo-tabs");
  if(!body || !tabs) return;
  const d = DEMOS[demoIdx];
  tabs.innerHTML = DEMOS.map((x,i)=>`<button data-i="${i}" class="${i===demoIdx?"active":""}" onclick="App.demoTab(${i})">${esc(x.tab[state.lang])}</button>`).join("");
  body.innerHTML = `<p class="q"><span class="typed"></span><span class="cursor"></span></p><pre style="visibility:hidden"><code></code></pre><p class="status"></p><p class="a"></p><p class="ask"></p>`;
  await typeText(body.querySelector(".typed"), d.q[state.lang], 26, token);
  if(token!==typeToken || !document.body.contains(body)) return;
  const pre = body.querySelector("pre");
  pre.style.visibility = "visible";
  pre.querySelector("code").innerHTML = hlCode(d.code);
  body.querySelector(".status").textContent = d.status[state.lang];
  body.querySelector(".a").textContent = d.a[state.lang];
  body.querySelector(".ask").innerHTML = `<a href="${hashFor("marketplace")}">${esc(t("demo_ask"))}</a> · ${esc(t("demo_nosignup"))}`;
}
function startDemo(){
  clearInterval(demoTimer);
  demoTimer = setInterval(()=>{ demoIdx = (demoIdx+1)%DEMOS.length; showDemo(); }, 11000);
  showDemo();
}
function stopDemo(){ clearInterval(demoTimer); typeToken++; }

 {cats:["sports"], kw:{fa:["فوتبال","لیگ","جدول","گلزن","نتیجه بازی"],tr:["futbol","lig","puan durumu","gol kralı","skor","maç"],en:["football","soccer","league","table","scorer","score","match"]}},
 {cats:["jobs"], kw:{fa:["شغل","استخدام","کار","آگهی استخدام","برنامه نویس"],tr:["iş","kariyer","iş ilanı","yazılımcı"],en:["job","career","hiring","employment","developer"]}},
 {cats:["news"], kw:{fa:["خبر","اخبار","روزنامه"],tr:["haber","gündem","gazete"],en:["news","headline"]}},
 {cats:["grocery"], kw:{fa:["سوپرمارکت","خواربار","خرید هفتگی","مواد غذایی"],tr:["market","süpermarket","gıda","haftalık"],en:["grocery","supermarket","groceries"]}},
 {cats:["entertainment"], kw:{fa:["فیلم","سریال","سینما","پخش"],tr:["film","dizi","sinema","yayın"],en:["movie","film","series","cinema","streaming"]}},
 {cats:["real-estate"], kw:{fa:["خانه","آپارتمان","ملک","اجاره","خرید خانه"],tr:["ev","daire","emlak","kira","satılık"],en:["house","apartment","real estate","rent"]}},
 {cats:["services"], kw:{fa:["خدمات","تعمیر","نظافت","لوله کش"],tr:["hizmet","tamir","temizlik","tesisat"],en:["service","repair","cleaning","plumber"]}}
];
function askNorm(s){
  return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/ي/g,"ی").replace(/ك/g,"ک").replace(/ة/g,"ه")
    .replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d))
    .replace(/[^a-z0-9\u0600-\u06FF ]/g," ").replace(/\s+/g," ").trim();
}
function askTokens(q){ return askNorm(q).split(" ").filter(w=>w.length>1); }
function askHay(s){
  return askNorm([s.id, s.title, s.title_tr||"", s.desc, s.desc_fa, s.desc_tr||"", s.cat,
    s.tools.map(x=>x.n+" "+x.s+" "+(x.sf||"")+" "+(x.st||"")).join(" ")].join(" "));
}
function askScore(q){
  const toks = askTokens(q);
  if(!toks.length) return [];
  const intents = ASK_INTENTS.map(it=>{
    const kws = Object.keys(it.kw).reduce((a,k)=>a.concat(it.kw[k].map(askNorm)),[]);
    const hit = [];
    toks.forEach(w=>{
      kws.forEach(k=>{
        k.split(" ").forEach(kw=>{
          if(kw && (kw===w || (kw.length>=3 && w.indexOf(kw)>=0) || (w.length>3 && kw.indexOf(w)>=0)) && hit.indexOf(kw)<0) hit.push(kw);
        });
      });
    });
    return {cats:it.cats, hit};
  }).filter(x=>x.hit.length);
  return SERVERS.map(s=>{
    const hay = askHay(s);
    let score = 0; const matched = [];
    toks.forEach(w=>{ if(hay.indexOf(w)>=0){ score += 2; if(matched.indexOf(w)<0) matched.push(w); } });
    intents.forEach(it=>{
      if(it.cats.indexOf(s.cat)>=0){ score += 3*it.hit.length; it.hit.forEach(kw=>{ if(matched.indexOf(kw)<0) matched.push(kw); }); }
    });
    return {s, score, matched};
  }).filter(r=>r.score>0).sort((a,b)=>b.score-a.score).slice(0,3);
}
function askCard(r){
  const s = r.s;
  const cmd = "uvx " + s.pypi;
  const tools = s.tools.slice(0,3).map(x=>`<code>${esc(x.n)}</code>`).join(" · ");
  return `<article class="card" style="margin-bottom:16px">
    <div class="card-top">
      <span class="tile" style="background:${s.color}">${s.letter}</span>
      <div style="flex:1;min-width:0"><h3>${esc(s.title.split(" — ")[0])}</h3><p class="latin">${esc(s.id)}</p></div>
      ${starBtn("server", s.id)}
    </div>
    <p class="desc">${esc(serverDesc(s))}</p>
    <p class="meta-row"><span class="ic">🎯</span> ${t("ask_why")}: ${r.matched.map(m=>`<span class="chip">${esc(m)}</span>`).join(" ")}</p>
    <p class="meta-row"><span class="ic">▦</span> ${esc(catName(s.cat))} · ${fmtNum(s.tools.length)} ${t("tools_count")}</p>
    <p style="font-size:13.5px;color:var(--muted)">${tools}${s.tools.length>3?` · +${fmtNum(s.tools.length-3)}`:""}</p>
    <div class="install-box" style="margin-top:14px"><h3>${t("ask_install")}</h3><div class="copy-row"><pre><code>${esc(cmd)}</code></pre><button class="copy-btn" onclick="App.copy('${esc(cmd)}')">${t("tool_copy")}</button></div></div>
    <div class="card-bottom">
      <a class="btn btn-primary btn-sm" href="${hashFor("tool", s.id)}">${t("details")}</a>
      <a class="btn btn-ghost btn-sm" href="${s.repo}" target="_blank" rel="noopener">${t("tool_repo")} ↗</a>
      <a class="btn btn-ghost btn-sm" href="https://pypi.org/project/${s.pypi}/" target="_blank" rel="noopener">${t("tool_pypi")} ↗</a>
    </div>
  </article>`;
}
function askNoMatchHTML(){
  const liveCats = CATEGORIES.filter(c=>!c.soon);
  return `<div class="empty"><div class="big">🧭</div><h3>${t("ask_no_match")}</h3><p>${t("ask_no_match_hint")}</p>
  <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:16px">${liveCats.map(c=>`<a class="chip" href="${hashFor("categories")}">${esc(c.icon)} ${esc(catName(c.id))}</a>`).join("")}</div>
  <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:18px">
    <a class="btn btn-primary btn-sm" href="${hashFor("marketplace")}">${t("ask_browse")}</a>
    <a class="btn btn-ghost btn-sm" href="https://mohammad-abbasi-sh.github.io/iran-mcp-router/" target="_blank" rel="noopener">${t("ask_iran")} ↗</a>
  </div></div>`;
}
function askResultsHTML(q, res){
  if(!q || !askTokens(q).length) return `<p style="color:var(--muted)">${t("ask_start")}</p>`;
  if(!res.length) return askNoMatchHTML();
  return `<h2 style="font-size:20px">${t("ask_top")}</h2><div style="margin-top:14px">${res.map(askCard).join("")}</div>`;
}
function askHTML(){
  const q = ASK_STATE.q;
  const chips = ASK_CHIPS[state.lang]||ASK_CHIPS.en;
  const res = q ? askScore(q) : [];
  return `<section class="section"><div class="wrap">
    <p><a href="${hashFor("home")}">← ${t("back")}</a></p>
    <h1>${t("ask_title")}</h1>
    <p style="color:var(--muted);max-width:760px">${t("ask_sub")}</p>
    <div class="note">${t("ask_hint")}</div>
    <form onsubmit="return App.askSubmit(event)" style="margin-top:22px">
      <div class="toolbar"><div class="search-box"><span class="mag">🔍</span><input id="ask-q" type="search" placeholder="${esc(t("ask_ph"))}" value="${esc(q)}" oninput="App.askSearch(this.value)" aria-label="${esc(t("ask_ph"))}"></div>
      <button class="btn btn-primary" type="submit">${t("ask_btn")}</button></div>
    </form>
    <p style="margin-top:4px"><strong>${t("ask_examples")}</strong></p>
    <div style="display:flex;gap:8px;flex-wrap:wrap">${chips.map(c=>`<button type="button" class="chip" style="cursor:pointer" onclick="App.askChip(this.textContent)">${esc(c)}</button>`).join("")}</div>
    <div id="ask-results" style="margin-top:26px">${askResultsHTML(q,res)}</div>
    <div class="note">${t("ask_cross")} <a href="https://mohammad-abbasi-sh.github.io/germany-mcp/#/ask/" target="_blank" rel="noopener">${t("ask_x_de")}</a> · <a href="https://mohammad-abbasi-sh.github.io/iran-mcp-router/" target="_blank" rel="noopener">${t("ask_x_ir")}</a></div>
  </div></section>`;
}

function pageHTML(){
  switch(state.page){
    case "home": return homeHTML();
    case "marketplace": return marketplaceHTML();
    case "tool": return toolHTML(state.param);
    case "categories": return categoriesHTML();
    case "skills": return skillsHTML();
    case "skill": return skillHTML(state.param);
    case "tutorials": return tutorialsHTML();
    case "tutorial": return tutorialHTML(state.param);
    case "blog": return blogHTML();
    case "article": return articleHTML(state.param);
    case "about": return aboutHTML();
    case "contact": return contactHTML();
    case "favorites": return favoritesHTML();
    case "ask": return askHTML();
    default: return notFoundHTML();
  }
}
function pageTitle(){
  const base = "Turkey MCP";
  const map = {home:t("hero_title"),marketplace:t("mp_title"),categories:t("cats_page_title"),skills:t("skills_page_title"),tutorials:t("tut_page_title"),blog:t("blog_page_title"),about:t("about_title"),contact:t("contact_title"),favorites:t("fav_title"),ask:t("ask_title"),"404":t("nf_title")};
  if(state.page==="tool"){ const s=SERVERS.find(x=>x.id===state.param); return s? s.title+" — "+base : base; }
  if(state.page==="skill"){ const k=SKILLS.find(x=>x.id===state.param); return k? k.id+" — "+base : base; }
  if(state.page==="tutorial"){ const x=TUTORIALS.find(v=>v.id===state.param); return x? L(x.title)+" — "+base : base; }
  if(state.page==="article"){ const a=ARTICLES.find(v=>v.id===state.param); return a? L(a.title)+" — "+base : base; }
  return (map[state.page]||t("hero_title"))+" — "+base;
}
function render(){
  parseHash();
  stopDemo();
  document.documentElement.lang = state.lang;
  document.documentElement.dir = LANGS[state.lang].dir;
  document.documentElement.setAttribute("data-theme", state.theme);
  document.title = pageTitle();
  const md = document.querySelector('meta[name="description"]');
  if(md) md.setAttribute("content", t("hero_sub"));
  const app = document.getElementById("app");
  app.innerHTML = headerHTML() + '<main id="main">' + pageHTML() + '</main>' + footerHTML();
  const skip = document.querySelector(".skip"); if(skip) skip.textContent = t("a11y_skip");
  if(state.anchor){ const el=document.getElementById(state.anchor); if(el) el.scrollIntoView(); state.anchor=null; }
  if(state.page==="home") startDemo();
}

/* ---------------- App actions ---------------- */
window.App = {
  setLang(l){ if(!LANGS[l]) return; state.lang=l; store.set("tmp_lang", l);
    const h=(location.hash||"").replace(/^#\/?/,""); const parts=h.split("/").filter(Boolean);
    if(["fa","tr","en"].includes(parts[0])) parts[0]=l; else parts.unshift(l);
    location.hash = "#/"+parts.join("/"); render(); },
  toggleTheme(){ state.theme = state.theme==="dark"?"light":"dark"; store.set("tmp_theme", state.theme); document.documentElement.setAttribute("data-theme", state.theme); const b=document.querySelector('button[onclick="App.toggleTheme()"]'); if(b){ const l=t(state.theme==="dark"?"theme_light":"theme_dark"); b.textContent=state.theme==="dark"?"☀️":"🌙"; b.setAttribute("aria-label",l); b.setAttribute("title",l); } },
  toggleMenu(){ const m=document.getElementById("mobile-menu"); if(m) m.classList.toggle("open"); },
  toggleFav(type,id,ev){ if(ev) ev.stopPropagation();
    let f = favs(); const i = f.findIndex(x=>x.type===type&&x.id===id);
    if(i>=0){ f.splice(i,1); toast(t("fav_removed")); } else { f.push({type,id}); toast(t("fav_added")); }
    store.set("tmp_favs_v1", f); render(); },
  copy(txt){ copyText(txt); },
  demoTab(i){ demoIdx=i; showDemo(); },
  heroSearch(ev){ ev.preventDefault(); const q=document.getElementById("hero-q"); mp.q=q?q.value:""; mp.cat="all"; go("marketplace"); render(); return false; },
  askSearch(v){ ASK_STATE.q=v; const el=document.getElementById("ask-results"); if(el) el.innerHTML=askResultsHTML(v,askScore(v)); },
  askChip(txt){ ASK_STATE.q=txt.trim(); const inp=document.getElementById("ask-q"); if(inp) inp.value=ASK_STATE.q; const el=document.getElementById("ask-results"); if(el) el.innerHTML=askResultsHTML(ASK_STATE.q,askScore(ASK_STATE.q)); },
  askSubmit(ev){ ev.preventDefault(); const inp=document.getElementById("ask-q"); ASK_STATE.q=inp?inp.value:""; const el=document.getElementById("ask-results"); if(el) el.innerHTML=askResultsHTML(ASK_STATE.q,askScore(ASK_STATE.q)); return false; },
  openCategory(id){ mp.cat=id; mp.q=""; go("marketplace"); render(); },
  mpSearch(v){ mp.q=v; const el=document.getElementById("mp-results"); if(el) el.innerHTML=mpResultsHTML(); },
  mpFilter(k,v){ mp[k]=v; const el=document.getElementById("mp-results"); if(el) el.innerHTML=mpResultsHTML(); },
  skillSearch(v){ skillsHTML._q=v; const el=document.getElementById("skills-results"); if(!el) return;
    const q=v.trim().toLowerCase(); const cat=skillsHTML._cat||"all";
    const list=SKILLS.filter(k=>(!q||(k.id+" "+skillTag(k)+" "+skillGap(k)).toLowerCase().includes(q))&&(cat==="all"||k.cat===cat));
    el.innerHTML = list.length?`<div class="grid grid-3">${list.map(skillCard).join("")}</div>`:emptyHTML(); },
  skillFilter(v){ skillsHTML._cat=v; App.skillSearch(skillsHTML._q||""); },
};

/* ---------------- init ---------------- */
window.addEventListener("hashchange", ()=>{ render(); const h=location.hash||""; if(h.startsWith("#/") || !h) window.scrollTo({top:0}); });
if(!location.hash) location.hash = "#/"+state.lang+"/";
render();
</script>
