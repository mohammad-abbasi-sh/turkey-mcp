const APP_CONFIG_FILE = {"claude-desktop":"claude_desktop_config.json","cursor":"mcp.json","vscode":"mcp.json","windsurf":"mcp_config.json","gemini-cli":"settings.json","codex":"config.toml","claude-code":"install-claude-code.sh"};
function builderServers(){
  return [...BUILDER.sel].map(id=>SERVERS.find(s=>s.id===id)).filter(Boolean);
}
function builderCustom(){
  if(!BUILDER.customOn) return null;
  const name = (BUILDER.custom.name||"").trim();
  const url = (BUILDER.custom.url||"").trim();
  if(!/^[a-z0-9][a-z0-9-]*$/.test(name) || !/^https:\/\//.test(url)) return null;
  return {name, url, header:(BUILDER.custom.header||"").trim()};
}
/* Returns {text, filename, key} — the ready profile for one app. */
function buildProfileConfig(appId, servers, custom){
  const app = CONNECT_APPS.find(a=>a.id===appId) || CONNECT_APPS[0];
  const envVals = KEYSTORE.all();
  const file = APP_CONFIG_FILE[app.id] || ".mcp.json";
  if(app.kind==="cli"){
    const lines = servers.map(s=>{
      const env = s.env ? Object.keys(s.env).map(k=>" -e "+k+"="+(envVals[k]?shellQ(envVals[k]):s.env[k])).join("") : "";
      return "claude mcp add --transport stdio --scope user " + shortName(s) + env + " -- uvx " + s.pypi;
    });
    if(custom){
      let c = "claude mcp add --transport http " + custom.name + " " + custom.url;
      if(custom.header) c += " --header " + shellQ(custom.header);
      lines.push(c);
    }
    return {text:lines.join("\n")+"\n", filename:file, key:null};
  }
  if(app.kind==="toml"){
    const parts = servers.map(s=>{
      let sec = "[mcp_servers." + shortName(s) + "]\ncommand = \"uvx\"\nargs = [\"" + s.pypi + "\"]";
      if(s.env) sec += "\n" + Object.keys(s.env).map(k=>k+" = "+JSON.stringify(envVals[k]||s.env[k])).join("\n");
      return sec;
    });
    if(custom){
      let sec = "[mcp_servers." + custom.name + "]\nurl = " + JSON.stringify(custom.url);
      if(custom.header) sec += "\nheaders = " + JSON.stringify([custom.header]);
      parts.push(sec);
    }
    return {text:parts.join("\n\n")+"\n", filename:file, key:null};
  }
  const key = app.kind==="vscode" ? "servers" : "mcpServers";
  const obj = {};
  servers.forEach(s=>{
    const entry = {command:"uvx", args:[s.pypi]};
    if(app.kind==="vscode") entry.type = "stdio";
    if(s.env){
      entry.env = {};
      Object.keys(s.env).forEach(k=>{ entry.env[k] = envVals[k]||s.env[k]; });
    }
    if(app.kind==="vscode") obj[shortName(s)] = Object.assign({type:"stdio"}, entry);
    else obj[shortName(s)] = entry;
  });
  if(custom){
    if(app.kind==="vscode") obj[custom.name] = {type:"http", url:custom.url, headers: custom.header ? {"Authorization": custom.header} : undefined};
    else obj[custom.name] = {url:custom.url, headers: custom.header ? {"Authorization": custom.header} : undefined};
    if(!custom.header) delete obj[custom.name].headers;
  }
  const top = {}; top[key] = obj;
  return {text:JSON.stringify(top, null, 2)+"\n", filename:file, key};
}
/* One-command installer: install uvx if needed, write/merge the config,
   smoke-test each server (starts and exits cleanly on EOF). */
function installerSnippet(appId, servers, custom){
  const app = CONNECT_APPS.find(a=>a.id===appId) || CONNECT_APPS[0];
  const os = BUILDER.os;
  const pkgs = servers.map(s=>s.pypi);
  if(os==="win"){
    const cfg = buildProfileConfig(appId, servers, custom);
    const lines = [];
    lines.push("# Turkey MCP — one-command installer (generated in your browser)");
    lines.push("# 1. install uv (provides uvx) if missing");
    lines.push("if (-not (Get-Command uvx -ErrorAction SilentlyContinue)) { powershell -ExecutionPolicy ByPass -c \"irm https://astral.sh/uv/install.ps1 | iex\" }");
    lines.push("# 2. save the profile, then copy the settings into your config file");
    lines.push("@'");
    lines.push(cfg.text.trimEnd());
    lines.push("'@ | Out-File -Encoding utf8 \"$env:USERPROFILE\\turkey-mcp-profile.json\"");
    const target = app.kind==="cli" ? "Claude Code (run the commands in the profile file)" : (APP_CONFIG_PATH[app.id] ? APP_CONFIG_PATH[app.id].win : "");
    lines.push("Write-Host \"Profile saved to $env:USERPROFILE\\turkey-mcp-profile.json — copy it into: " + target + "\"");
    lines.push("# 3. restart the app, then ask the sample question from the builder.");
    return lines.join("\n") + "\n";
  }
  const lines = [];
  lines.push("# Turkey MCP — one-command installer (generated in your browser)");
  lines.push("# 1. install uv (provides uvx) if missing");
  lines.push("command -v uvx >/dev/null 2>&1 || curl -LsSf https://astral.sh/uv/install.sh | sh");
  lines.push("export PATH=\"$HOME/.local/bin:$PATH\"");
  if(app.kind==="cli"){
    lines.push("# 2. register every server with Claude Code");
    servers.forEach(s=>{
      lines.push("claude mcp add --transport stdio --scope user " + shortName(s) + " -- uvx " + s.pypi);
    });
    if(custom) lines.push("claude mcp add --transport http " + custom.name + " " + custom.url);
  } else if(app.kind==="toml"){
    lines.push("# 2. save the profile snippet, then append it to ~/.codex/config.toml");
    lines.push("cat > /tmp/turkey-mcp-codex.toml <<'EOF'");
    lines.push(buildProfileConfig(appId, servers, custom).text.trimEnd());
    lines.push("EOF");
    const firstSec = servers.length ? "mcp_servers." + shortName(servers[0]) : (custom ? "mcp_servers." + custom.name : "");
    if(firstSec) lines.push("if ! grep -q \"" + firstSec + "\" ~/.codex/config.toml 2>/dev/null; then cat /tmp/turkey-mcp-codex.toml >> ~/.codex/config.toml; fi");
    else lines.push("cat /tmp/turkey-mcp-codex.toml >> ~/.codex/config.toml");
  } else {
    const cfg = buildProfileConfig(appId, servers, custom);
    const cfgPath = (APP_CONFIG_PATH[app.id]||{})[os] || "~/.mcp.json";
    lines.push("# 2. merge the settings into " + cfgPath + " (keeps your existing settings)");
    lines.push("python3 - <<'PY'");
    lines.push("import json, os");
    lines.push("p = os.path.expanduser(" + JSON.stringify(cfgPath) + ")");
    lines.push("d = {}");
    lines.push("try:");
    lines.push("    d = json.load(open(p))");
    lines.push("except Exception:");
    lines.push("    pass");
    lines.push("d.setdefault(" + JSON.stringify(cfg.key) + ", {}).update(" + JSON.stringify(JSON.parse(cfg.text)[cfg.key]) + ")");
    lines.push("os.makedirs(os.path.dirname(p) or '.', exist_ok=True)");
    lines.push("json.dump(d, open(p, 'w'), indent=2, ensure_ascii=False)");
    lines.push("print('wrote', p)");
    lines.push("PY");
  }
  if(pkgs.length){
    lines.push("# 3. smoke test: each server must start and exit cleanly on EOF");
    lines.push("for pkg in " + pkgs.join(" ") + "; do printf '' | timeout 5 uvx \"$pkg\" >/dev/null 2>&1 && echo \"ok $pkg\" || echo \"check $pkg\"; done");
  }
  return lines.join("\n") + "\n";
}

  return location.origin + location.pathname + hashForQ("builder", null, q);
}

/* ---------------- Guide (#/guide) — authored fresh ---------------- */
const GUIDE_SECTIONS = [
 {id:"what", title:{fa:"MCP چیست؟",tr:"MCP nedir?",en:"What is MCP?"},
  body:{fa:["مدل‌های هوش مصنوعی متن می‌نویسند، اما به‌تنهایی به دنیای بیرون دسترسی ندارند: نمی‌دانند قیمت دلار امروز چقدر است یا فردا چه اتوبوسی از استانبول به آنکارا می‌رود. MCP یا «پروتکل زمینهٔ مدل» یک قرارداد استاندارد است که به دستیار هوش مصنوعی اجازه می‌دهد با ابزارهای بیرونی صحبت کند.","به زبان ساده: MCP یک «پریز استاندارد» است. هر سرویس یک «دوشاخه» می‌سازد و دستیار شما آن را وصل می‌کند و سؤال شما را به یک فراخوانی ابزار تبدیل می‌کند. سرورهای این کاتالوگ دقیقاً همین کار را می‌کنند: هر کدام یک سرویس ترکیه را به دستیار شما وصل می‌کنند."],
        tr:["Yapay zekâ modelleri metin yazar, ancak tek başlarına dış dünyaya erişemezler: bugünkü dolar kurunu veya yarın İstanbul'dan Ankara'ya hangi otobüsün gittiğini bilemezler. MCP (Model Bağlam Protokolü), yapay zekâ asistanının dış araçlarla konuşmasını sağlayan standart bir sözleşmedir.","Basitçe söylemek gerekirse MCP standart bir “priz”dir. Her hizmet bir “fiş” yapar ve asistanınız onu takıp sorunuzu bir araç çağrısına dönüştürür. Bu katalogdaki sunucular tam olarak bunu yapar: her biri bir Türkiye servisini asistanınıza bağlar."],
        en:["AI models write text, but on their own they cannot reach the outside world: they don't know today's dollar rate or which bus leaves Istanbul for Ankara tomorrow. MCP — the Model Context Protocol — is a standard contract that lets an AI assistant talk to outside tools.","Simply put, MCP is a standard “socket”. Every service builds a “plug”, and your assistant connects it and turns your question into a tool call. The servers in this catalog do exactly that: each one connects a Turkish service to your assistant."]}},
 {id:"no-terminal", title:{fa:"نصب بدون ترمینال",tr:"Terminalsiz kurulum",en:"Install without a terminal"},
  body:{fa:["اگر با خط فرمان راحت نیستی، مسیر «شروع ساده» در صفحهٔ اتصال برای توست: Claude Desktop را نصب کن، uvx را با یک دستور آماده نصب کن، فایل تنظیمات را باز کن و تکهٔ آماده را در آن بچسبان. بعد از بستن و باز کردن کامل برنامه، سرور در چت است.","برای چند سرور، از سازندهٔ پروفایل استفاده کن: سرورها را انتخاب کن و یک فایل آماده بگیر — همان یک فایل، همه را وصل می‌کند."],
        tr:["Komut satırıyla rahat değilseniz Bağlan sayfasındaki «Kolay başlangıç» yolu size göredir: Claude Desktop'ı kurun, uvx'i hazır bir komutla kurun, ayar dosyasını açın ve hazır parçayı yapıştırın. Uygulamayı tamamen kapatıp yeniden açınca sunucu sohbette görünür.","Birden çok sunucu için profil oluşturucuyu kullanın: sunucuları seçin, hazır bir dosya alın — tek dosya hepsini bağlar."],
        en:["If you are not comfortable with the command line, the «Easy start» path on the Connect page is for you: install Claude Desktop, install uvx with one ready command, open the settings file and paste in the ready snippet. After fully quitting and reopening the app, the server is in the chat.","For several servers, use the profile builder: pick the servers and get one ready file — that one file connects them all."]}},
 {id:"before", title:{fa:"قبل از نصب",tr:"Kurulumdan önce",en:"Before installing"},
  body:{fa:["روی هر صفحهٔ سرور، بخش «قبل از نصب بخوانید» را ببین: منبع سرور، محل اجرا، نیاز به کلید، نوع اتصال و آخرین بررسی. همهٔ سرورها روی کامپیوتر خودت اجرا می‌شوند؛ هیچ‌کدام روی سرور ما نیستند.","برچسب‌ها را بشناس: «اجرا روی کامپیوتر شما» یعنی داده‌ات پیش ما نمی‌آید؛ «API غیررسمی» یعنی سرور رسمی سایت نیست و اگر سایت تغییر کند ممکن است از کار بیفتد؛ «تغییر در حساب شما» یعنی ابزار نوشتاری دارد و فقط با تأیید تو کار می‌کند."],
        tr:["Her sunucu sayfasındaki «Kurulumdan önce okuyun» bölümüne bakın: sunucunun kaynağı, çalışma yeri, anahtar gereksinimi, bağlantı türü ve son denetim. Tüm sunucular kendi bilgisayarınızda çalışır; hiçbiri bizim sunucumuzda değildir.","Etiketleri tanıyın: «kendi bilgisayarınızda çalışır» verinizin bize gelmediği anlamına gelir; «resmi olmayan API» sitenin resmi sunucusu olmadığı ve site değişirse bozulabileceği anlamına gelir; «hesabınızda değişiklik» yazma araçları olduğu ve yalnızca onayınızla çalıştığı anlamına gelir."],
        en:["Read the «Read before installing» box on every server page: the server's source, where it runs, whether it needs a key, the connection type and the last check. Every server runs on your own computer; none of them runs on our server.","Know the labels: «runs on your computer» means your data never comes to us; «unofficial API» means it is not the site's official server and may break if the site changes; «changes your account» means it has write tools that only work with your approval."]}},
 {id:"security", title:{fa:"امنیت",tr:"Güvenlik",en:"Security"},
  body:{fa:["سرورها به‌طور پیش‌فرض فقط‌خواندنی‌اند: دادهٔ عمومی می‌خوانند، چیزی نمی‌خرند و در هیچ حسابی تغییری نمی‌دهند. بدترین کاری که یک سرور خراب می‌تواند بکند، برگرداندن یک جواب اشتباه است — و تو همیشه می‌توانی آن را با باز کردن سایت بررسی کنی.","کوکی نشست (فقط برای اقدامات حساب Hepsiburada و Migros) فقط در فایل تنظیمات ماشین خودت می‌ماند. هرگز آن را در مخزن عمومی، پیام یا اسکرین‌شات نگذار. اگر مشکوک شدی، از سایت سرویس خارج شو و دوباره وارد شو تا نشست باطل شود.","همهٔ سرورها متن‌باز‌اند؛ می‌توانی دقیقاً ببینی هر ابزار چه درخواستی می‌فرستد."],
        tr:["Sunucular varsayılan olarak salt okunurdur: herkese açık veriyi okurlar, hiçbir şey satın almaz ve hiçbir hesapta değişiklik yapmazlar. Bozuk bir sunucunun yapabileceği en kötü şey yanlış bir yanıt döndürmektir — bunu sitenin kendisini açarak her zaman doğrulayabilirsiniz.","Oturum çerezi (yalnızca Hepsiburada ve Migros hesap işlemleri için) yalnızca kendi makinenizdeki ayar dosyasında kalır. Asla herkese açık bir depoya, mesaja veya ekran görüntüsüne koymayın. Şüphelenirseniz servis sitesinden çıkıp yeniden girin; oturum geçersiz olur.","Tüm sunucular açık kaynaklıdır; her aracın tam olarak hangi isteği gönderdiğini görebilirsiniz."],
        en:["Servers are read-only by default: they read public data, never buy anything and never change anything in an account. The worst thing a broken server can do is return a wrong answer — and you can always check it by opening the site.","The session cookie (only for Hepsiburada and Migros account actions) stays only in the settings file on your own machine. Never put it in a public repo, a message or a screenshot. If you are suspicious, log out of the service site and back in to invalidate the session.","All servers are open source; you can see exactly what request each tool sends."]}},
 {id:"builders", title:{fa:"برای سازندگان",tr:"Geliştiriciler için",en:"For builders"},
  body:{fa:["می‌خواهی سرور تازه‌ای بسازی؟ یک سرویس ترکیه با دادهٔ عمومی پیدا کن، سرور stdio را با uvx قابل‌اجرا کن و هر ابزار را دست‌کم یک بار روی سایت زنده اجرا کن. استانداردهای کامل در راهنمای ارسال است.","ارسال از صفحهٔ «افزودن ابزار» انجام می‌شود: فرم را پر کن و یک ایشوی آماده در گیت‌هاب باز می‌شود. ایدهٔ بدون کد هم قبول است، ولی کد سریع‌تر پیش می‌رود."],
        tr:["Yeni bir sunucu mu yapmak istiyorsunuz? Herkese açık verisi olan bir Türkiye servisi bulun, stdio sunucusunu uvx ile çalıştırılabilir yapın ve her aracı canlı sitede en az bir kez çalıştırın. Tüm standartlar gönderim kılavuzundadır.","Gönderim «Araç ekle» sayfasından yapılır: formu doldurun ve GitHub'da hazır bir issue açılır. Kodsuz fikir de kabul edilir, ama kod daha hızlı ilerler."],
        en:["Want to build a new server? Find a Turkish service with public data, make the stdio server runnable with uvx, and run every tool at least once against the live site. The full standards are in the submission guide.","Submit from the «Add a tool» page: fill in the form and a ready GitHub issue opens. An idea without code is welcome too, but code moves faster."]}},

/* ---------------- Submit (#/submit) -> prefilled GitHub Issue ---------------- */
const SUBMIT = {nameEn:"", nameFa:"", id:"", summary:"", cat:"shopping", tags:"", repo:"", license:"PolyForm Noncommercial 1.0.0", install:"", env:"", tools:"", questions:"", desc:"", autofill:"idle"};
function submitSlug(name){
  let s = (name||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
  if(!s) return "";
  if(!s.endsWith("-mcp")) s += "-mcp";
  return s;
}
function submitIssueBody(){
  const lines = [];
  lines.push("## Service");
  lines.push("");
  lines.push("- Name: " + (SUBMIT.nameEn||"-") + (SUBMIT.nameFa ? " (" + SUBMIT.nameFa + ")" : ""));
  lines.push("- ID: `" + (SUBMIT.id||submitSlug(SUBMIT.nameEn)||"-") + "`");
  lines.push("- Category: " + SUBMIT.cat);
  lines.push("- Tags: " + (SUBMIT.tags||"-"));
  lines.push("- Repository: " + (SUBMIT.repo||"-"));
  lines.push("- License: " + (SUBMIT.license||"-"));
  lines.push("- Install: `" + (SUBMIT.install||"-") + "`");
  lines.push("");
  lines.push("## Summary");
  lines.push("");
  lines.push(SUBMIT.summary||"-");
  lines.push("");
  if(SUBMIT.env){ lines.push("## Environment variables"); lines.push(""); lines.push(SUBMIT.env); lines.push(""); }
  if(SUBMIT.tools){ lines.push("## Tools"); lines.push(""); lines.push(SUBMIT.tools); lines.push(""); }
  if(SUBMIT.questions){ lines.push("## Sample questions"); lines.push(""); lines.push(SUBMIT.questions); lines.push(""); }
  if(SUBMIT.desc){ lines.push("## Description"); lines.push(""); lines.push(SUBMIT.desc); lines.push(""); }
  lines.push("---");
  lines.push("Submitted from the Turkey MCP submit page.");
  return lines.join("\n");
}
function submitIssueUrl(){
  const title = "New server: " + (SUBMIT.nameEn||SUBMIT.id||"");
  return "https://github.com/mohammad-abbasi-sh/turkey-mcp/issues/new?title=" + encodeURIComponent(title) + "&labels=new-server&body=" + encodeURIComponent(submitIssueBody());
}
function submitPreviewHTML(){
  return `<div class="preview-box">${esc(submitIssueBody())}</div>`;
}

function faqFill(text, s){
  return text.replace(/{name}/g, serviceName(s)).replace(/{service}/g, serviceName(s)).replace(/{tools}/g, fmtNum(s.tools.length));
}
function toolFaqHTML(s){
  return FAQ_TEMPLATE.map(f=>{
    let a = faqFill(L(f.a), s);
    if(f===FAQ_TEMPLATE[3] && s.account){
      a = state.lang==="fa" ? "به‌طور پیش‌فرض نه؛ فقط‌خواندنی است. ابزارهای نوشتاری اختیاری (سبد خرید و علاقه‌مندی‌ها) فقط با کوکی نشست خودت و فقط بعد از تأیید تو تغییر می‌دهند."
        : state.lang==="tr" ? "Varsayılan olarak hayır; salt okunurdur. İsteğe bağlı yazma araçları (sepet ve favoriler) yalnızca kendi oturum çerezinizle ve yalnızca onayınızla değişiklik yapar."
        : "Not by default; it is read-only. The optional write tools (cart + favorites) change things only with your own session cookie and only after your approval.";
    }
    return `<details class="faq-item"><summary>${esc(faqFill(L(f.q), s))}</summary><p>${esc(a)}</p></details>`;
  }).join("");
}

/* ---------------- JSON-LD + per-page meta (GEO) ---------------- */

  const el = document.getElementById("ld-page");
  if(!el) return;
  const base = "https://mohammad-abbasi-sh.github.io/turkey-mcp/";
  let graph = null;
  if(state.page==="home"){
    graph = {"@context":"https://schema.org","@type":"Organization","name":"Turkey MCP","url":base,"description":t("hero_sub"),"founder":{"@type":"Person","name":"Mohammad Abbasi","url":"https://github.com/mohammad-abbasi-sh"}};
  } else if(state.page==="tool"){
    const s = SERVERS.find(x=>x.id===state.param);
    if(s){
      graph = {"@context":"https://schema.org","@graph":[
        {"@type":"SoftwareApplication","name":s.title,"applicationCategory":"DeveloperApplication","operatingSystem":"Windows, macOS, Linux","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"},"description":s.desc,"url":base+"#/en/tool/"+s.id,"softwareVersion":serverVersion(s.id)},
        {"@type":"FAQPage","mainEntity":FAQ_TEMPLATE.map(f=>({"@type":"Question","name":faqFill(f.q.en, s),"acceptedAnswer":{"@type":"Answer","text":faqFill(f.a.en, s)}}))},
        {"@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Turkey MCP","item":base},{"@type":"ListItem","position":2,"name":"Marketplace","item":base+"#/en/marketplace"},{"@type":"ListItem","position":3,"name":s.title,"item":base+"#/en/tool/"+s.id}]}
      ]};
    }
  } else if(state.page==="marketplace"){
    graph = {"@context":"https://schema.org","@type":"CollectionPage","name":t("mp_title"),"url":base+"#/en/marketplace","hasPart":{"@type":"ItemList","numberOfItems":SERVERS.length,"itemListElement":SERVERS.slice(0,10).map((s,i)=>({"@type":"ListItem","position":i+1,"name":s.title,"url":base+"#/en/tool/"+s.id}))}};
  } else if(state.page==="guide"){
    graph = {"@context":"https://schema.org","@type":"FAQPage","mainEntity":FAQ.map(f=>({"@type":"Question","name":f.q.en,"acceptedAnswer":{"@type":"Answer","text":f.a.en}}))};
  } else if(state.page==="about"){
    graph = {"@context":"https://schema.org","@type":"AboutPage","name":t("about_title"),"url":base+"#/en/about","about":{"@type":"Organization","name":"Turkey MCP","founder":{"@type":"Person","name":"Mohammad Abbasi"}}};
  }
  el.textContent = graph ? JSON.stringify(graph) : "";
}
function updateMeta(){
  const set = (sel, attr, val)=>{ const el = document.querySelector(sel); if(el) el.setAttribute(attr, val); };
  let desc = t("hero_sub");
  if(state.page==="tool"){ const s = SERVERS.find(x=>x.id===state.param); if(s) desc = serverDesc(s); }
  set('meta[name="description"]', "content", desc);
  set('meta[property="og:title"]', "content", document.title);
  set('meta[name="twitter:title"]', "content", document.title);
  set('meta[property="og:description"]', "content", desc);
  set('meta[name="twitter:description"]', "content", desc);
  set('link[rel="canonical"]', "href", "https://mohammad-abbasi-sh.github.io/turkey-mcp/" + (state.page==="home" ? "" : "#/" + state.lang + "/" + state.page + (state.param?"/"+state.param:"")));
}

/* ---------------- What's New modal ---------------- */
const WN_VERSION = "v25";
let wnScheduled = false;
function wnHTML(){
  return `<div id="wn-modal" class="wn-backdrop" role="dialog" aria-modal="true"><div class="wn-panel">
    <h2>${t("wn_title")}</h2><p style="color:var(--muted);margin:0">${t("wn_sub")}</p>
    <ul><li>${t("wn_item1")}</li><li>${t("wn_item2")}</li><li>${t("wn_item3")}</li><li>${t("wn_item4")}</li></ul>
    <p style="display:flex;gap:10px;flex-wrap:wrap;margin:0"><a class="btn btn-primary btn-sm" href="${hashFor("builder")}" onclick="closeWhatsNew()">${t("nav_builder")}</a><button type="button" class="btn btn-ghost btn-sm" onclick="App.closeWhatsNew()">${t("wn_close")}</button></p>
  </div></div>`;
}
function checkWhatsNew(){
  if(state.page!=="home" || wnScheduled) return;
  if(store.get("tmp_wn_"+WN_VERSION, null)==="seen") return;
  wnScheduled = true;
  setTimeout(()=>{
    if(store.get("tmp_wn_"+WN_VERSION, null)==="seen") return;
    const m = document.getElementById("wn-modal");
    if(m) m.classList.add("open");
  }, 900);
}
function closeWhatsNew(){
  const m = document.getElementById("wn-modal");
  if(m) m.classList.remove("open");
  store.set("tmp_wn_"+WN_VERSION, "seen");
}

/* ---------------- search.json lazy load (palette index) ---------------- */
function loadSearchIndex(){
  if(PALETTE.indexLoaded || PALETTE.indexLoading) return;
  PALETTE.indexLoading = true;
  fetch("search.json").then(r=>{ if(!r.ok) throw new Error("http "+r.status); return r.json(); }).then(items=>{
    PALETTE.index = items; PALETTE.indexLoaded = true;
    if(PALETTE.open){ PALETTE.items = paletteResults(PALETTE.q); renderPalette(); }
  }).catch(()=>{ /* in-memory index is authoritative; file is a bonus */ })
  .finally(()=>{ PALETTE.indexLoading = false; });
}

/* ---------------- init ---------------- */
window.addEventListener("hashchange", ()=>{ const keep=INSPECT_KEEP; INSPECT_KEEP=false; render(); if(keep){ window.scrollTo({top:INSPECT_SCROLL}); } else { const h=location.hash||""; if(h.startsWith("#/") || !h) window.scrollTo({top:0}); } });
if(document.addEventListener) document.addEventListener("keydown", (ev)=>{ if((ev.metaKey||ev.ctrlKey) && ev.key.toLowerCase()==="k"){ ev.preventDefault(); if(PALETTE.open) closePalette(); else openPalette(); } else if(ev.key==="Escape" && PALETTE.open){ closePalette(); } });
if(document.addEventListener) document.addEventListener("click", (ev)=>{ const m=document.getElementById("nav-more"); if(m && m.classList.contains("open") && !m.contains(ev.target)) m.classList.remove("open"); });
if(window.addEventListener) window.addEventListener("scroll", ()=>{ const h=document.querySelector("header.site"); if(h) h.classList.toggle("scrolled", window.scrollY>8); }, {passive:true});
if(!location.hash) location.hash = "#/"+state.lang+"/";
render();
</script>
