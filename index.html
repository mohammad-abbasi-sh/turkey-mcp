<style>
:root{
  --bg:#F7F9F8; --bg-soft:#EDF3F0; --card:#FFFFFF; --elev:#FFFFFF; --text:#172B2B; --muted:#5E7270;
  --line:#E2EAE6; --line-strong:#CBD8D2;
  --primary:#0E8F76; --primary-2:#0B7A64; --primary-ink:#0A6B57; --primary-soft:#E1F3ED;
  --primary-bright:#E7A47C;
  --primary-btn:#0A6B57; --primary-btn-hover:#085544;
  --on-primary:#FFFFFF;
  --secondary:#C56B46; --secondary-bright:#E7A47C; --secondary-soft:#F9EDE4;
  --accent:#C56B46; --accent-soft:#F9EDE4;
  --cobalt:#0E6E8C; --cobalt-soft:#E0F1F5;
  --navy:#102A2C; --danger:#B42318; --ok:#0E8F76; --warn:#FCD34D;
  --shadow:0 1px 2px rgba(16,42,44,.05),0 10px 28px rgba(16,42,44,.06);
  --shadow-lg:0 2px 6px rgba(16,42,44,.06),0 20px 48px rgba(16,42,44,.12);
  --shadow-glow:0 0 0 1px rgba(14,143,118,.30),0 6px 20px rgba(14,143,118,.22);
  --shadow-accent:0 8px 22px rgba(14,143,118,.28);
  --radius:20px; --radius-sm:12px; --radius-lg:24px; --pill:999px;
  --ease:cubic-bezier(.22,.61,.36,1); --dur:.22s;
  --font-fa:"Vazirmatn",system-ui,Tahoma,sans-serif;
  --font-lat:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
[data-theme="dark"]{
  --bg:#0C1A1A; --bg-soft:#102222; --card:#142828; --elev:#1A3030; --text:#EAF3F0; --muted:#9DB3AE;
  --line:#223A37; --line-strong:#2F4C48;
  --primary:#3EC9A7; --primary-2:#2DB894; --primary-ink:#5FD9B6; --primary-soft:#14332C;
  --primary-bright:#E7A47C;
  --primary-btn:#2DB894; --primary-btn-hover:#3EC9A7;
  --on-primary:#06231C;
  --secondary:#E7A47C; --secondary-bright:#F0BC9A; --secondary-soft:#3A241A;
  --accent:#E7A47C; --accent-soft:#33241A;
  --cobalt:#6EC6D8; --cobalt-soft:#122E33;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  --shadow-lg:0 2px 6px rgba(0,0,0,.4),0 20px 48px rgba(0,0,0,.5);
  --shadow-glow:0 0 0 1px rgba(62,201,167,.3),0 6px 20px rgba(62,201,167,.18);
  --shadow-accent:0 8px 22px rgba(62,201,167,.22);
}
*{box-sizing:border-box}
html,body{overflow-x:clip}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);line-height:1.75;font-family:var(--font-lat);transition:background .35s ease,color .35s ease}
[dir="rtl"] body,[lang="fa"] body{font-family:var(--font-fa)}
h1,h2,h3,h4{line-height:1.3;margin:0 0 .5em;font-weight:800;font-family:var(--font-lat)}
[dir="rtl"] h1,[dir="rtl"] h2,[dir="rtl"] h3,[dir="rtl"] h4{font-family:var(--font-fa)}
p{margin:0 0 1em}
a{color:var(--primary-ink);text-decoration:none}
a:hover{text-decoration:underline}
img,svg{display:block;max-width:100%}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--text);background:var(--card);border:1px solid var(--line-strong);border-radius:var(--radius-sm);padding:11px 14px;width:100%;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--primary-ink);box-shadow:0 0 0 3px var(--primary-soft)}
label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
code{font-family:var(--font-mono);font-size:.86em;background:var(--bg-soft);border:1px solid var(--line);border-radius:8px;padding:2px 8px;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
pre{background:var(--navy);color:#EDE9E3;border-radius:var(--radius-sm);padding:16px 18px;overflow-x:auto;font-size:13px;line-height:1.7;direction:ltr;text-align:start;margin:0}
pre code{background:none;border:none;padding:0;color:inherit;white-space:pre-wrap}
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px}
.section{padding:64px 0 8px}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.section-head h2{font-size:clamp(24px,3vw,30px);margin:0}
.section-head p{color:var(--muted);margin:6px 0 0;max-width:640px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--primary-ink);margin-bottom:10px}
[dir="ltr"] .eyebrow{text-transform:uppercase;letter-spacing:.09em}
.eyebrow .dot{width:8px;height:8px;background:var(--primary-2);border-radius:50%}
/* ---------- header / nav ---------- */
header.site{position:sticky;top:0;z-index:60;background:color-mix(in srgb,var(--card) 88%,transparent);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);border-bottom:1px solid var(--line);transition:box-shadow .25s ease}
.nav{display:flex;align-items:center;gap:14px;height:66px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;color:var(--text);text-decoration:none;white-space:nowrap}
.brand:hover{text-decoration:none}
.brand .mark{width:38px;height:38px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:21px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
[data-theme="dark"] .brand .mark{background:var(--primary);color:#06231C;box-shadow:none}
.brand small{display:block;font-size:11px;font-weight:600;color:var(--muted);line-height:1}
nav.main{display:flex;gap:2px;margin-inline-start:8px}
nav.main a{color:var(--muted);font-size:14.5px;font-weight:600;padding:8px 12px;border-radius:var(--pill);text-decoration:none;white-space:nowrap;transition:background var(--dur) var(--ease),color var(--dur) var(--ease)}
nav.main a:hover{color:var(--text);background:var(--bg-soft);text-decoration:none}
nav.main a.active{color:var(--primary-ink);background:var(--primary-soft);font-weight:700}
.nav-right{margin-inline-start:auto;display:flex;align-items:center;gap:8px}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line-strong);background:var(--card);color:var(--text);display:inline-flex;align-items:center;justify-content:center;font-size:17px;transition:border-color var(--dur) var(--ease),background var(--dur) var(--ease),transform var(--dur) var(--ease);text-decoration:none}
.icon-btn:hover{border-color:var(--primary-ink)}
.palette-btn{width:auto;padding-inline:10px;font-size:12.5px;font-weight:800;letter-spacing:.04em}
.lang-select{border:1px solid var(--line-strong);background:var(--card);border-radius:12px;padding:0 8px;height:40px;width:auto;font-weight:700;font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:12px 24px;font-size:15px;font-weight:700;border:1px solid transparent;text-decoration:none;transition:background var(--dur) var(--ease),box-shadow var(--dur) var(--ease),transform var(--dur) var(--ease),border-color var(--dur) var(--ease);text-align:center;max-width:100%}
.btn:hover{text-decoration:none;transform:translateY(-1px)}
.btn-primary{background:var(--primary-btn);color:var(--on-primary);box-shadow:var(--shadow-accent)}
.btn-primary:hover{background:var(--primary-btn-hover)}
[data-theme="dark"] .btn-primary{color:var(--on-primary)}
[data-theme="dark"] .btn-primary:hover{background:var(--primary-btn-hover)}
.btn-ghost{background:var(--card);border-color:var(--line-strong);color:var(--text)}
.btn-ghost:hover{border-color:var(--primary-ink)}
.btn-mint{background:#A85A38;color:#fff}
.btn-mint:hover{background:#8F4A2E}
[data-theme="dark"] .btn-mint{color:#06110C;background:var(--secondary)}
[data-theme="dark"] .btn-mint:hover{background:var(--secondary-bright)}
.btn-sm{padding:9px 16px;font-size:14px}
.btn-block{width:100%}
.burger{display:none}
.mobile-menu{display:none;border-top:1px solid var(--line);padding:12px 20px 18px;background:var(--card)}
.mobile-menu.open{display:block}
.mobile-menu a{display:block;padding:11px 4px;font-weight:600;color:var(--text);border-bottom:1px solid var(--line)}
.mobile-menu a:last-child{border-bottom:none}
.menu-palette{display:block;width:100%;text-align:start;background:none;border:none;border-bottom:1px solid var(--line);padding:11px 4px;font-weight:600;font-size:15px;color:var(--text)}
/* ---------- hero (dark band, CafeBazaar style) ---------- */
.hero{position:relative;overflow:hidden;padding:60px 0 48px;background:var(--navy);color:#EAF3F0}
[data-theme="dark"] .hero{background:#0A1717;border-bottom:1px solid var(--line)}
.hero-grid{position:relative;display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:start}
.hero-kicker{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;color:#B8C4BC;margin:0 0 16px}
[dir="ltr"] .hero-kicker{text-transform:uppercase;letter-spacing:.1em}
.kicker-rule{display:inline-block;width:34px;height:2px;background:var(--primary-bright)}
.hero h1{font-size:clamp(34px,4.6vw,52px);line-height:1.12;color:#fff}
.hero h1 .accent{color:var(--primary-bright);font-style:italic}
[dir="rtl"] .hero h1 .accent{font-style:normal}
.hero .sub{color:#C3D2CC;font-size:17px;max-width:560px}
.hero-search{display:flex;gap:8px;background:#fff;border:1px solid #fff;border-radius:var(--pill);padding:6px;max-width:560px;margin:22px 0 14px;box-shadow:var(--shadow-lg)}
.hero-search input{border:none;background:transparent;box-shadow:none;padding:8px 14px;color:#070A14}
.hero-search input:focus{box-shadow:none}
.hero-search .btn{flex-shrink:0;border-radius:var(--pill)}
.hero-ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
.hero-ctas .btn{border-radius:var(--pill)}
.hero-ctas .btn-ghost{background:transparent;border-color:rgba(255,255,255,.35);color:#fff}
.hero-ctas .btn-ghost:hover{border-color:#fff;background:rgba(255,255,255,.06)}
.hero-stats{display:flex;gap:0;margin-top:30px;flex-wrap:wrap;border-top:1px solid rgba(255,255,255,.14);padding-top:18px}
.hero-stats>div{padding-inline-end:26px;margin-inline-end:26px;border-inline-end:1px solid rgba(255,255,255,.14)}
.hero-stats>div:last-child{border-inline-end:none;margin-inline-end:0;padding-inline-end:0}
.hero-stats b{display:block;font-size:26px;line-height:1.1;color:#fff}
.hero-stats span{color:#B8C4BC;font-size:13.5px}
.hero-demo{position:relative}
.demo-note{color:#8FA39B;font-size:12.5px;margin-top:10px}
/* demo card */
.demo{position:relative;z-index:1;background:#0D2120;border:1px solid #23403C;border-radius:var(--radius);box-shadow:0 24px 60px rgba(0,0,0,.45);overflow:auto;color:#EDE9E3}
.demo-tabs{display:flex;gap:6px;padding:12px 14px;border-bottom:1px solid #23403C;flex-wrap:wrap}
.demo-tabs button{background:transparent;border:none;color:#9DB3A8;border-radius:var(--pill);padding:7px 13px;font-size:13px;font-weight:600}
.demo-tabs button.active{background:#1B3030;color:#fff}
.demo-body{padding:20px 22px;min-height:250px}
.demo-body .q{font-weight:700;color:#fff;font-size:16px;margin-bottom:12px;min-height:52px}
.demo-body pre{background:#081715;border:1px solid #23403C}
.demo-body .fn{color:#3EC9A7}.demo-body .str{color:#E7A47C}.demo-body .arg{color:#D6D3D1}
.demo-body .status{color:#3EC9A7;font-size:13px;font-weight:700;margin:12px 0 4px}
.demo-body .a{color:#D6D3D1;font-size:14px;margin:0 0 12px}
.demo-body .ask{font-size:13px;color:#9DB3A8;margin:0}
.demo-body .ask a{color:#E7A47C}
.demo-body .cursor{display:inline-block;width:2px;height:1em;background:#3EC9A7;vertical-align:text-bottom;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.demo-foot{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid #23403C;padding:14px 22px}
.demo-foot span{color:#9DB3A8;font-size:13px}
.demo-foot .btn{padding:9px 20px;font-size:14px}
/* ---------- benefit strip (4 cards under the hero) ---------- */
.benefits{padding:48px 0 8px}
.ben-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--shadow);transition:box-shadow var(--dur) var(--ease),border-color var(--dur) var(--ease),transform var(--dur) var(--ease)}
.ben-ic{width:52px;height:52px;background:var(--primary-soft);color:var(--primary-ink);border-radius:16px;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.ben-card h3{font-size:17px;margin:0 0 6px}
.ben-card p{color:var(--muted);font-size:14px;margin:0}
/* ---------- mint banner (more servers) ---------- */
.mint-banner{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;background:var(--primary-soft);border:1px solid var(--line);border-radius:var(--radius-lg);padding:26px 28px;margin-top:28px}
.mint-banner h3{font-size:22px;margin:0 0 4px;color:var(--primary-ink)}
[data-theme="dark"] .mint-banner h3{color:var(--primary-ink)}
.mint-banner p{color:var(--muted);margin:0;font-size:14.5px}
/* ---------- monograms (server initials, no emoji tiles) ---------- */
.mono{width:56px;height:56px;min-width:56px;display:inline-flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;font-family:var(--font-mono);letter-spacing:.02em;color:color-mix(in srgb,var(--mc,#0E8F76) 68%,var(--text));background:color-mix(in srgb,var(--mc,#0E8F76) 14%,var(--card));border:1px solid color-mix(in srgb,var(--mc,#0E8F76) 40%,transparent);border-radius:16px}
.mono-lg{width:64px;height:64px;min-width:64px;font-size:21px;border-radius:16px}
.mono-sm{width:34px;height:34px;min-width:34px;font-size:12.5px;border-radius:10px}
/* ---------- server cards (CafeBazaar pattern) ---------- */
.srv-card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:0;box-shadow:var(--shadow);transition:box-shadow var(--dur) var(--ease),border-color var(--dur) var(--ease),transform var(--dur) var(--ease)}
.srv-card:hover{border-color:color-mix(in srgb,var(--mc,#0E8F76) 55%,var(--line));box-shadow:var(--shadow-lg);transform:translateY(-3px)}
.srv-card.selected{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft),var(--shadow)}
.srv-top{display:flex;gap:12px;align-items:flex-start;cursor:pointer;border-radius:12px}
.srv-top:focus-visible{outline:3px solid var(--primary-ink);outline-offset:2px}
.srv-head{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.srv-name{font-weight:800;font-size:17.5px;line-height:1.35;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.srv-id{color:var(--muted);font-size:12.5px;direction:ltr;text-align:start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srv-count{flex-shrink:0;text-align:center;border:1px solid var(--line);border-radius:14px;padding:8px 12px;background:var(--bg-soft);min-width:64px}
.srv-count b{display:block;font-size:22px;line-height:1.1;color:var(--primary-ink)}
.srv-count span{color:var(--muted);font-size:12px;font-weight:600}
.srv-desc{color:var(--muted);font-size:14px;margin:14px 0 12px;flex:1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.srv-tools{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.srv-tools .more{color:var(--muted);font-weight:700;font-size:12.5px;padding:2px 6px}
.srv-foot{display:flex;flex-direction:column;align-items:stretch;gap:10px;border-top:1px solid var(--line);padding-top:16px;margin-top:auto}
.srv-details{font-weight:700;font-size:14px;white-space:nowrap;color:var(--secondary)}
[data-theme="dark"] .srv-details{color:var(--secondary-bright)}
.srv-tools-btn{border:1px solid var(--line-strong);background:var(--card);border-radius:var(--pill);padding:8px 14px;font-weight:700;font-size:13.5px;color:var(--text);white-space:nowrap;transition:border-color var(--dur) var(--ease),background var(--dur) var(--ease)}
.srv-tools-btn:hover{border-color:var(--primary-ink)}
.srv-tools-btn .chev{color:var(--primary-ink)}
.drawer{border-top:1px dashed var(--line-strong);padding:16px 0 2px;margin-top:14px}
.drawer-desc{color:var(--muted);font-size:14.5px;max-width:760px}
.drawer-tools{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.drawer-tools li{display:block}
.result-count{color:var(--muted);font-size:14px;margin-bottom:14px}
.match-head{margin:26px 0 12px}
/* ---------- marketplace layout: rail + cards + inspector ---------- */
.mp-layout{display:grid;grid-template-columns:260px minmax(0,1fr) 320px;gap:28px;align-items:start}
.filter-rail{position:sticky;top:86px;display:flex;flex-direction:column;gap:16px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);padding:18px;box-shadow:var(--shadow)}
.rail-block label{font-size:13px;color:var(--muted)}
.rail-note{font-size:13.5px;margin:0;border-top:1px solid var(--line);padding-top:12px}
.mp-col{min-width:0}
.inspector{position:sticky;top:86px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);padding:20px;max-height:calc(100vh - 110px);overflow-y:auto;box-shadow:var(--shadow)}
.insp-kicker{font-size:12px;font-weight:800;color:var(--primary-ink);margin:0 0 14px}
[dir="ltr"] .insp-kicker{text-transform:uppercase;letter-spacing:.09em}
.insp-head{display:flex;gap:14px;align-items:flex-start;margin-bottom:12px}
.insp-head h3{font-size:19px;margin:0}
.insp-head .latin{color:var(--muted);font-size:12.5px;margin:2px 0 0;direction:ltr;text-align:start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.insp-badges{margin:0 0 12px;display:flex;gap:6px;flex-wrap:wrap}
.insp-desc{color:var(--muted);font-size:14px}
.inspector h4{font-size:14px;margin:14px 0 8px}
.insp-tools{list-style:none;margin:0 0 14px;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.insp-tools li{font-size:12.5px}
.insp-tools .more{color:var(--muted);font-weight:700;padding:1px 6px}
.insp-install{padding:14px;margin-bottom:14px}
.insp-install h3{font-size:14px}
.insp-actions{display:flex;gap:8px;flex-wrap:wrap}
.inspector-empty{color:var(--muted);font-size:14px}
.sheet-open{display:none}
.sheet,.sheet-backdrop{display:none}
/* ---------- cards / grids (skills, tutorials, blog, about) ---------- */
.grid{display:grid;gap:20px}
.grid>*,.plat-grid>*,.steps>*{min-width:0}
.grid-4{grid-template-columns:repeat(4,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;box-shadow:var(--shadow);transition:box-shadow var(--dur) var(--ease),border-color var(--dur) var(--ease),transform var(--dur) var(--ease)}
.card:hover{border-color:color-mix(in srgb,var(--primary) 45%,var(--line));box-shadow:var(--shadow-lg);transform:translateY(-3px)}
.card h3{font-size:17.5px;margin:0}
.card .desc{color:var(--muted);font-size:14px;margin:8px 0 14px;flex:1}
.tile{width:48px;height:48px;min-width:48px;display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:800;color:#fff;background:var(--primary);border-radius:14px}
[data-theme="dark"] .tile{color:#06231C}
.card-top{display:flex;gap:12px;align-items:flex-start}
.card-top .latin{color:var(--muted);font-size:12.5px;margin:2px 0 0;direction:ltr;text-align:start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta-row{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);margin:0 0 4px}
.meta-row .ic{font-size:14px}
.card-bottom{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}
.card-bottom .count{color:var(--muted);font-size:13px}
.card-bottom .btn{margin-inline-start:auto}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:4px 12px;border-radius:var(--pill);white-space:nowrap}
.badge-feat{background:var(--accent-soft);color:#8A5200}
[data-theme="dark"] .badge-feat{color:var(--accent)}
.badge-ok{background:var(--primary-soft);color:#0A6B57}
[data-theme="dark"] .badge-ok{color:var(--primary-ink)}
.badge-soon{background:var(--primary-soft);color:var(--primary-ink)}
.badge-acct{background:#FDF3E3;color:#92400E}
[data-theme="dark"] .badge-acct{background:#3A2E12;color:#FCD34D}
.badge-verified{background:var(--primary-soft);color:#0A6B57}
[data-theme="dark"] .badge-verified{color:var(--primary-ink)}
.badge-unverified{background:#FDECEC;color:#B42318}
[data-theme="dark"] .badge-unverified{background:#3A1D1D;color:#FF9A94}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--primary-soft);color:var(--primary-ink);border-radius:var(--pill);padding:5px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.chip.mint{background:var(--primary-soft);color:var(--primary-ink)}
[data-theme="dark"] .chip.mint{color:var(--primary-ink)}
.star-btn{border:1px solid var(--line-strong);background:var(--card);border-radius:12px;width:36px;height:36px;font-size:17px;color:var(--muted);display:inline-flex;align-items:center;justify-content:center}
.star-btn.on{color:#B45309;border-color:#B45309;background:var(--accent-soft)}
/* category cards */
.cat-card{cursor:pointer;text-align:start}
.cat-code{width:52px;height:52px;display:inline-flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;font-family:var(--font-mono);letter-spacing:.04em;color:color-mix(in srgb,var(--mc,#0E8F76) 68%,var(--text));background:color-mix(in srgb,var(--mc,#0E8F76) 14%,var(--card));border:1px solid color-mix(in srgb,var(--mc,#0E8F76) 40%,transparent);border-radius:14px;margin-bottom:14px}
.cat-card h3{font-size:17px}
.cat-card p{color:var(--muted);font-size:13.5px;margin:6px 0 12px;flex:1}
.cat-card .chip,.cat-card .badge{align-self:flex-start}
/* platforms */
.plat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.plat-card{text-align:center;align-items:center;padding:28px 18px}
.plat-card .logo{width:60px;height:60px;background:var(--primary-soft);color:var(--primary-ink);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;margin-bottom:12px;border-radius:16px}
.plat-card h3{font-size:17px}
.plat-card p{color:var(--muted);font-size:13.5px;flex:1}
.plat-row{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 18px;margin-bottom:10px;box-shadow:var(--shadow)}
.plat-row .plat-main{flex:1;min-width:0}
.plat-row .plat-name{font-weight:700;font-size:16px;display:block}
.plat-row .plat-desc{color:var(--muted);font-size:13.5px}
.plat-list{margin-bottom:8px}
/* how it works */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.step{position:relative}
.step .n{width:44px;height:44px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;margin-bottom:14px;border-radius:50%}
[data-theme="dark"] .step .n{color:#06231C}
.step h3{font-size:18px}
.step p{color:var(--muted);font-size:14.5px}
/* toolbar: search + filters */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.toolbar .search-box{flex:1;min-width:220px;position:relative}
.toolbar .search-box input{padding-inline-start:40px}
.toolbar .search-box .mag,.search-box .mag{position:absolute;inset-inline-start:13px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search-box{position:relative}
.search-box input{padding-inline-start:40px}
.toolbar select{width:auto;min-width:160px}
.empty{text-align:center;padding:64px 20px;background:var(--card);border:1px dashed var(--line-strong);border-radius:var(--radius)}
.empty .big{width:64px;height:64px;margin:0 auto 16px;border-radius:50%;background:var(--primary-soft);color:var(--primary-ink);display:flex;align-items:center;justify-content:center;font-size:28px}
.empty h3{font-size:19px}
.empty p{color:var(--muted)}
.nf-num{font-size:72px;color:var(--primary-ink);line-height:1;margin-bottom:8px;font-weight:800}
/* tool detail */
.detail-head{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;margin-bottom:8px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}
.detail-head h1{font-size:clamp(24px,3vw,30px);margin:0}
.detail-head .latin{color:var(--muted);direction:ltr;text-align:start}
.table-scroll{overflow-x:auto;min-width:0}
.tools-table{width:100%;border-collapse:collapse;font-size:14px}
.tools-table th,.tools-table td{text-align:start;padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tools-table th{color:var(--muted);font-size:13px}
.tools-table code{white-space:nowrap}
/* install boxes: dark code windows (CafeBazaar connect block) */
.install-box{background:var(--navy);color:#EDE9E3;border:1px solid #23403C;border-radius:16px;padding:0;margin-bottom:18px;overflow:hidden;box-shadow:var(--shadow)}
.install-box h3{font-size:14px;margin:0;padding:13px 18px;border-bottom:1px solid #23403C;color:#C3D2CC;font-family:var(--font-mono);font-weight:600}
.install-box .copy-row{padding:14px 16px}
.install-box p{color:#B8C4BC;padding:0 18px 16px;margin:0;font-size:14px}
.install-box pre{background:transparent;border:none;padding:0}
.copy-row{display:flex;gap:8px;align-items:flex-start}
.copy-row>*{min-width:0}
.copy-row pre{flex:1;margin:0;white-space:pre-wrap;overflow-wrap:anywhere;overflow-x:visible}
.copy-btn{position:relative;overflow:hidden;border:1px solid var(--line-strong);background:var(--card);border-radius:12px;padding:10px 16px;font-weight:700;color:var(--text);white-space:nowrap;flex-shrink:0;transition:border-color var(--dur) var(--ease),background var(--dur) var(--ease),color var(--dur) var(--ease)}
.install-box .copy-btn{background:#1B3030;border-color:#2F4C48;color:#EEF2EF}
.copy-btn:hover{border-color:var(--primary-ink)}
.copy-btn.copied{background:var(--primary-soft);border-color:var(--primary);color:var(--primary-ink)}
.copy-btn.copied::after{content:"";position:absolute;inset:0;border:2px solid var(--primary);border-radius:inherit;animation:ripple .6s ease-out}
@keyframes ripple{from{opacity:.9;transform:scale(.92)}to{opacity:0;transform:scale(1.12)}}
.copied-flash{animation:flash .7s ease-out}
@keyframes flash{0%{background:var(--primary-soft)}100%{background:transparent}}
.install-box.copied-flash{animation:flashDark .7s ease-out}
@keyframes flashDark{0%{background:#123527}100%{background:#070A14}}
/* forms */
.form-card{max-width:480px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:32px}
.form-card h1{font-size:24px;text-align:center}
.form-card .sub{text-align:center;color:var(--muted);font-size:14.5px}
.field{margin-bottom:16px}
.field .err{color:var(--danger);font-size:13px;margin-top:5px;display:none}
.field.invalid input,.field.invalid textarea{border-color:var(--danger)}
.field.invalid .err{display:block}
.alert{border-radius:var(--radius-sm);padding:12px 16px;font-size:14px;margin-bottom:16px}
.alert-ok{background:var(--primary-soft);color:var(--primary-ink)}
[data-theme="dark"] .alert-ok{color:var(--primary-ink)}
.alert-err{background:#FDECEC;color:#B42318}
[data-theme="dark"] .alert-err{background:#3A1D1D;color:#FF9A94}
.alert-info{background:var(--primary-soft);color:var(--primary-ink)}
.note{font-size:13px;color:var(--primary-ink);background:var(--primary-soft);border-radius:var(--radius-sm);padding:12px 14px;margin-top:16px}
/* blog / tutorial */
.article-body{max-width:760px}
.article-body h2{font-size:22px;margin:28px 0 10px}
.article-body p{color:var(--muted);font-size:16px}
.article-body ol,.article-body ul{color:var(--muted);font-size:16px;line-height:1.9}
.post-meta{display:flex;gap:14px;color:var(--muted);font-size:13.5px;flex-wrap:wrap;margin-bottom:18px}
.cover{height:180px;border-radius:20px 20px 0 0;margin:-22px -22px 18px;display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:800;color:#fff}
.cover.g1{background:#0E8F76}
.cover.g2{background:#C56B46}
.cover.g3{background:#102A2C}
.cover.g4{background:#0E6E8C}
.cover.g5{background:#44403C}
/* dashboard */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:26px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.stat b{font-size:28px;display:block}
.stat span{color:var(--muted);font-size:13.5px}
/* footer (dark, CafeBazaar style) */
footer.site{margin-top:90px;background:#102A2C;color:#C3D2CC}
[data-theme="dark"] footer.site{background:#0A1717;border-top:1px solid var(--line)}
.foot-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:32px;padding:56px 0 32px}
.foot-grid h4{font-size:15px;margin:0 0 14px;color:#fff}
.foot-grid a{display:block;color:#C3D2CC;font-size:14px;margin-bottom:9px}
.foot-grid a:hover{color:#fff}
.foot-grid p{color:#C3D2CC;font-size:14px}
.foot-bottom{border-top:1px solid rgba(255,255,255,.12);padding:18px 0;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:#8A9A92;font-size:13px}
.socials{display:flex;gap:8px;margin-top:14px}
.socials a{width:38px;height:38px;border-radius:12px;border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;color:#C3D2CC;font-size:16px;transition:border-color var(--dur) var(--ease),color var(--dur) var(--ease),background var(--dur) var(--ease)}
.socials a:hover{color:#fff;border-color:#fff;text-decoration:none}
/* toast (favorites only — copy feedback is the button flip) */
#toast{position:fixed;bottom:22px;inset-inline-start:50%;transform:translateX(-50%);background:var(--navy);color:#F6F4EE;padding:12px 22px;border-radius:var(--pill);font-size:14px;font-weight:600;max-width:calc(100vw - 40px);text-align:center;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:opacity .25s;z-index:100}
#toast.show{opacity:1}
.skip{position:absolute;inset-inline-start:-9999px}
.skip:focus{position:fixed;inset-inline-start:16px;top:16px;z-index:200;background:var(--primary-btn);color:var(--on-primary);padding:10px 18px;border-radius:var(--radius-sm)}
:focus-visible{outline:3px solid var(--primary-ink);outline-offset:2px;border-radius:4px}
/* ---------- connect rocker (pill switch, Simple default) ---------- */
.rocker{margin:18px 0 26px;max-width:720px}
.rocker-track{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--bg-soft);border:1px solid var(--line-strong);border-radius:var(--pill);padding:4px}
.rocker-thumb{position:absolute;top:4px;bottom:4px;width:calc(50% - 4px);inset-inline-start:4px;background:var(--primary-btn);border-radius:var(--pill);transition:inset-inline-start .25s ease;box-shadow:var(--shadow-accent)}
.rocker[data-track="tech"] .rocker-thumb{inset-inline-start:calc(50%)}
.rocker-thumb .grip{display:none}
.rocker-opt{position:relative;z-index:1;background:transparent;border:none;padding:14px 12px;text-align:center;color:var(--muted);border-radius:var(--pill)}
.rocker-opt.active{color:#fff}
[data-theme="dark"] .rocker-opt.active{color:#06231C}
.rocker-tag{display:block;font-size:11.5px;font-weight:700;opacity:.85;margin-bottom:2px}
[dir="ltr"] .rocker-tag{text-transform:uppercase;letter-spacing:.07em}
.rocker-label{display:block;font-size:16px;font-weight:800}
.rocker-desc{color:var(--muted);font-size:14.5px;margin:12px 0 0;text-align:center}
/* connect steps */
.big-steps{list-style:none;padding:0;margin:0 0 26px;counter-reset:bigstep}
.big-steps>li{counter-increment:bigstep;position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;padding-inline-start:76px;margin-bottom:16px;box-shadow:var(--shadow)}
.big-steps>li::before{content:counter(bigstep);position:absolute;inset-inline-start:22px;top:20px;width:40px;height:40px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;border-radius:50%}
[data-theme="dark"] .big-steps>li::before{color:#06231C}
.big-steps h3{font-size:17px;margin:0 0 8px}
.big-steps p{color:var(--muted);font-size:14.5px}
.big-steps p:last-child{margin-bottom:0}
.callout{background:var(--accent-soft);border:1px solid #F5D9A8;border-radius:var(--radius);padding:16px 18px;font-size:14.5px;margin:0 0 22px}
[data-theme="dark"] .callout{border-color:#5C4520}
.paths{width:100%;border-collapse:collapse;font-size:14px;margin:10px 0 4px;display:block;overflow-x:auto}
.paths th,.paths td{text-align:start;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.paths th{color:var(--muted);font-size:13px}
.paths code{white-space:nowrap}
.os-block{margin:12px 0}
.os-block h4{font-size:14.5px;margin:0 0 6px}
/* ---------- command palette ---------- */
.palette{position:fixed;inset:0;z-index:300;display:none}
.palette.open{display:block}
.palette-backdrop{position:absolute;inset:0;background:rgba(7,10,20,.55)}
.palette-panel{position:relative;max-width:620px;margin:12vh auto 0;background:var(--card);border:1px solid var(--line-strong);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);overflow:hidden;margin-inline:16px}
@media (min-width:652px){.palette-panel{margin-inline:auto}}
.palette-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.palette-head .mag{color:var(--muted);font-size:18px}
.palette-head input{border:none;background:transparent;box-shadow:none;padding:4px 0;font-size:16px;flex:1;min-width:0}
.palette-head input:focus{box-shadow:none}
#palette-results{max-height:52vh;overflow-y:auto;padding:8px}
.pal-group{font-size:12px;font-weight:800;color:var(--primary-ink);margin:10px 10px 6px}
[dir="ltr"] .pal-group{text-transform:uppercase;letter-spacing:.08em}
.pal-row{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:transparent;border:none;border-radius:var(--radius-sm);padding:10px;color:var(--text)}
.pal-row.sel{background:var(--primary-soft)}
.pal-main{display:flex;flex-direction:column;min-width:0;flex:1}
.pal-name{font-weight:700;font-size:15px}
.pal-sub{color:var(--muted);font-size:12.5px}
.pal-jump{color:var(--muted);font-size:14px}
.pal-empty{color:var(--muted);font-size:14px;padding:18px 10px;text-align:center}
.palette-hint{color:var(--muted);font-size:12.5px;margin:0;padding:10px 16px;border-top:1px solid var(--line);text-align:center}
/* ---------- soft fade-up entrance ---------- */
.unfold{opacity:0;transform:translateY(10px)}
.unfold.in{opacity:1;transform:none;transition:opacity .45s ease,transform .45s ease}
/* ---------- responsive ---------- */
@media (max-width:1280px){
  nav.main{display:none}
  .burger{display:inline-flex}
  .mp-layout{grid-template-columns:260px minmax(0,1fr)}
  .inspector{display:none}
}
@media (max-width:1020px){
  .hero-grid{grid-template-columns:1fr;gap:36px}
  .hero h1{font-size:40px}
  .grid-4{grid-template-columns:repeat(2,1fr)}
  .grid-3{grid-template-columns:repeat(2,1fr)}
  .plat-grid{grid-template-columns:repeat(2,1fr)}
  .steps{grid-template-columns:1fr}
  .foot-grid{grid-template-columns:1fr 1fr}
  .stat-grid{grid-template-columns:1fr}
  .mp-layout{grid-template-columns:minmax(0,1fr)}
  .filter-rail{display:none}
  .sheet-open{display:inline-flex;margin-bottom:16px}
  .sheet{display:block;position:fixed;inset-inline:0;bottom:0;z-index:250;background:var(--card);border-top:1px solid var(--line-strong);border-radius:20px 20px 0 0;padding:16px 20px 24px;transform:translateY(105%);transition:transform .3s ease;max-height:82vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
  .sheet.open{transform:translateY(0)}
  .sheet-backdrop{display:block;position:fixed;inset:0;z-index:240;background:rgba(7,10,20,.45);opacity:0;pointer-events:none;transition:opacity .3s}
  .sheet-backdrop.open{opacity:1;pointer-events:auto}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .sheet .rail-block{margin-bottom:12px}
}
@media (max-width:600px){
  .section{padding:44px 0 4px}
  .hero{padding:44px 0 32px}
  .hero h1{font-size:32px}
  .section-head h2{font-size:24px}
  .grid-4,.grid-3,.grid-2,.plat-grid{grid-template-columns:1fr}
  .foot-grid{grid-template-columns:1fr}
  .hero-search{flex-direction:column;border-radius:var(--radius);padding:10px}
  .hero-search .btn{width:100%}
  .brand{font-size:16px;gap:8px}
  .brand .mark{width:34px;height:34px}
  .brand small{display:none}
  .nav-right{gap:6px}
  .icon-btn{width:44px;height:44px;font-size:17px}
  .palette-btn{display:none}
  .lang-select{padding:0 4px;font-size:12px}
  .fav-btn{display:none}
  .nav{gap:8px}
  .detail-head h1{font-size:24px}
  .copy-row{flex-direction:column;align-items:stretch}
  .copy-row .copy-btn{padding:11px 16px}
  .big-steps>li{padding:64px 18px 18px}
  .big-steps>li::before{top:14px;inset-inline-start:18px;width:36px;height:36px;font-size:16px}
  .palette-panel{margin-top:8vh}
  .rocker-label{font-size:14.5px}
  .demo-body{min-height:220px}
  .mint-banner{padding:20px}
  .srv-top{flex-wrap:wrap}
  .srv-count{order:3}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;scroll-behavior:auto !important}
  .unfold{opacity:1;transform:none}
  .demo-body .cursor{animation:none}
}
/* ---- Phase 2 port (2026-11-18): builder, install panel, demo, status,
   guide, submit, my, banner, bottom nav, whats-new ---- */
.top-banner{background:var(--navy);color:#EDE9E3;padding:9px 0;font-size:13.5px}
.top-banner .wrap{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.top-banner a{color:var(--primary-bright);font-weight:700}
.top-banner .x{margin-inline-start:auto;background:transparent;border:1px solid #2F4C48;color:#C3D2CC;border-radius:var(--pill);padding:3px 12px;cursor:pointer;font-size:12.5px}
.nav-more{position:relative}
.nav-more-btn{background:none;border:0;color:var(--text);font:inherit;font-weight:600;padding:8px 10px;cursor:pointer;border-radius:var(--radius-sm)}
.nav-more-btn:hover{background:var(--bg-soft)}
.nav-more-menu{position:absolute;inset-inline-start:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);box-shadow:var(--shadow-lg);min-width:210px;padding:6px;display:none;z-index:60}

 {q:{fa:"برای استفاده از سرورها کلید API لازم است؟",tr:"Sunucuları kullanmak için API anahtarı gerekir mi?",en:"Do I need an API key to use the servers?"},a:{fa:"نه. همهٔ سرورها روی کامپیوتر خودت با uvx اجرا می‌شوند؛ بدون کلید API، بدون حساب و بدون ثبت‌نام.",tr:"Hayır. Tüm sunucular uvx ile kendi bilgisayarınızda çalışır — API anahtarı yok, hesap yok, kayıt yok.",en:"No. Every server runs on your own computer with uvx — no API key, no account, no sign-up."}},
 {q:{fa:"سرورها فقط‌خواندنی‌اند؟",tr:"Sunucular salt okunur mu?",en:"Are the servers read-only?"},a:{fa:"بله. سرورها فقط دادهٔ عمومی سایت‌ها را می‌خوانند؛ چیزی نمی‌خرند، رزرو نمی‌کنند و در هیچ حسابی تغییری نمی‌دهند. یک استثنا: hepsiburada-mcp اقدامات حساب اختیاری (سبد خرید و علاقه‌مندی‌ها) دارد که فقط با کوکی نشست مرورگر خودت کار می‌کنند — بدون آن، مثل بقیه فقط‌خواندنی است.",tr:"Evet. Sunucular yalnızca sitelerin herkese açık verilerini okur; hiçbir şey satın almaz, rezerve etmez ve hiçbir hesapta değişiklik yapmaz. Tek istisna: hepsiburada-mcp, yalnızca kendi tarayıcı oturum çerezinizle çalışan isteğe bağlı hesap işlemleri (sepet + favoriler) sunar — olmadan diğerleri gibi salt okunurdur.",en:"Yes. The servers only read the sites' public data; they never buy, book, or change anything in an account. One exception: hepsiburada-mcp offers optional account actions (cart + favorites) that work only with your own browser session cookie — without it, it is read-only like the rest."}},
 {q:{fa:"این سرورها رسمی‌اند؟",tr:"Bu sunucular resmi mi?",en:"Are these servers official?"},a:{fa:"نه؛ غیررسمی و ساختهٔ جامعه‌اند و از همان نشانی‌هایی استفاده می‌کنند که خود سایت‌ها به کار می‌برند. اگر سایتی تغییر کند، سرورش ممکن است از کار بیفتد؛ اینجا نگهداری و به‌روز می‌شوند.",tr:"Hayır; resmi değiller, topluluk yapımıdır ve sitelerin kendi kullandığı adresleri kullanırlar. Bir site değişirse sunucusu bozulabilir; burada bakımı yapılır ve güncellenir.",en:"No; they are unofficial, community-built, and use the same endpoints the sites themselves use. If a site changes, its server may break; they are maintained and updated here."}},

const ARTICLES = [
 {id:"what-is-mcp",cat:"basics",date:"2026-11-05",mins:6,cover:"g1",icon:"🔌",
  title:{fa:"MCP چیست؟ به زبان ساده",tr:"MCP nedir? Sade bir dille",en:"What is MCP, in plain language"},
  ex:{fa:"پروتکل اتصال هوش مصنوعی به دنیای واقعی — بدون اصطلاحات پیچیده، با مثال‌های واقعی.",tr:"Yapay zekâyı gerçek dünyaya bağlayan protokol — karmaşık terimler olmadan, gerçek örneklerle.",en:"The protocol that connects AI to the real world — no jargon, with real examples."},
  body:{fa:["مدل‌های هوش مصنوعی متن می‌نویسند، اما به‌تنهایی به دنیای بیرون دسترسی ندارند: نمی‌دانند قیمت دلار امروز چقدر است، در فروشگاه چه کالایی موجود است یا فردا چه اتوبوسی از استانبول به آنکارا می‌رود. MCP یا «پروتکل زمینهٔ مدل» (Model Context Protocol) یک قرارداد استاندارد است که به دستیار هوش مصنوعی اجازه می‌دهد با ابزارهای بیرونی صحبت کند.","به زبان ساده: MCP یک «پریز استاندارد» است. هر سرویس — فروشگاه، سایت آگهی، بانک مرکزی — یک «دوشاخه» می‌سازد و دستیار شما می‌تواند آن را وصل کند و سؤال شما را به یک فراخوانی ابزار تبدیل کند. بدون MCP، هر اتصال یک کار سفارشی و یک‌باره بود؛ با MCP، یک بار وصل می‌شوی و همه‌جا کار می‌کند.","سرورهای این کاتالوگ دقیقاً همین کار را می‌کنند: هر کدام یک سرویس ترکیه را — مثلاً Hepsiburada یا obilet — به دستیار شما وصل می‌کنند. همه فقط‌خواندنی‌اند: داده می‌خوانند، اما هرگز وارد حساب شما نمی‌شوند، خرید نمی‌کنند و چیزی را تغییر نمی‌دهند.","برای شروع، کافی است یک سرور را با uvx نصب کنی و آن را به Claude Code یا Cursor وصل کنی. از آن لحظه، به‌جای باز کردن ده تب مرورگر، از دستیارت می‌پرسی — و جواب را با عدد و منبع می‌گیری."],
         tr:["Yapay zekâ modelleri metin yazar, ancak tek başlarına dış dünyaya erişemezler: bugünkü dolar kurunu, mağazada hangi ürünün stokta olduğunu veya yarın İstanbul'dan Ankara'ya hangi otobüsün gittiğini bilemezler. MCP (Model Context Protocol — Model Bağlam Protokolü), yapay zekâ asistanının dış araçlarla konuşmasını sağlayan standart bir sözleşmedir.","Basitçe söylemek gerekirse MCP standart bir “priz”dir. Her hizmet — mağaza, ilan sitesi, merkez bankası — bir “fiş” yapar ve asistanınız onu takıp sorunuzu bir araç çağrısına dönüştürebilir. MCP olmadan her bağlantı özel ve tek seferlik bir işti; MCP ile bir kez bağlanırsınız ve her yerde çalışır.","Bu katalogdaki sunucular tam olarak bunu yapar: her biri bir Türkiye servisini — örneğin Hepsiburada veya obilet — asistanınıza bağlar. Hepsi salt okunurdur: veri okurlar ama asla hesabınıza girmez, satın alma yapmaz ve hiçbir şeyi değiştirmezler.","Başlamak için bir sunucuyu uvx ile kurup Claude Code veya Cursor'a bağlamanız yeterlidir. O andan itibaren on sekme açmak yerine asistanınıza sorarsınız — ve yanıtı sayı ve kaynakla alırsınız."],
         en:["AI models write text, but on their own they cannot reach the outside world: they don't know today's dollar rate, which products are in stock, or which bus leaves Istanbul for Ankara tomorrow. MCP — the Model Context Protocol — is a standard contract that lets an AI assistant talk to outside tools.","Simply put, MCP is a standard “socket”. Every service — a shop, a listings site, a central bank — builds a “plug”, and your assistant can connect it and turn your question into a tool call. Without MCP, every connection was a custom one-off job; with MCP, you connect once and it works everywhere.","The servers in this catalog do exactly that: each one connects a Turkish service — Hepsiburada or obilet, for example — to your assistant. All of them are read-only: they read data but never log in to your account, never buy anything and never change anything.","To start, just install a server with uvx and connect it to Claude Code or Cursor. From then on, instead of opening ten browser tabs, you ask your assistant — and get the answer with numbers and a source."]}},
 {id:"choose-client",cat:"guides",date:"2026-11-04",mins:5,cover:"g2",icon:"🧭",
  title:{fa:"کدام کلاینت MCP برای شما مناسب است؟",tr:"Hangi MCP istemcisi size uygun?",en:"Which MCP client is right for you?"},
  ex:{fa:"Claude Code، Cursor، Claude Desktop یا VS Code — انتخاب درست به روش کارت بستگی دارد.",tr:"Claude Code, Cursor, Claude Desktop veya VS Code — doğru seçim çalışma şeklinize bağlıdır.",en:"Claude Code, Cursor, Claude Desktop or VS Code — the right choice depends on how you work."},
  body:{fa:["اگر بیشتر در ترمینال کار می‌کنی، Claude Code سریع‌ترین راه است: یک دستور، و سرور وصل است. برای کسانی که با خط فرمان راحت‌اند، هیچ راه ساده‌تری نیست.","اگر برنامه‌نویس هستی و در ویرایشگر کد زندگی می‌کنی، Cursor یا VS Code انتخاب طبیعی است؛ سرور در کنار کدت قرار می‌گیرد و می‌توانی از دستیار بخواهی هم‌زمان کد و دادهٔ واقعی را ببیند.","اگر فقط می‌خواهی گفت‌وگو کنی و سؤال بپرسی، Claude Desktop ساده‌ترین گزینه است: یک بار فایل پیکربندی را ویرایش می‌کنی و بعد همه‌چیز در چت است.","یک نکتهٔ مهم: سرورهای محلی (stdio) فقط روی کامپیوتر خودت اجرا می‌شوند. نسخهٔ وب ChatGPT و Gemini فعلاً با این سرورها تأیید نشده‌اند — پس اگر از نسخهٔ وب استفاده می‌کنی، سراغ کلاینت‌های دسکتاپ یا خط فرمان برو."],
         tr:["Çoğunlukla terminalde çalışıyorsanız Claude Code en hızlı yoldur: tek komut ve sunucu bağlanır. Komut satırıyla rahat olanlar için daha kolayı yoktur.","Programcıysanız ve kod düzenleyicide yaşıyorsanız Cursor veya VS Code doğal seçimdir; sunucu kodunuzun yanında durur ve asistandan kodu ve gerçek veriyi aynı anda görmesini isteyebilirsiniz.","Yalnızca sohbet etmek ve soru sormak istiyorsanız Claude Desktop en basit seçenektir: yapılandırma dosyasını bir kez düzenlersiniz, sonrası sohbettedir.","Önemli bir not: yerel (stdio) sunucular yalnızca kendi bilgisayarınızda çalışır. ChatGPT ve Gemini'nin web sürümleri bu sunucularla henüz doğrulanmadı — web sürümü kullanıyorsanız masaüstü veya komut satırı istemcilerini tercih edin."],
         en:["If you mostly live in the terminal, Claude Code is the fastest path: one command and the server is connected. For anyone comfortable with the command line, there is nothing simpler.","If you are a programmer who lives in a code editor, Cursor or VS Code is the natural choice; the server sits next to your code and you can ask the assistant to see code and real data at the same time.","If you only want to chat and ask questions, Claude Desktop is the simplest option: you edit the config file once, and afterwards everything happens in the chat.","One important note: local (stdio) servers run only on your own computer. The web versions of ChatGPT and Gemini are not yet verified with these servers — so if you use the web version, pick a desktop or command-line client instead."]}},
 {id:"turkey-servers",cat:"guides",date:"2026-11-03",mins:7,cover:"g3",icon:"🇹🇷",
  title:{fa:"سرورهای ترکیه چطور کار می‌کنند؟",tr:"Türkiye sunucuları nasıl çalışır?",en:"How do the Turkey servers work?"},
  ex:{fa:"پشت صحنهٔ سرورهای فقط‌خواندنی: از کجا داده می‌خوانند، چه چیزی را نمی‌توانند انجام دهند و چرا امن‌اند.",tr:"Salt okunur sunucuların perde arkası: veriyi nereden okurlar, neyi yapamazlar ve neden güvenlidirler.",en:"Behind the scenes of the read-only servers: where they read data, what they cannot do, and why they are safe."},
  body:{fa:["هر سرور این کاتالوگ یک برنامهٔ کوچک پایتون است که با uvx اجرا می‌شود. وقتی دستیارت سؤالی می‌پرسد — مثلاً «ارزان‌ترین هدفون بی‌سیم چنده؟» — سرور به سایت مربوطه سر می‌زند، صفحه را می‌خواند و جواب ساخت‌یافته برمی‌گرداند.","داده‌ها همیشه زنده‌اند: نرخ ارز از XML رسمی بانک مرکزی ترکیه خوانده می‌شود، قیمت کالا از صفحهٔ فروشگاه، و ساعت اتوبوس از obilet. هیچ پایگاه دادهٔ قدیمی و هیچ عدد حدسی در میان نیست.","مهم‌ترین اصل طراحی این سرورها «فقط‌خواندنی» بودن است. آن‌ها هیچ حساب کاربری، رمز عبور یا توکنی ندارند؛ نمی‌توانند وارد حسابت شوی، خرید کنند یا رزرو انجام دهند. یک استثنا: hepsiburada-mcp اقدامات حساب اختیاری (سبد خرید و علاقه‌مندی‌ها) ارائه می‌دهد که فقط وقتی کار می‌کنند که کوکی نشست مرورگر خودت را به پیکربندی آن اضافه کنی — بدون آن، مثل بقیه فقط‌خواندنی می‌ماند. بدترین کاری که یک سرور خراب می‌تواند بکند، برگرداندن یک جواب اشتباه است — و تو همیشه می‌توانی آن را با باز کردن سایت بررسی کنی.","همهٔ سرورها متن‌باز‌اند و کدشان در گیت‌هاب است. اگر کنجکاوی، می‌توانی دقیقاً ببینی هر ابزار چه درخواستی می‌فرستد و چه چیزی برمی‌گرداند. شفافیت، به‌جای اعتماد کورکورانه، اصل این پروژه است."],
         tr:["Bu katalogdaki her sunucu uvx ile çalışan küçük bir Python programıdır. Asistanınız bir soru sorduğunda — örneğin “en ucuz kablosuz kulaklık ne kadar?” — sunucu ilgili siteye gider, sayfayı okur ve yapılandırılmış bir yanıt döndürür.","Veriler her zaman canlıdır: döviz kuru Türkiye Cumhuriyet Merkez Bankası'nın resmi XML'inden, ürün fiyatı mağaza sayfasından, otobüs saati obilet'ten okunur. Eski bir veritabanı ve tahminî sayı yoktur.","Bu sunucuların en önemli tasarım ilkesi “salt okunur” olmalarıdır. Hiçbir kullanıcı hesabı, şifre veya jetonları yoktur; hesabınıza giremez, satın alma yapamaz veya rezervasyon yapamazlar. Tek istisna: hepsiburada-mcp, kendi tarayıcı oturum çerezinizi yapılandırmasına eklediğinizde çalışan isteğe bağlı hesap işlemleri (sepet + favoriler) sunar — olmadan diğerleri gibi salt okunur kalır. Bozuk bir sunucunun yapabileceği en kötü şey yanlış bir yanıt döndürmektir — ve bunu siteyi açarak her zaman doğrulayabilirsiniz.","Tüm sunucular açık kaynaklıdır ve kodları GitHub'dadır. Merak ediyorsanız her aracın tam olarak hangi isteği gönderdiğini ve ne döndürdüğünü görebilirsiniz. Kör güven yerine şeffaflık bu projenin ilkesidir."],
         en:["Each server in this catalog is a small Python program that runs with uvx. When your assistant asks a question — “what is the cheapest wireless earphone?” — the server visits the relevant site, reads the page and returns a structured answer.","The data is always live: exchange rates come from the Central Bank of Türkiye's official XML, product prices from the shop page, and bus times from obilet. There is no stale database and no guessed numbers.","The most important design principle of these servers is that they are read-only. They have no user account, no password and no token; they cannot log in to your account, buy anything or make a reservation. One exception: hepsiburada-mcp offers optional account actions (cart + favorites) that work only when you add your own browser session cookie to its config — without it, it stays read-only like the rest. The worst thing a broken server can do is return a wrong answer — and you can always check it by opening the site.","All servers are open source and their code is on GitHub. If you are curious, you can see exactly what request each tool sends and what it returns. Transparency, instead of blind trust, is this project's principle."]}}
];

 conn_track_tech_d:"Geliştiriciler için — tüm uygulamalar, komutlar ve ayarlar.",
 conn_simple_what_t:"MCP nedir?",
 conn_simple_what_d:"«MCP», yapay zekâ asistanını gerçek hizmetlere bağlamanın standart bir yoludur — standart bir elektrik prizi gibidir: her hizmetin bir «fişi» vardır ve asistanınız onu takar. Bağlandıktan sonra on sekme açmak yerine asistanınıza sorarsınız — örneğin «Bugün dolar kuru ne kadar?» — ve yanıtı sayı ve kaynakla alırsınız. Bu katalogdaki tüm sunucular yalnızca sitelerin herkese açık bilgilerini okur; hiçbir şey satın almaz ve hiçbir hesaba girmez.",
 conn_simple_note_web:"Önemli bir not: bu sunucular kendi bilgisayarınızda çalışır ve yalnızca masaüstü uygulamalarıyla (ör. Claude Desktop) çalışır — tarayıcıdaki claude.ai veya ChatGPT sitesinde çalışmazlar.",
 conn_simple_steps_t:"Adım adım: Claude Desktop ile bağlanma",
 conn_simple_s1_t:"Claude Desktop uygulamasını indirin ve kurun",
 conn_simple_s1_d:"Claude'un resmi indirme sayfasından Windows veya Mac sürümünü alın ve diğer uygulamalar gibi kurun. (Windows ve Mac için yayınlandı; Linux için resmi uygulama yok — Linux kullanıcıları teknik kılavuzdaki Claude Code yolunu kullansın.)",
 conn_simple_s1_btn:"Claude Desktop'ı indir",
 conn_simple_s2_t:"Küçük «uvx» aracını kurun",
 conn_simple_s2_d:"Sunucular, uvx adlı küçük ve ücretsiz bir araçla çalışır. Önce onu kurmanız gerekir — bir kez, sonsuza dek. Terminali (komut satırı) açın, sisteminize uygun komutu yapıştırın ve Enter'a basın:",
 conn_simple_s2_win:"Windows: Windows tuşuna basın, «PowerShell» yazıp açın; sonra bu komutu yapıştırın:",
 conn_simple_s2_mac:"Mac: Cmd + Space tuşlarına basın, «Terminal» yazıp açın; sonra bu komutu yapıştırın:",
 conn_simple_s2_lin:"Linux: Terminali açmak için Ctrl + Alt + T tuşlarına basın; sonra bu komutu yapıştırın:",
 conn_simple_s2_check:"Kurulduğundan emin olmak için terminale şunu yazıp Enter'a basın: «uvx --version» — bir sürüm numarası görürseniz hazırsınız.",
 conn_simple_s3_t:"Ayar dosyasını açın",
 conn_simple_s3_d:"En kolay yol: Claude Desktop uygulamasını açıp «Settings → Developer → Edit Config» yoluna gidin. Ayar dosyası açılır. Elle bulmak isterseniz burada yaşar:",
 conn_simple_s3_os:"İşletim sistemi",
 conn_simple_s3_win:"Windows",
 conn_simple_s3_mac:"Mac",
 conn_simple_s3_lin:"Linux (resmi olmayan derlemeler)",
 conn_simple_s4_t:"Bu metni dosyanın içine yapıştırın",
 conn_simple_s4_d:"Sunucunuzu seçin, «Kopyala» düğmesine basın ve metni ayar dosyasına yapıştırın. Dosya boşsa metnin tamamını yapıştırın; içinde zaten bir şey varsa yalnızca «mcpServers» içindeki bölümü ekleyin. Sonra dosyayı kaydedin (Windows ve Linux'ta Ctrl + S, Mac'te Cmd + S).",
 conn_simple_server:"Sunucu:",
 conn_simple_s5_t:"Uygulamayı tamamen kapatıp yeniden açın",
 conn_simple_s5_d:"Pencereyi kapatmak yetmez: Windows'ta görev çubuğundaki Claude simgesine sağ tıklayıp «Quit» seçin; Mac'te Cmd + Q tuşlarına basın. Sonra uygulamayı yeniden açın.",
 conn_simple_s6_t:"Deneyin: bir soru sorun",
 conn_simple_s6_d:"Yeni bir sohbette bu soruyu sorun. Yanıt sayılarla gelirse bağlantı kurulmuştur.",
 conn_simple_s6_q:"«Bugün USD/TRY kuru ne kadar?»",
 conn_simple_s6_q_generic:"Bu sunucunun yanıtlayabileceği bir soru sorun — sunucunun sayfası neyi yanıtlayabileceğini söyler.",
 conn_simple_tb_t:"Sorun mu çıktı?",
 conn_simple_tb1_t:"Uygulama sunucuyu görmüyor",
 conn_simple_tb1_d:"Uygulamayı tamamen kapatıp yeniden açın (5. adım) — pencereyi kapatmak yetmez. Hâlâ görmüyorsa dosyayı kaydettiğinizden emin olun.",
 conn_simple_tb2_t:"JSON hatası veya «dosya bozuk»",
 conn_simple_tb2_d:"Ayar dosyası tam ve yazım hatasız olmalı. En kolay çözüm: dosyadaki tüm metni silin ve 4. adımdaki «Kopyala» düğmesiyle yeniden yapıştırın. Fazla virgül veya parantez kalmamasına dikkat edin.",
 conn_simple_tb3_t:"«uvx bulunamadı» veya sunucu çalışmıyor",
 conn_simple_tb3_d:"Bu, uvx aracının kurulu olmadığı anlamına gelir. 2. adımı yeniden yapın, sonra terminali ve Claude Desktop uygulamasını kapatıp yeniden açın. «uvx --version» komutuyla kurulduğunu doğrulayın.",

const LANGS = {fa:{name:"فارسی",dir:"rtl",locale:"fa-IR"},tr:{name:"Türkçe",dir:"ltr",locale:"tr-TR"},en:{name:"English",dir:"ltr",locale:"en-US"}};

/* ---------------- state & helpers ---------------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const state = {
  lang: store.get("tmp_lang", null) || ((navigator.language||"fa").slice(0,2)==="tr"?"tr":(navigator.language||"").slice(0,2)==="en"?"en":"fa"),
  theme: store.get("tmp_theme", null) || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"),
  page: "home", param: null, anchor: null, query: {}
};
if(!["fa","tr","en"].includes(state.lang)) state.lang = "fa";
function t(k){ const d = I18N[state.lang]||I18N.en; return d[k]!==undefined?d[k]:(I18N.en[k]!==undefined?I18N.en[k]:k); }
function L(obj){ return obj ? (obj[state.lang]!==undefined?obj[state.lang]:obj.en) : ""; }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
function loc(){ return LANGS[state.lang].locale; }
function fmtNum(n){ try{ return new Intl.NumberFormat(loc()).format(n); }catch(e){ return String(n); } }
function fmtDate(iso){ try{ return new Intl.DateTimeFormat(loc(),{year:"numeric",month:"long",day:"numeric"}).format(new Date(iso+"T00:00:00")); }catch(e){ return iso; } }
function hashFor(page, param){ return "#/" + state.lang + "/" + page + (param?"/"+param:""); }
function catName(id){ return t("cat_"+id.replace("-","_")) || id; }
function catDesc(id){ return t("cat_"+id.replace("-","_")+"_d") || ""; }
function serverDesc(s){ return state.lang==="fa"?s.desc_fa:state.lang==="tr"?s.desc_tr:s.desc; }
function toolSum(tl){ return state.lang==="fa"?tl.sf:state.lang==="tr"?tl.st:tl.s; }
function skillTag(k){ return state.lang==="fa"?k.tag_fa:state.lang==="tr"?k.tag_tr:k.tag; }
function skillGap(k){ return state.lang==="fa"?k.gap_fa:state.lang==="tr"?k.gap_tr:k.gap; }
function favs(){ return store.get("tmp_favs_v1", []); }
function isFav(type,id){ return favs().some(f=>f.type===type&&f.id===id); }
function recent(){ return store.get("tmp_recent_v1", []); }
function pushRecent(type,id){ let r = recent().filter(x=>!(x.type===type&&x.id===id)); r.unshift({type,id,at:Date.now()}); store.set("tmp_recent_v1", r.slice(0,8)); }
function toast(msg){ const el=document.getElementById("toast"); if(!el) return; el.textContent=msg; el.classList.add("show"); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove("show"),2600); }
function copyText(txt, msg){ const done=()=>toast(msg||t("tool_copied"));
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt,done)); }
  else fallbackCopy(txt,done); }
function fallbackCopy(txt, done){ const ta=document.createElement("textarea"); ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); }catch(e){} document.body.removeChild(ta); done(); }

/* ---------------- router ---------------- */
const PAGES = ["home","marketplace","tool","categories","skills","skill","tutorials","tutorial","blog","article","about","contact","favorites","ask","connect","builder","demo","status","guide","submit","my","privacy","terms","md"];
function parseHash(){
  const raw = location.hash||"";
  if(raw && !raw.startsWith("#/")){
    const id = raw.slice(1);
    if(/^[A-Za-z][\w-]*$/.test(id)){ state.anchor = id; return; }
  }
  const qpos = raw.indexOf("?");
  const pathRaw = qpos>=0 ? raw.slice(0,qpos) : raw;
  state.query = {};
  if(qpos>=0){ try{ new URLSearchParams(raw.slice(qpos+1)).forEach((v,k)=>{ state.query[k]=v; }); }catch(e){} }
  const h = pathRaw.replace(/^#\/?/,"");
  const parts = h.split("/").filter(Boolean);
  let lang = parts[0], page = parts[1]||"home", param = parts[2]||null;
  if(!["fa","tr","en"].includes(lang)){ lang = state.lang; page = parts[0]||"home"; param = parts[1]||null; }
  if(!PAGES.includes(page)){ state.page="404"; state.param=page; state.lang=lang; return; }
  state.lang = lang; state.page = page; state.param = param;
}
function hashForQ(page, param, q){
  let h = hashFor(page, param);
  if(q){
    const parts = [];
    Object.keys(q).forEach(k=>{ if(q[k]!==undefined && q[k]!=="") parts.push(encodeURIComponent(k)+"="+encodeURIComponent(q[k])); });
    if(parts.length) h += "?" + parts.join("&");
  }
  return h;
}

  if(mp.cat!=="all") q.cat = mp.cat;
  if(mp.type!=="all") q.type = mp.type;
  if(mp.sort!=="recommended") q.sort = mp.sort;
  ["local","profile","nokey","noacct","official"].forEach(k=>{ if(mp[k]) q[k]="1"; });
  return q;
}
function mpFromQuery(){
  const q = state.query||{};
  mp.q = q.q||"";
  mp.cat = (q.cat && (q.cat==="all" || CATEGORIES.some(c=>c.id===q.cat))) ? q.cat : "all";
  mp.type = ["all","servers","skills","tutorials","articles"].indexOf(q.type)>=0 ? q.type : "all";
  mp.sort = q.sort==="popular" ? "recommended" : (["recommended","newest","alpha"].indexOf(q.sort)>=0 ? q.sort : "recommended");
  ["local","profile","nokey","noacct","official"].forEach(k=>{ mp[k] = q[k]==="1"; });
}
function mpSyncUrl(){
  if(state.page!=="marketplace") return;
  try{ history.replaceState(null, "", location.pathname + location.search + hashForQ("marketplace", state.param, mpQueryObj())); }catch(e){}
}
function mpFiltered(){
  let list = SERVERS.slice();
  const q = mp.q.trim().toLowerCase();
  if(q) list = list.filter(s => (s.id+" "+s.title+" "+s.title_tr+" "+serverDesc(s)+" "+s.tools.map(x=>x.n+" "+toolSum(x)).join(" ")).toLowerCase().includes(q));
  if(mp.cat!=="all") list = list.filter(s=>s.cat===mp.cat);
  if(mp.noacct) list = list.filter(s=>!s.account);
  if(mp.official) list = list.filter(s=>s.id==="tcmb-mcp");
  /* local / profile / nokey match every server in this catalog (all run on
     your computer, all have a ready profile, none needs an API key) — the
     counts next to them say so, honestly. */
  if(mp.sort==="recommended") list.sort((a,b)=>(b.featured-a.featured) || b.tools.length-a.tools.length || a.id.localeCompare(b.id));
  if(mp.sort==="newest") list.sort((a,b)=>b.added-a.added);
  if(mp.sort==="alpha") list.sort((a,b)=>a.id.localeCompare(b.id));
  return list;
}

function mpMatches(q){
  const s = q.trim().toLowerCase(); if(!s) return {skills:[],tuts:[],arts:[]};
  return {
    skills: SKILLS.filter(k=>(k.id+" "+skillTag(k)).toLowerCase().includes(s)),
    tuts: TUTORIALS.filter(x=>(L(x.title)+" "+L(x.ex)).toLowerCase().includes(s)),
    arts: ARTICLES.filter(a=>(L(a.title)+" "+L(a.ex)).toLowerCase().includes(s))
  };
}
function mpResultsHTML(){
  const list = mpFiltered();

  const showSrv = mp.type==="all" || mp.type==="servers";
  const showSkl = (mp.type==="all" || mp.type==="skills") && m.skills.length;
  const showTut = (mp.type==="all" || mp.type==="tutorials") && m.tuts.length;

  let h = `<p class="result-count">${fmtNum(showSrv?list.length:0)} ${t("results")}</p>`;

let demoIdx = 0, demoTimer = null, typeToken = 0;
function typeText(el, text, speed, token){
  return new Promise(res=>{
    let i=0;
    (function tick(){
      if(token!==typeToken || !document.body.contains(el)) return res();
      el.textContent = text.slice(0, ++i);
      if(i<text.length) setTimeout(tick, speed); else res();
    })();
  });
}
function hlCode(code){
  const m = code.match(/^([a-z0-9_]+)(\(.*\))$/);
  if(!m) return esc(code);
  let args = esc(m[2]).replace(/(&quot;|")([^"]*)(&quot;|")/g, '<span class="str">"$2"</span>');
  return '<span class="fn">'+esc(m[1])+'</span><span class="arg">'+args+'</span>';
}
async function showDemo(){
  const token = ++typeToken;
  const body = document.getElementById("demo-body");
  const tabs = document.getElementById("demo-tabs");
  if(!body || !tabs) return;
  const d = DEMOS[demoIdx];
  tabs.innerHTML = DEMOS.map((x,i)=>`<button data-i="${i}" class="${i===demoIdx?"active":""}" onclick="App.demoTab(${i})">${esc(x.tab[state.lang])}</button>`).join("");
  body.innerHTML = `<p class="q"><span class="typed"></span><span class="cursor"></span></p><pre style="visibility:hidden"><code></code></pre><p class="status"></p><p class="a"></p><p class="ask"></p>`;
  if(prefersRM()){ body.querySelector(".typed").textContent = d.q[state.lang]; } else { await typeText(body.querySelector(".typed"), d.q[state.lang], 26, token); }
  if(token!==typeToken || !document.body.contains(body)) return;
  const pre = body.querySelector("pre");
  pre.style.visibility = "visible";
  pre.querySelector("code").innerHTML = hlCode(d.code);
  body.querySelector(".status").textContent = d.status[state.lang];
  body.querySelector(".a").textContent = d.a[state.lang];
  body.querySelector(".ask").innerHTML = `<a href="${hashFor("ask", encodeURIComponent(d.q[state.lang]))}">${esc(t("demo_ask"))}</a> · ${esc(t("demo_nosignup"))}`;
}
function startDemo(){
  clearInterval(demoTimer);
  if(prefersRM()){ showDemo(); return; }
  demoTimer = setInterval(()=>{ demoIdx = (demoIdx+1)%DEMOS.length; showDemo(); }, 11000);
  showDemo();
}
function stopDemo(){ clearInterval(demoTimer); typeToken++; }

function askNorm(s){
  return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/ي/g,"ی").replace(/ك/g,"ک").replace(/ة/g,"ه")
    .replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d))
    .replace(/[^a-z0-9\u0600-\u06FF ]/g," ").replace(/\s+/g," ").trim();
}
function askTokens(q){ return askNorm(q).split(" ").filter(w=>w.length>1); }
function askHay(s){
  return askNorm([s.id, s.title, s.title_tr||"", s.desc, s.desc_fa, s.desc_tr||"", s.cat,
    s.tools.map(x=>x.n+" "+x.s+" "+(x.sf||"")+" "+(x.st||"")).join(" ")].join(" "));
}
function askScore(q){
  const toks = askTokens(q);
  if(!toks.length) return [];
  const intents = ASK_INTENTS.map(it=>{
    const kws = Object.keys(it.kw).reduce((a,k)=>a.concat(it.kw[k].map(askNorm)),[]);
    const hit = [];
    toks.forEach(w=>{
      kws.forEach(k=>{
        k.split(" ").forEach(kw=>{
          if(kw && (kw===w || (kw.length>=3 && w.indexOf(kw)>=0) || (w.length>3 && kw.indexOf(w)>=0)) && hit.indexOf(kw)<0) hit.push(kw);
        });
      });
    });
    return {cats:it.cats, hit};
  }).filter(x=>x.hit.length);
  return SERVERS.map(s=>{
    const hay = askHay(s);
    let score = 0; const matched = [];
    toks.forEach(w=>{ if(hay.indexOf(w)>=0){ score += 2; if(matched.indexOf(w)<0) matched.push(w); } });
    intents.forEach(it=>{
      if(it.cats.indexOf(s.cat)>=0){ score += 3*it.hit.length; it.hit.forEach(kw=>{ if(matched.indexOf(kw)<0) matched.push(kw); }); }
    });
    return {s, score, matched};
  }).filter(r=>r.score>0).sort((a,b)=>b.score-a.score).slice(0,3);
}

const CONNECT_STATE = {app:"claude-code", track:"simple", simpleServer:"tcmb-mcp"};

function connSnippet(app, s){
  const short = s.id.replace("-mcp","");
  const envKeys = s.env ? Object.keys(s.env) : [];
  const envJson = envKeys.length ? ',\n      "env": {' + envKeys.map(k=>'\n        "'+k+'": "'+s.env[k]+'"').join(',') + '\n      }' : '';
  const envToml = envKeys.length ? '\nenv = {' + envKeys.map(k=>k+' = "'+s.env[k]+'"').join(', ') + '}' : '';
  const envCli = envKeys.length ? envKeys.map(k=>' -e '+k+'='+s.env[k]).join('') : '';
  if(app.kind==="cli") return "claude mcp add --transport stdio --scope user "+short+envCli+" -- uvx "+s.pypi;
  if(app.kind==="toml") return '[mcp_servers.'+short+']\ncommand = "uvx"\nargs = ["'+s.pypi+'"]'+envToml;
  if(app.kind==="vscode") return '{\n  "servers": {\n    "'+short+'": {\n      "type": "stdio",\n      "command": "uvx",\n      "args": ["'+s.pypi+'"]'+envJson+'\n    }\n  }\n}';
  return '{\n  "mcpServers": {\n    "'+short+'": {\n      "command": "uvx",\n      "args": ["'+s.pypi+'"]'+envJson+'\n    }\n  }\n}';
}

/* paper-unfold entrance — VISIBLE BY DEFAULT (root-cause fix 2026-11-18).
   Two previous rounds hid content with CSS (.unfold{opacity:0}) and relied on
   IntersectionObserver + a 900ms fallback to reveal it. In a real headed
   browser the reveal repeatedly failed on fresh loads (detail tool table,
   connect intro stayed ghosted until scroll) while headless CDP probes always
   passed: IO callbacks pause when the tab/window is occluded or backgrounded,
   and late font layout can leave an element below the fold when the fallback
   runs. New invariant: an element is hidden ONLY if (a) JS ran, (b) IO exists,
   (c) the element is BELOW the fold at setup time, and (d) it is actively
   observed. In-viewport elements NEVER get the hiding class, so they can
   never be stuck invisible. A 3s failsafe reveals every hidden element even
   if IO never fires. */
let unfoldObs = null;
function unfoldInView(el){
  const r = el.getBoundingClientRect();
  const vh = window.innerHeight || document.documentElement.clientHeight;
  const vw = window.innerWidth || document.documentElement.clientWidth;
  return r.bottom > 0 && r.top < vh && r.right > 0 && r.left < vw;
}
function observeUnfold(root){
  const scope = root || document;
  const els = scope.querySelectorAll ? scope.querySelectorAll(".srv-card, .ben-card, .card, .stat, .step, .plat-card") : [];
  // Re-renders (search / filter / drawer toggle) pass a root: reveal
  // immediately — re-observing would leave below-fold cards invisible
  // (opacity 0) until the user scrolls (marketplace blank-page bug, 2026-11-18).
  if(root){ els.forEach(el=>{ el.classList.add("unfold","in"); el.style.transitionDelay = "0ms"; }); return; }
  if(prefersRM()){ els.forEach(el=>{ el.classList.add("unfold","in"); }); return; }
  if(!("IntersectionObserver" in window)){ els.forEach(el=>el.classList.add("unfold","in")); return; }
  if(!unfoldObs) unfoldObs = new IntersectionObserver((entries)=>{ entries.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add("in"); unfoldObs.unobserve(en.target); } }); }, {threshold:0.08});
  let hidden = 0;
  els.forEach((el)=>{
    if(el.classList.contains("unfold")) return;
    if(unfoldInView(el)) return; // in viewport: NEVER hide — stays visible by default
    el.classList.add("unfold");
    el.style.transitionDelay = Math.min(hidden,8)*45+"ms";
    hidden++;
    unfoldObs.observe(el);
  });
  // Failsafe: even if IO never fires (occluded/background tab), nothing stays
  // hidden past 3s. Below-fold elements simply appear already-visible on scroll.
  setTimeout(()=>{ document.querySelectorAll(".unfold:not(.in)").forEach(el=>{ el.classList.add("in"); if(unfoldObs) unfoldObs.unobserve(el); }); }, 3000);
}

/* command palette: fuzzy search over servers + FAQ */
const PALETTE = {open:false, q:"", sel:0, items:[]};
function paletteFuzzy(q, text){
  q=askNorm(q); text=askNorm(text);
  if(!q) return 0;
  let score=0, ti=0;
  for(const ch of q){ const ix=text.indexOf(ch, ti); if(ix<0) return 0; score += (ix===ti?2:1); ti=ix+1; }
  if(text.startsWith(q)) score+=10;
  if(text.indexOf(q)>=0) score+=6;
  return score;
}
function paletteResults(q){
  if(!q.trim()) return SERVERS.filter(s=>s.featured).map(s=>({type:"server", s, sc:1}));
  const srv = [];
  if(PALETTE.index && PALETTE.index.length){
    PALETTE.index.forEach(it=>{
      const sc = paletteFuzzy(q, it.s||"");
      if(sc>0){ const s = SERVERS.find(x=>x.id===it.id); if(s) srv.push({type:"server", s, sc}); }
    });
  } else {
    SERVERS.forEach(s=>{ const sc=Math.max(paletteFuzzy(q, s.id+" "+s.title+" "+(s.title_tr||"")+" "+serverDesc(s)+" "+s.tools.map(x=>x.n+" "+toolSum(x)).join(" ")), paletteFuzzy(q, s.id)); if(sc>0) srv.push({type:"server", s, sc}); });
  }
  const tls = [];
  SERVERS.forEach(s=>{ s.tools.forEach(x=>{ const sc=paletteFuzzy(q, x.n+" "+toolSum(x)); if(sc>0) tls.push({type:"tool", s, tool:x, sc}); }); });
  const fq = [];
  FAQ.forEach((f,i)=>{ const sc=paletteFuzzy(q, L(f.q)+" "+L(f.a)); if(sc>0) fq.push({type:"faq", f, i, sc}); });
  srv.sort((a,b)=>b.sc-a.sc); tls.sort((a,b)=>b.sc-a.sc); fq.sort((a,b)=>b.sc-a.sc);
  return srv.slice(0,5).concat(tls.slice(0,3)).concat(fq.slice(0,3));
}
function paletteHTML(){
  const items = PALETTE.items;
  const servers = items.filter(i=>i.type==="server"), tools = items.filter(i=>i.type==="tool"), faqs = items.filter(i=>i.type==="faq");
  let h = "";
  const row = (it, idx)=>{
    const sel = idx===PALETTE.sel;
    if(it.type==="server") return `<button type="button" role="option" aria-selected="${sel}" class="pal-row${sel?" sel":""}" data-idx="${idx}" onclick="App.paletteGo(${idx})"><span class="mono mono-sm" style="--mc:${it.s.color}">${mono(it.s)}</span><span class="pal-main"><span class="pal-name">${esc(it.s.title.split(" — ")[0])}</span><span class="pal-sub latin">${esc(it.s.id)} · ${fmtNum(it.s.tools.length)} ${t("tools_count")}</span></span><span class="pal-jump">↵</span></button>`;
    if(it.type==="tool") return `<button type="button" role="option" aria-selected="${sel}" class="pal-row${sel?" sel":""}" data-idx="${idx}" onclick="App.paletteGo(${idx})"><span class="mono mono-sm" style="--mc:${it.s.color}">ƒ</span><span class="pal-main"><span class="pal-name latin">${esc(it.tool.n)}</span><span class="pal-sub">${esc(toolSum(it.tool))} · ${esc(it.s.id)}</span></span><span class="pal-jump">↵</span></button>`;
    return `<button type="button" role="option" aria-selected="${sel}" class="pal-row${sel?" sel":""}" data-idx="${idx}" onclick="App.paletteGo(${idx})"><span class="mono mono-sm" style="--mc:#005F73">?</span><span class="pal-main"><span class="pal-name">${esc(L(it.f.q))}</span><span class="pal-sub">${t("faq_title")}</span></span><span class="pal-jump">↵</span></button>`;
  };
  let idx=0;
  if(servers.length){ h += `<p class="pal-group">${t("palette_servers")}</p>` + servers.map(it=>row(it, idx++)).join(""); }
  if(tools.length){ h += `<p class="pal-group">${t("palette_tools")}</p>` + tools.map(it=>row(it, idx++)).join(""); }
  if(faqs.length){ h += `<p class="pal-group">${t("palette_faq")}</p>` + faqs.map(it=>row(it, idx++)).join(""); }
  if(!h) h = `<p class="pal-empty">${t("palette_empty")}</p><p class="pal-empty"><a href="${hashFor("submit")}" onclick="App.closePalette()">${t("palette_suggest")}</a></p>`;
  return h;
}

function renderPalette(){
  const box = document.getElementById("palette-results");
  if(box) box.innerHTML = paletteHTML();
}
function openPalette(){
  loadSearchIndex();
  PALETTE.open=true; PALETTE.q=""; PALETTE.sel=0; PALETTE.items=paletteResults("");
  const ov=document.getElementById("palette"); if(!ov) return;
  ov.classList.add("open"); ov.setAttribute("aria-hidden","false");

  renderPalette();
}
function closePalette(){
  PALETTE.open=false;
  const ov=document.getElementById("palette");

}

/* Sample questions, templated from the server's OWN tool data. Labeled as
   examples everywhere they appear; never presented as live answers. */
const EN_VERBS = ["search","list","get","read","show","find","browse","check","view","fetch","compare","calculate","convert","track"];
function lowerFirst(s){ return s ? s.charAt(0).toLowerCase() + s.slice(1) : s; }
function sampleQuestions(s, n){
  const out = [];
  (s.tools||[]).slice(0, n||3).forEach(x=>{
    const enSum = (x.s||"").replace(/\.$/,"");
    const verbLed = EN_VERBS.some(v=>enSum.toLowerCase().indexOf(v)===0);
    const qEn = verbLed ? ("Please " + lowerFirst(enSum) + ".") : ("Tell me about " + lowerFirst(enSum) + ".");
    out.push({ tool:x.n, q:{ fa:"«" + (x.sf||x.s) + "» را نشانم بده.", tr:"Bana " + lowerFirst(x.st||x.s) + " göster.", en:qEn } });
  });
  return out;
}
function sampleQText(s, i){ const qs = sampleQuestions(s, 3); const q = qs[i||0]; return q ? (q.q[state.lang]||q.q.en) : ""; }

  lines.push("- Page: https://mohammad-abbasi-sh.github.io/turkey-mcp/#/en/tool/" + s.id);
  lines.push("");

  lines.push("```");

}
function downloadText(filename, text){
  const blob = new Blob([text], {type:"text/plain;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* One-click install deeplinks (Cursor + VS Code). Config is base64url/URL
   encoded in the link itself; nothing is sent anywhere. */
function b64url(str){
  try{ return btoa(unescape(encodeURIComponent(str))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
  catch(e){ return ""; }
}
function serverConfigObj(s, envVals){
  const entry = {command:"uvx", args:[s.pypi]};
  if(s.env){
    const env = {};
    Object.keys(s.env).forEach(k=>{ env[k] = (envVals&&envVals[k]) ? envVals[k] : s.env[k]; });
    entry.env = env;
  }
  return entry;
}
function cursorDeeplink(s){
  const cfg = serverConfigObj(s, KEYSTORE.all());
  return "cursor://anysphere.cursor-deeplink/mcp/install?name=" + encodeURIComponent(shortName(s)) + "&config=" + b64url(JSON.stringify(cfg));
}
function vscodeDeeplink(s){
  const cfg = Object.assign({name:shortName(s), type:"stdio"}, serverConfigObj(s, KEYSTORE.all()));
  return "vscode:mcp/install?" + encodeURIComponent(JSON.stringify(cfg));
}

/* Browser-only key store: session cookies / keys the user types stay in
   this browser's localStorage and are only ever pasted into the user's own
   config. Nothing is sent anywhere. */
const KEYSTORE = {
  key:"tmp_keys_v1",
  all(){ return store.get(this.key, {}); },
  get(k){ const v = this.all(); return v[k]||""; },
  set(k, v){ const o = this.all(); if(v) o[k]=v; else delete o[k]; store.set(this.key, o); },
  clear(){ store.set(this.key, {}); }
};
function shellQ(v){
  if(/^[A-Za-z0-9_@%+=:,./-]+$/.test(v)) return v;
  return "'" + String(v).replace(/'/g, "'\"'\"'") + "'";
}

const APP_CONFIG_PATH = {
  "claude-desktop":{mac:"~/Library/Application Support/Claude/claude_desktop_config.json", lin:"~/.config/Claude/claude_desktop_config.json", win:"%APPDATA%\\Claude\\claude_desktop_config.json"},
