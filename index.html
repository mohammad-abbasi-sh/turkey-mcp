<style>
:root{
  --bg:#F6F4EE; --card:#FFFDF8; --elev:#FFFDF8; --text:#1C1917; --muted:#57534E;
  --line:#E3DED2; --line-strong:#D6CFC0;
  --primary:#9C4A26; --primary-2:#B85A32; --primary-ink:#8F4526; --primary-soft:#F7E8DD;
  --on-primary:#FFFFFF;
  --secondary:#00695C; --secondary-soft:#DFF2EE;
  --accent:#B45309; --accent-soft:#FDF3E3;
  --cobalt:#005F73; --cobalt-soft:#E0F0F3;
  --navy:#121110; --danger:#B42318; --ok:#00695C;
  --shadow:0 1px 0 rgba(28,25,23,.06),0 8px 24px rgba(28,25,23,.06);
  --shadow-lg:0 2px 0 rgba(28,25,23,.06),0 18px 44px rgba(28,25,23,.12);
  --radius:10px; --radius-sm:6px;
  --chamfer:polygon(7px 0,calc(100% - 7px) 0,100% 7px,100% calc(100% - 7px),calc(100% - 7px) 100%,7px 100%,0 calc(100% - 7px),0 7px);
  --font-display:"Fraunces",Georgia,"Times New Roman",serif;
  --font-fa:"Vazirmatn",system-ui,Tahoma,sans-serif;
  --font-lat:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
[data-theme="dark"]{
  --bg:#121110; --card:#1C1A18; --elev:#242120; --text:#F6F4EE; --muted:#A8A29E;
  --line:#2E2A26; --line-strong:#3D3833;
  --primary:#E8A87C; --primary-2:#D98A5F; --primary-ink:#E8A87C; --primary-soft:#2E211A;
  --on-primary:#121110;
  --secondary:#4DD0C4; --secondary-soft:#123B38;
  --accent:#FCD34D; --accent-soft:#2E2513;
  --cobalt:#6EC6D8; --cobalt-soft:#122E33;
  --shadow:0 1px 0 rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  --shadow-lg:0 2px 0 rgba(0,0,0,.4),0 18px 44px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{overflow-x:clip}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);line-height:1.75;font-family:var(--font-lat);transition:background .35s ease,color .35s ease}
body::before{content:"";position:fixed;inset:0;z-index:2000;pointer-events:none;opacity:.004;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='0.6'/></svg>")}
[dir="rtl"] body,[lang="fa"] body{font-family:var(--font-fa)}
h1,h2,h3,h4{line-height:1.3;margin:0 0 .5em;font-weight:700;font-family:var(--font-display)}
[dir="rtl"] h1,[dir="rtl"] h2,[dir="rtl"] h3,[dir="rtl"] h4{font-family:var(--font-fa);font-weight:800}
p{margin:0 0 1em}
a{color:var(--primary-ink);text-decoration:none}
a:hover{text-decoration:underline}
img,svg{display:block;max-width:100%}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--text);background:var(--card);border:1px solid var(--line-strong);border-radius:var(--radius-sm);padding:11px 14px;width:100%;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--primary-ink);box-shadow:0 0 0 3px var(--primary-soft)}
label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.88em;background:var(--primary-soft);border-radius:4px;padding:1px 6px;direction:ltr;unicode-bidi:isolate}
pre{background:var(--navy);color:#EDE9E3;border-radius:var(--radius-sm);padding:16px 18px;overflow-x:auto;font-size:13px;line-height:1.7;direction:ltr;text-align:start;margin:0}
pre code{background:none;padding:0;color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px}
.section{padding:56px 0 8px}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:16px}
.section-head h2{font-size:30px;margin:0}
.section-head p{color:var(--muted);margin:6px 0 0;max-width:640px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--primary-ink);margin-bottom:10px}
[dir="ltr"] .eyebrow{text-transform:uppercase;letter-spacing:.09em}
.eyebrow .dot{width:8px;height:8px;background:var(--primary-2);clip-path:var(--chamfer)}
/* ---------- header / nav ---------- */
header.site{position:sticky;top:0;z-index:60;background:var(--bg);border-bottom:1px solid var(--line-strong)}
.nav{display:flex;align-items:center;gap:14px;height:66px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;color:var(--text);text-decoration:none;white-space:nowrap;font-family:var(--font-display)}
[dir="rtl"] .brand{font-family:var(--font-fa)}
.brand:hover{text-decoration:none}
.brand .mark{width:38px;height:38px;background:var(--primary);color:var(--on-primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:21px;clip-path:var(--chamfer);font-family:var(--font-display)}
.brand small{display:block;font-size:11px;font-weight:600;color:var(--muted);line-height:1;font-family:var(--font-lat)}
[dir="rtl"] .brand small{font-family:var(--font-fa)}
nav.main{display:flex;gap:2px;margin-inline-start:8px}
nav.main a{color:var(--muted);font-size:14.5px;font-weight:600;padding:8px 10px;border-radius:var(--radius-sm);text-decoration:none;white-space:nowrap}
nav.main a:hover{color:var(--text);background:var(--primary-soft);text-decoration:none}
nav.main a.active{color:var(--primary-ink);background:var(--primary-soft)}
.nav-right{margin-inline-start:auto;display:flex;align-items:center;gap:8px}
.icon-btn{width:40px;height:40px;border-radius:var(--radius-sm);border:1px solid var(--line-strong);background:var(--card);color:var(--text);display:inline-flex;align-items:center;justify-content:center;font-size:17px}
.icon-btn:hover{border-color:var(--primary-ink)}
.palette-btn{width:auto;padding-inline:10px;font-size:12.5px;font-weight:800;letter-spacing:.04em}
.lang-select{border:1px solid var(--line-strong);background:var(--card);border-radius:var(--radius-sm);padding:0 8px;height:40px;width:auto;font-weight:700;font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--radius-sm);padding:12px 24px;font-size:15px;font-weight:700;border:1px solid transparent;text-decoration:none;transition:background .2s,box-shadow .2s;text-align:center;max-width:100%}
.btn:hover{text-decoration:none}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-primary:hover{background:var(--primary-2)}
[data-theme="dark"] .btn-primary:hover{background:#F0BC9A}
.btn-ghost{background:var(--card);border-color:var(--line-strong);color:var(--text)}
.btn-ghost:hover{border-color:var(--primary-ink)}
.btn-mint{background:var(--secondary);color:#fff}
[data-theme="dark"] .btn-mint{color:#121110}
.btn-sm{padding:9px 16px;font-size:14px}
.btn-block{width:100%}
.burger{display:none}
.mobile-menu{display:none;border-top:1px solid var(--line);padding:12px 20px 18px;background:var(--bg)}
.mobile-menu.open{display:block}
.mobile-menu a{display:block;padding:11px 4px;font-weight:600;color:var(--text);border-bottom:1px solid var(--line)}
.mobile-menu a:last-child{border-bottom:none}
.menu-palette{display:block;width:100%;text-align:start;background:none;border:none;border-bottom:1px solid var(--line);padding:11px 4px;font-weight:600;font-size:15px;color:var(--text)}
/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;padding:60px 0 36px;border-bottom:1px solid var(--line)}
.hero-grid{position:relative;display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:start}
.hero-kicker{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;color:var(--primary-ink);margin:0 0 16px}
[dir="ltr"] .hero-kicker{text-transform:uppercase;letter-spacing:.1em}
.kicker-rule{display:inline-block;width:34px;height:2px;background:var(--primary-2)}
.hero h1{font-size:52px;line-height:1.12}
.hero h1 .accent{color:var(--primary-ink);font-style:italic}
[dir="rtl"] .hero h1 .accent{font-style:normal}
.hero .sub{color:var(--muted);font-size:17.5px;max-width:560px}
.hero-search{display:flex;gap:8px;background:var(--card);border:1px solid var(--line-strong);border-radius:var(--radius-sm);padding:6px;max-width:560px;margin:22px 0 14px}
.hero-search input{border:none;background:transparent;box-shadow:none;padding:8px 10px}
.hero-search input:focus{box-shadow:none}
.hero-search .btn{flex-shrink:0}
.hero-ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
.hero-stats{display:flex;gap:0;margin-top:30px;flex-wrap:wrap;border-top:1px solid var(--line-strong);padding-top:18px}
.hero-stats>div{padding-inline-end:26px;margin-inline-end:26px;border-inline-end:1px solid var(--line)}
.hero-stats>div:last-child{border-inline-end:none;margin-inline-end:0;padding-inline-end:0}
.hero-stats b{display:block;font-size:26px;font-family:var(--font-display);line-height:1.1}
.hero-stats span{color:var(--muted);font-size:13.5px}
.hero-demo{position:relative}
.ebru{position:absolute;inset-block-start:-30px;inset-inline-end:-20px;width:340px;max-width:80%;opacity:.9;pointer-events:none;z-index:0}
.ebru-svg{width:100%;height:auto}
.demo-note{color:var(--muted);font-size:12.5px;margin-top:10px}
/* demo card */
.demo{position:relative;z-index:1;background:#121110;border:1px solid #2E2A26;border-radius:var(--radius);box-shadow:var(--shadow-lg);overflow:auto;color:#EDE9E3}
.demo-tabs{display:flex;gap:6px;padding:12px 14px;border-bottom:1px solid #2E2A26;flex-wrap:wrap}
.demo-tabs button{background:transparent;border:none;color:#A8A29E;border-radius:var(--radius-sm);padding:7px 13px;font-size:13px;font-weight:600}
.demo-tabs button.active{background:#242120;color:#fff}
.demo-body{padding:20px 22px;min-height:250px}
.demo-body .q{font-weight:700;color:#fff;font-size:16px;margin-bottom:12px;min-height:52px}
.demo-body pre{background:#1C1A18;border:1px solid #2E2A26}
.demo-body .fn{color:#4DD0C4}.demo-body .str{color:#E8A87C}.demo-body .arg{color:#D6D3D1}
.demo-body .status{color:#4DD0C4;font-size:13px;font-weight:700;margin:12px 0 4px}
.demo-body .a{color:#D6D3D1;font-size:14px;margin:0 0 12px}
.demo-body .ask{font-size:13px;color:#A8A29E;margin:0}
.demo-body .ask a{color:#E8A87C}
.demo-body .cursor{display:inline-block;width:2px;height:1em;background:#4DD0C4;vertical-align:text-bottom;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.demo-foot{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid #2E2A26;padding:14px 22px}
.demo-foot span{color:#A8A29E;font-size:13px}
.demo-foot .btn{padding:9px 20px;font-size:14px}
/* ---------- monograms (server initials, no emoji tiles) ---------- */
.mono{width:44px;height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;font-family:var(--font-lat);letter-spacing:.02em;color:color-mix(in srgb,var(--mc,#9C4A26) 62%,var(--text));background:color-mix(in srgb,var(--mc,#9C4A26) 16%,var(--card));border:1px solid color-mix(in srgb,var(--mc,#9C4A26) 45%,transparent);clip-path:var(--chamfer)}
.mono-lg{width:64px;height:64px;min-width:64px;font-size:21px}
.mono-sm{width:34px;height:34px;min-width:34px;font-size:12.5px}
/* ---------- ledger (servers) ---------- */
.ledger{border-top:1px solid var(--line-strong)}
.ledger-row{border-bottom:1px solid var(--line);background:transparent;transition:background .15s}
.ledger-row:hover{background:color-mix(in srgb,var(--primary-soft) 55%,transparent)}
.ledger-row.selected{background:var(--primary-soft);box-shadow:inset 3px 0 0 var(--primary-2)}
[dir="rtl"] .ledger-row.selected{box-shadow:inset -3px 0 0 var(--primary-2)}
.row-line{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 10px;cursor:pointer}
.row-line:focus-visible{outline:3px solid var(--primary-ink);outline-offset:-3px}
.row-main{display:flex;flex-direction:column;min-width:0;gap:2px}
.row-name{font-weight:700;font-size:16.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row-sub{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.row-sub .latin{font-size:12.5px}
.row-dot{opacity:.6}
.row-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row-tools{border:1px solid var(--line-strong);background:var(--card);border-radius:var(--radius-sm);padding:8px 12px;font-weight:700;font-size:13.5px;color:var(--text);white-space:nowrap}
.row-tools:hover{border-color:var(--primary-ink)}
.row-tools .chev{color:var(--primary-ink)}
.row-details{font-weight:700;font-size:14px;white-space:nowrap}
.drawer{border-top:1px dashed var(--line-strong);padding:16px 10px 18px;padding-inline-start:76px}
.drawer-desc{color:var(--muted);font-size:14.5px;max-width:760px}
.drawer-tools{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:8px 28px}
.drawer-tools li{display:flex;gap:10px;align-items:baseline;font-size:13.5px}
.drawer-tools li span{color:var(--muted)}
.drawer-tools code{white-space:nowrap;flex-shrink:0}
.result-count{color:var(--muted);font-size:14px;margin-bottom:14px}
.match-head{margin:26px 0 12px}
/* ---------- marketplace layout: rail + ledger + inspector ---------- */
.mp-layout{display:grid;grid-template-columns:230px minmax(0,1fr) 320px;gap:28px;align-items:start}
.filter-rail{position:sticky;top:86px;display:flex;flex-direction:column;gap:16px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);padding:18px}
.rail-block label{font-size:13px;color:var(--muted)}
.rail-note{font-size:13.5px;margin:0;border-top:1px solid var(--line);padding-top:12px}
.ledger-col{min-width:0}
.inspector{position:sticky;top:86px;border:1px solid var(--line-strong);border-radius:var(--radius);background:var(--card);padding:20px;max-height:calc(100vh - 110px);overflow-y:auto}
.insp-kicker{font-size:12px;font-weight:800;color:var(--primary-ink);margin:0 0 14px}
[dir="ltr"] .insp-kicker{text-transform:uppercase;letter-spacing:.09em}
.insp-head{display:flex;gap:14px;align-items:flex-start;margin-bottom:12px}
.insp-head h3{font-size:19px;margin:0}
.insp-head .latin{color:var(--muted);font-size:12.5px;margin:2px 0 0;direction:ltr;text-align:start;overflow-wrap:anywhere}
.insp-badges{margin:0 0 12px;display:flex;gap:6px;flex-wrap:wrap}
.insp-desc{color:var(--muted);font-size:14px}
.inspector h4{font-size:14px;margin:14px 0 8px}
.insp-tools{list-style:none;margin:0 0 14px;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.insp-tools li{font-size:12.5px}
.insp-tools .more{color:var(--muted);font-weight:700;padding:1px 6px}
.insp-install{padding:14px;margin-bottom:14px}
.insp-install h3{font-size:14px}
.insp-actions{display:flex;gap:8px;flex-wrap:wrap}
.inspector-empty{color:var(--muted);font-size:14px}
.sheet-open{display:none}
.sheet,.sheet-backdrop{display:none}
/* ---------- cards / grids (skills, tutorials, blog, about) ---------- */
.grid{display:grid;gap:18px}
.grid>*,.plat-grid>*,.steps>*{min-width:0}
.grid-4{grid-template-columns:repeat(4,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;display:flex;flex-direction:column;transition:box-shadow .2s,border-color .2s}
.card:hover{border-color:var(--line-strong);box-shadow:var(--shadow)}
.card h3{font-size:17.5px;margin:0}
.card .desc{color:var(--muted);font-size:14px;margin:8px 0 14px;flex:1}
.tile{width:48px;height:48px;min-width:48px;display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:800;color:var(--on-primary);background:var(--primary);clip-path:var(--chamfer)}
.card-top{display:flex;gap:12px;align-items:flex-start}
.card-top .latin{color:var(--muted);font-size:12.5px;margin:2px 0 0;direction:ltr;text-align:start;overflow-wrap:anywhere}
.meta-row{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);margin:0 0 4px}
.meta-row .ic{font-size:14px}
.card-bottom{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}
.card-bottom .count{color:var(--muted);font-size:13px}
.card-bottom .btn{margin-inline-start:auto}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:4px 11px;clip-path:var(--chamfer)}
.badge-feat{background:var(--accent-soft);color:#8A5200}
[data-theme="dark"] .badge-feat{color:var(--accent)}
.badge-ok{background:var(--secondary-soft);color:#0B6B5E}
[data-theme="dark"] .badge-ok{color:var(--secondary)}
.badge-soon{background:var(--primary-soft);color:var(--primary-ink)}
.badge-acct{background:#FDF3E3;color:#92400E}
[data-theme="dark"] .badge-acct{background:#3A2E12;color:#FCD34D}
.badge-verified{background:var(--secondary-soft);color:#0B6B5E}
[data-theme="dark"] .badge-verified{color:var(--secondary)}
.badge-unverified{background:#FDECEC;color:#B42318}
[data-theme="dark"] .badge-unverified{background:#3A1D1D;color:#FF9A94}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--primary-soft);color:var(--primary-ink);border-radius:var(--radius-sm);padding:5px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.chip.mint{background:var(--secondary-soft);color:#0B6B5E}
[data-theme="dark"] .chip.mint{color:var(--secondary)}
.star-btn{border:1px solid var(--line-strong);background:var(--card);border-radius:var(--radius-sm);width:36px;height:36px;font-size:17px;color:var(--muted);display:inline-flex;align-items:center;justify-content:center}
.star-btn.on{color:#B45309;border-color:#B45309;background:var(--accent-soft)}
/* category cards */
.cat-card{cursor:pointer;text-align:start}
.cat-code{width:52px;height:52px;display:inline-flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;font-family:var(--font-lat);letter-spacing:.04em;color:color-mix(in srgb,var(--mc,#9C4A26) 62%,var(--text));background:color-mix(in srgb,var(--mc,#9C4A26) 16%,var(--card));border:1px solid color-mix(in srgb,var(--mc,#9C4A26) 45%,transparent);clip-path:var(--chamfer);margin-bottom:14px}
.cat-card h3{font-size:17px}
.cat-card p{color:var(--muted);font-size:13.5px;margin:6px 0 12px;flex:1}
/* platforms */
.plat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.plat-card{text-align:center;align-items:center;padding:28px 18px}
.plat-card .logo{width:60px;height:60px;background:var(--primary-soft);color:var(--primary-ink);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;margin-bottom:12px;clip-path:var(--chamfer)}
.plat-card h3{font-size:17px}
.plat-card p{color:var(--muted);font-size:13.5px;flex:1}
/* how it works */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.step{position:relative}
.step .n{width:44px;height:44px;background:var(--primary);color:var(--on-primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;margin-bottom:14px;clip-path:var(--chamfer);font-family:var(--font-display)}
.step h3{font-size:18px}
.step p{color:var(--muted);font-size:14.5px}
/* toolbar: search + filters */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.toolbar .search-box{flex:1;min-width:220px;position:relative}
.toolbar .search-box input{padding-inline-start:40px}
.toolbar .search-box .mag,.search-box .mag{position:absolute;inset-inline-start:13px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search-box{position:relative}
.search-box input{padding-inline-start:40px}
.toolbar select{width:auto;min-width:160px}
.empty{text-align:center;padding:56px 20px;background:var(--card);border:1px dashed var(--line-strong);border-radius:var(--radius)}
.empty .big{font-size:44px;margin-bottom:8px;color:var(--primary-ink);font-family:var(--font-display)}
.empty h3{font-size:19px}
.empty p{color:var(--muted)}
.nf-num{font-size:72px;font-family:var(--font-display);color:var(--primary-ink);line-height:1;margin-bottom:8px}
/* tool detail */
.detail-head{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;margin-bottom:8px}
.detail-head h1{font-size:30px;margin:0}
.detail-head .latin{color:var(--muted);direction:ltr;text-align:start}
.table-scroll{overflow-x:auto}
.tools-table{width:100%;border-collapse:collapse;font-size:14px}
.tools-table th,.tools-table td{text-align:start;padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tools-table th{color:var(--muted);font-size:13px}
.tools-table code{white-space:nowrap}
.install-box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-bottom:18px}
.install-box h3{font-size:16px;margin-bottom:10px}
.copy-row{display:flex;gap:8px;align-items:stretch}
.copy-row>*{min-width:0}
.copy-row pre{flex:1;margin:0}
.copy-btn{position:relative;overflow:hidden;border:1px solid var(--line-strong);background:var(--elev);border-radius:var(--radius-sm);padding:0 16px;font-weight:700;color:var(--text);white-space:nowrap}
.copy-btn:hover{border-color:var(--primary-ink)}
.copy-btn.copied{background:var(--secondary-soft);border-color:var(--secondary);color:var(--secondary)}
.copy-btn.copied::after{content:"";position:absolute;inset:0;border:2px solid var(--secondary);border-radius:inherit;animation:ripple .6s ease-out}
@keyframes ripple{from{opacity:.9;transform:scale(.92)}to{opacity:0;transform:scale(1.12)}}
.copied-flash{animation:flash .7s ease-out}
@keyframes flash{0%{background:var(--secondary-soft)}100%{background:transparent}}
/* forms */
.form-card{max-width:480px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:32px}
.form-card h1{font-size:24px;text-align:center}
.form-card .sub{text-align:center;color:var(--muted);font-size:14.5px}
.field{margin-bottom:16px}
.field .err{color:var(--danger);font-size:13px;margin-top:5px;display:none}
.field.invalid input,.field.invalid textarea{border-color:var(--danger)}
.field.invalid .err{display:block}
.alert{border-radius:var(--radius-sm);padding:12px 16px;font-size:14px;margin-bottom:16px}
.alert-ok{background:var(--secondary-soft);color:#0B6B5E}
[data-theme="dark"] .alert-ok{color:var(--secondary)}
.alert-err{background:#FDECEC;color:#B42318}
[data-theme="dark"] .alert-err{background:#3A1D1D;color:#FF9A94}
.alert-info{background:var(--primary-soft);color:var(--primary-ink)}
.note{font-size:13px;color:var(--muted);background:var(--primary-soft);border-radius:var(--radius-sm);padding:12px 14px;margin-top:16px}
/* blog / tutorial */
.article-body{max-width:760px}
.article-body h2{font-size:22px;margin:28px 0 10px}
.article-body p{color:var(--muted);font-size:16px}
.article-body ol,.article-body ul{color:var(--muted);font-size:16px;line-height:1.9}
.post-meta{display:flex;gap:14px;color:var(--muted);font-size:13.5px;flex-wrap:wrap;margin-bottom:18px}
.cover{height:180px;border-radius:16px 16px 0 0;margin:-22px -22px 18px;display:flex;align-items:center;justify-content:center;font-size:52px;font-family:var(--font-display);font-weight:700;color:#fff}
.cover.g1{background:#9C4A26}
.cover.g2{background:#00695C}
.cover.g3{background:#B45309}
.cover.g4{background:#005F73}
.cover.g5{background:#44403C}
/* dashboard */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:26px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.stat b{font-size:28px;display:block;font-family:var(--font-display)}
.stat span{color:var(--muted);font-size:13.5px}
/* footer */
footer.site{margin-top:90px;border-top:1px solid var(--line-strong);background:var(--card)}
.foot-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:32px;padding:56px 0 32px}
.foot-grid h4{font-size:15px;margin:0 0 14px}
.foot-grid a{display:block;color:var(--muted);font-size:14px;margin-bottom:9px}
.foot-grid p{color:var(--muted);font-size:14px}
.foot-bottom{border-top:1px solid var(--line);padding:18px 0;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.socials{display:flex;gap:8px;margin-top:14px}
.socials a{width:38px;height:38px;border-radius:var(--radius-sm);border:1px solid var(--line-strong);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:16px}
.socials a:hover{color:var(--primary-ink);border-color:var(--primary-ink);text-decoration:none}
/* toast (favorites only — copy feedback is the button flip) */
#toast{position:fixed;bottom:22px;inset-inline-start:50%;transform:translateX(-50%);background:var(--navy);color:#F6F4EE;padding:12px 22px;border-radius:var(--radius-sm);font-size:14px;font-weight:600;max-width:calc(100vw - 40px);text-align:center;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:opacity .25s;z-index:100}
#toast.show{opacity:1}
.skip{position:absolute;inset-inline-start:-9999px}
.skip:focus{position:fixed;inset-inline-start:16px;top:16px;z-index:200;background:var(--primary);color:var(--on-primary);padding:10px 18px;border-radius:var(--radius-sm)}
:focus-visible{outline:3px solid var(--primary-ink);outline-offset:2px;border-radius:4px}
/* ---------- connect rocker (physical switch, Simple default) ---------- */
.rocker{margin:18px 0 26px;max-width:720px}
.rocker-track{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--card);border:1px solid var(--line-strong);border-radius:var(--radius);padding:4px;box-shadow:inset 0 2px 6px rgba(28,25,23,.08)}
.rocker-thumb{position:absolute;top:4px;bottom:4px;width:calc(50% - 4px);inset-inline-start:4px;background:var(--primary);border-radius:var(--radius-sm);transition:inset-inline-start .25s ease;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;box-shadow:0 2px 8px rgba(28,25,23,.25)}
.rocker[data-track="tech"] .rocker-thumb{inset-inline-start:calc(50%)}
.rocker-thumb .grip{display:block;width:22px;height:2px;background:var(--on-primary);opacity:.55;box-shadow:0 -6px 0 var(--on-primary),0 6px 0 var(--on-primary)}
.rocker-opt{position:relative;z-index:1;background:transparent;border:none;padding:14px 12px;text-align:center;color:var(--muted);border-radius:var(--radius-sm)}
.rocker-opt.active{color:var(--on-primary)}
.rocker-tag{display:block;font-size:11.5px;font-weight:700;opacity:.85;margin-bottom:2px}
[dir="ltr"] .rocker-tag{text-transform:uppercase;letter-spacing:.07em}
.rocker-label{display:block;font-size:16px;font-weight:800}
.rocker-desc{color:var(--muted);font-size:14.5px;margin:12px 0 0;text-align:center}
/* connect steps */
.big-steps{list-style:none;padding:0;margin:0 0 26px;counter-reset:bigstep}
.big-steps>li{counter-increment:bigstep;position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;padding-inline-start:76px;margin-bottom:16px}
.big-steps>li::before{content:counter(bigstep);position:absolute;inset-inline-start:22px;top:20px;width:40px;height:40px;background:var(--primary);color:var(--on-primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;clip-path:var(--chamfer);font-family:var(--font-display)}
.big-steps h3{font-size:17px;margin:0 0 8px}
.big-steps p{color:var(--muted);font-size:14.5px}
.big-steps p:last-child{margin-bottom:0}
.callout{background:var(--accent-soft);border:1px solid #F5D9A8;border-radius:var(--radius);padding:16px 18px;font-size:14.5px;margin:0 0 22px}
[data-theme="dark"] .callout{border-color:#5C4520}
.paths{width:100%;border-collapse:collapse;font-size:14px;margin:10px 0 4px;display:block;overflow-x:auto}
.paths th,.paths td{text-align:start;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.paths th{color:var(--muted);font-size:13px}
.paths code{white-space:nowrap}
.os-block{margin:12px 0}
.os-block h4{font-size:14.5px;margin:0 0 6px}
/* ---------- command palette ---------- */
.palette{position:fixed;inset:0;z-index:300;display:none}
.palette.open{display:block}
.palette-backdrop{position:absolute;inset:0;background:rgba(18,17,16,.55)}
.palette-panel{position:relative;max-width:620px;margin:12vh auto 0;background:var(--card);border:1px solid var(--line-strong);border-radius:var(--radius);box-shadow:var(--shadow-lg);overflow:hidden;margin-inline:16px}
@media (min-width:652px){.palette-panel{margin-inline:auto}}
.palette-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.palette-head .mag{color:var(--muted);font-size:18px}
.palette-head input{border:none;background:transparent;box-shadow:none;padding:4px 0;font-size:16px;flex:1;min-width:0}
.palette-head input:focus{box-shadow:none}
#palette-results{max-height:52vh;overflow-y:auto;padding:8px}
.pal-group{font-size:12px;font-weight:800;color:var(--primary-ink);margin:10px 10px 6px}
[dir="ltr"] .pal-group{text-transform:uppercase;letter-spacing:.08em}
.pal-row{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:transparent;border:none;border-radius:var(--radius-sm);padding:10px;color:var(--text)}
.pal-row.sel{background:var(--primary-soft)}
.pal-main{display:flex;flex-direction:column;min-width:0;flex:1}
.pal-name{font-weight:700;font-size:15px}
.pal-sub{color:var(--muted);font-size:12.5px}
.pal-jump{color:var(--muted);font-size:14px}
.pal-empty{color:var(--muted);font-size:14px;padding:18px 10px;text-align:center}
.palette-hint{color:var(--muted);font-size:12.5px;margin:0;padding:10px 16px;border-top:1px solid var(--line);text-align:center}
/* ---------- paper-unfold entrance ---------- */
.unfold{opacity:0;transform:perspective(900px) rotateX(8deg) translateY(10px);transform-origin:top center}
.unfold.in{opacity:1;transform:none;transition:opacity .5s ease,transform .5s ease}
/* ---------- responsive ---------- */
@media (max-width:1280px){
  nav.main{display:none}
  .burger{display:inline-flex}
  .mp-layout{grid-template-columns:230px minmax(0,1fr)}
  .inspector{display:none}
}
@media (max-width:1020px){
  .hero-grid{grid-template-columns:1fr;gap:36px}
  .hero h1{font-size:40px}
  .grid-4{grid-template-columns:repeat(2,1fr)}
  .grid-3{grid-template-columns:repeat(2,1fr)}
  .plat-grid{grid-template-columns:repeat(2,1fr)}
  .steps{grid-template-columns:1fr}
  .foot-grid{grid-template-columns:1fr 1fr}
  .stat-grid{grid-template-columns:1fr}
  .mp-layout{grid-template-columns:minmax(0,1fr)}
  .filter-rail{display:none}
  .sheet-open{display:inline-flex;margin-bottom:16px}
  .sheet{display:block;position:fixed;inset-inline:0;bottom:0;z-index:250;background:var(--card);border-top:1px solid var(--line-strong);border-radius:16px 16px 0 0;padding:16px 20px 24px;transform:translateY(105%);transition:transform .3s ease;max-height:82vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
  .sheet.open{transform:translateY(0)}
  .sheet-backdrop{display:block;position:fixed;inset:0;z-index:240;background:rgba(18,17,16,.45);opacity:0;pointer-events:none;transition:opacity .3s}
  .sheet-backdrop.open{opacity:1;pointer-events:auto}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .sheet .rail-block{margin-bottom:12px}
  .drawer{padding-inline-start:16px}
  .drawer-tools{grid-template-columns:1fr}
}
@media (max-width:600px){
  .section{padding:44px 0 4px}
  .hero{padding:36px 0 24px}
  .hero h1{font-size:32px}
  .section-head h2{font-size:24px}
  .grid-4,.grid-3,.grid-2,.plat-grid{grid-template-columns:1fr}
  .foot-grid{grid-template-columns:1fr}
  .hero-search{flex-direction:column;border-radius:var(--radius);padding:10px}
  .hero-search .btn{width:100%}
  .brand{font-size:16px;gap:8px}
  .brand .mark{width:34px;height:34px}
  .brand small{display:none}
  .nav-right{gap:6px}
  .icon-btn{width:44px;height:44px;font-size:17px}
  .palette-btn{display:none}
  .lang-select{padding:0 4px;font-size:12px}
  .fav-btn{display:none}
  .nav{gap:8px}
  .detail-head h1{font-size:24px}
  .copy-row{flex-direction:column}
  .copy-row .copy-btn{padding:11px 16px}
  .big-steps>li{padding:64px 18px 18px}
  .big-steps>li::before{top:14px;inset-inline-start:18px;width:36px;height:36px;font-size:16px}
  .row-line{grid-template-columns:44px minmax(0,1fr);gap:10px}
  .row-actions{grid-column:1/-1}
  .row-tools,.row-copy{padding:8px 10px;font-size:13px}
  .ebru{width:240px;inset-block-start:-10px}
  .palette-panel{margin-top:8vh}
  .rocker-label{font-size:14.5px}
  .demo-body{min-height:220px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;scroll-behavior:auto !important}
  .unfold{opacity:1;transform:none}
  .demo-body .cursor{animation:none}
}

const ARTICLES = [
 {id:"what-is-mcp",cat:"basics",date:"2026-11-05",mins:6,cover:"g1",icon:"🔌",
  title:{fa:"MCP چیست؟ به زبان ساده",tr:"MCP nedir? Sade bir dille",en:"What is MCP, in plain language"},
  ex:{fa:"پروتکل اتصال هوش مصنوعی به دنیای واقعی — بدون اصطلاحات پیچیده، با مثال‌های واقعی.",tr:"Yapay zekâyı gerçek dünyaya bağlayan protokol — karmaşık terimler olmadan, gerçek örneklerle.",en:"The protocol that connects AI to the real world — no jargon, with real examples."},
  body:{fa:["مدل‌های هوش مصنوعی متن می‌نویسند، اما به‌تنهایی به دنیای بیرون دسترسی ندارند: نمی‌دانند قیمت دلار امروز چقدر است، در فروشگاه چه کالایی موجود است یا فردا چه اتوبوسی از استانبول به آنکارا می‌رود. MCP یا «پروتکل زمینهٔ مدل» (Model Context Protocol) یک قرارداد استاندارد است که به دستیار هوش مصنوعی اجازه می‌دهد با ابزارهای بیرونی صحبت کند.","به زبان ساده: MCP یک «پریز استاندارد» است. هر سرویس — فروشگاه، سایت آگهی، بانک مرکزی — یک «دوشاخه» می‌سازد و دستیار شما می‌تواند آن را وصل کند و سؤال شما را به یک فراخوانی ابزار تبدیل کند. بدون MCP، هر اتصال یک کار سفارشی و یک‌باره بود؛ با MCP، یک بار وصل می‌شوی و همه‌جا کار می‌کند.","سرورهای این کاتالوگ دقیقاً همین کار را می‌کنند: هر کدام یک سرویس ترکیه را — مثلاً Hepsiburada یا obilet — به دستیار شما وصل می‌کنند. همه فقط‌خواندنی‌اند: داده می‌خوانند، اما هرگز وارد حساب شما نمی‌شوند، خرید نمی‌کنند و چیزی را تغییر نمی‌دهند.","برای شروع، کافی است یک سرور را با uvx نصب کنی و آن را به Claude Code یا Cursor وصل کنی. از آن لحظه، به‌جای باز کردن ده تب مرورگر، از دستیارت می‌پرسی — و جواب را با عدد و منبع می‌گیری."],
         tr:["Yapay zekâ modelleri metin yazar, ancak tek başlarına dış dünyaya erişemezler: bugünkü dolar kurunu, mağazada hangi ürünün stokta olduğunu veya yarın İstanbul'dan Ankara'ya hangi otobüsün gittiğini bilemezler. MCP (Model Context Protocol — Model Bağlam Protokolü), yapay zekâ asistanının dış araçlarla konuşmasını sağlayan standart bir sözleşmedir.","Basitçe söylemek gerekirse MCP standart bir “priz”dir. Her hizmet — mağaza, ilan sitesi, merkez bankası — bir “fiş” yapar ve asistanınız onu takıp sorunuzu bir araç çağrısına dönüştürebilir. MCP olmadan her bağlantı özel ve tek seferlik bir işti; MCP ile bir kez bağlanırsınız ve her yerde çalışır.","Bu katalogdaki sunucular tam olarak bunu yapar: her biri bir Türkiye servisini — örneğin Hepsiburada veya obilet — asistanınıza bağlar. Hepsi salt okunurdur: veri okurlar ama asla hesabınıza girmez, satın alma yapmaz ve hiçbir şeyi değiştirmezler.","Başlamak için bir sunucuyu uvx ile kurup Claude Code veya Cursor'a bağlamanız yeterlidir. O andan itibaren on sekme açmak yerine asistanınıza sorarsınız — ve yanıtı sayı ve kaynakla alırsınız."],
         en:["AI models write text, but on their own they cannot reach the outside world: they don't know today's dollar rate, which products are in stock, or which bus leaves Istanbul for Ankara tomorrow. MCP — the Model Context Protocol — is a standard contract that lets an AI assistant talk to outside tools.","Simply put, MCP is a standard “socket”. Every service — a shop, a listings site, a central bank — builds a “plug”, and your assistant can connect it and turn your question into a tool call. Without MCP, every connection was a custom one-off job; with MCP, you connect once and it works everywhere.","The servers in this catalog do exactly that: each one connects a Turkish service — Hepsiburada or obilet, for example — to your assistant. All of them are read-only: they read data but never log in to your account, never buy anything and never change anything.","To start, just install a server with uvx and connect it to Claude Code or Cursor. From then on, instead of opening ten browser tabs, you ask your assistant — and get the answer with numbers and a source."]}},
 {id:"choose-client",cat:"guides",date:"2026-11-04",mins:5,cover:"g2",icon:"🧭",
  title:{fa:"کدام کلاینت MCP برای شما مناسب است؟",tr:"Hangi MCP istemcisi size uygun?",en:"Which MCP client is right for you?"},
  ex:{fa:"Claude Code، Cursor، Claude Desktop یا VS Code — انتخاب درست به روش کارت بستگی دارد.",tr:"Claude Code, Cursor, Claude Desktop veya VS Code — doğru seçim çalışma şeklinize bağlıdır.",en:"Claude Code, Cursor, Claude Desktop or VS Code — the right choice depends on how you work."},
  body:{fa:["اگر بیشتر در ترمینال کار می‌کنی، Claude Code سریع‌ترین راه است: یک دستور، و سرور وصل است. برای کسانی که با خط فرمان راحت‌اند، هیچ راه ساده‌تری نیست.","اگر برنامه‌نویس هستی و در ویرایشگر کد زندگی می‌کنی، Cursor یا VS Code انتخاب طبیعی است؛ سرور در کنار کدت قرار می‌گیرد و می‌توانی از دستیار بخواهی هم‌زمان کد و دادهٔ واقعی را ببیند.","اگر فقط می‌خواهی گفت‌وگو کنی و سؤال بپرسی، Claude Desktop ساده‌ترین گزینه است: یک بار فایل پیکربندی را ویرایش می‌کنی و بعد همه‌چیز در چت است.","یک نکتهٔ مهم: سرورهای محلی (stdio) فقط روی کامپیوتر خودت اجرا می‌شوند. نسخهٔ وب ChatGPT و Gemini فعلاً با این سرورها تأیید نشده‌اند — پس اگر از نسخهٔ وب استفاده می‌کنی، سراغ کلاینت‌های دسکتاپ یا خط فرمان برو."],
         tr:["Çoğunlukla terminalde çalışıyorsanız Claude Code en hızlı yoldur: tek komut ve sunucu bağlanır. Komut satırıyla rahat olanlar için daha kolayı yoktur.","Programcıysanız ve kod düzenleyicide yaşıyorsanız Cursor veya VS Code doğal seçimdir; sunucu kodunuzun yanında durur ve asistandan kodu ve gerçek veriyi aynı anda görmesini isteyebilirsiniz.","Yalnızca sohbet etmek ve soru sormak istiyorsanız Claude Desktop en basit seçenektir: yapılandırma dosyasını bir kez düzenlersiniz, sonrası sohbettedir.","Önemli bir not: yerel (stdio) sunucular yalnızca kendi bilgisayarınızda çalışır. ChatGPT ve Gemini'nin web sürümleri bu sunucularla henüz doğrulanmadı — web sürümü kullanıyorsanız masaüstü veya komut satırı istemcilerini tercih edin."],
         en:["If you mostly live in the terminal, Claude Code is the fastest path: one command and the server is connected. For anyone comfortable with the command line, there is nothing simpler.","If you are a programmer who lives in a code editor, Cursor or VS Code is the natural choice; the server sits next to your code and you can ask the assistant to see code and real data at the same time.","If you only want to chat and ask questions, Claude Desktop is the simplest option: you edit the config file once, and afterwards everything happens in the chat.","One important note: local (stdio) servers run only on your own computer. The web versions of ChatGPT and Gemini are not yet verified with these servers — so if you use the web version, pick a desktop or command-line client instead."]}},
 {id:"turkey-servers",cat:"guides",date:"2026-11-03",mins:7,cover:"g3",icon:"🇹🇷",
  title:{fa:"سرورهای ترکیه چطور کار می‌کنند؟",tr:"Türkiye sunucuları nasıl çalışır?",en:"How do the Turkey servers work?"},
  ex:{fa:"پشت صحنهٔ سرورهای فقط‌خواندنی: از کجا داده می‌خوانند، چه چیزی را نمی‌توانند انجام دهند و چرا امن‌اند.",tr:"Salt okunur sunucuların perde arkası: veriyi nereden okurlar, neyi yapamazlar ve neden güvenlidirler.",en:"Behind the scenes of the read-only servers: where they read data, what they cannot do, and why they are safe."},
  body:{fa:["هر سرور این کاتالوگ یک برنامهٔ کوچک پایتون است که با uvx اجرا می‌شود. وقتی دستیارت سؤالی می‌پرسد — مثلاً «ارزان‌ترین هدفون بی‌سیم چنده؟» — سرور به سایت مربوطه سر می‌زند، صفحه را می‌خواند و جواب ساخت‌یافته برمی‌گرداند.","داده‌ها همیشه زنده‌اند: نرخ ارز از XML رسمی بانک مرکزی ترکیه خوانده می‌شود، قیمت کالا از صفحهٔ فروشگاه، و ساعت اتوبوس از obilet. هیچ پایگاه دادهٔ قدیمی و هیچ عدد حدسی در میان نیست.","مهم‌ترین اصل طراحی این سرورها «فقط‌خواندنی» بودن است. آن‌ها هیچ حساب کاربری، رمز عبور یا توکنی ندارند؛ نمی‌توانند وارد حسابت شوی، خرید کنند یا رزرو انجام دهند. یک استثنا: hepsiburada-mcp اقدامات حساب اختیاری (سبد خرید و علاقه‌مندی‌ها) ارائه می‌دهد که فقط وقتی کار می‌کنند که کوکی نشست مرورگر خودت را به پیکربندی آن اضافه کنی — بدون آن، مثل بقیه فقط‌خواندنی می‌ماند. بدترین کاری که یک سرور خراب می‌تواند بکند، برگرداندن یک جواب اشتباه است — و تو همیشه می‌توانی آن را با باز کردن سایت بررسی کنی.","همهٔ سرورها متن‌باز‌اند و کدشان در گیت‌هاب است. اگر کنجکاوی، می‌توانی دقیقاً ببینی هر ابزار چه درخواستی می‌فرستد و چه چیزی برمی‌گرداند. شفافیت، به‌جای اعتماد کورکورانه، اصل این پروژه است."],
         tr:["Bu katalogdaki her sunucu uvx ile çalışan küçük bir Python programıdır. Asistanınız bir soru sorduğunda — örneğin “en ucuz kablosuz kulaklık ne kadar?” — sunucu ilgili siteye gider, sayfayı okur ve yapılandırılmış bir yanıt döndürür.","Veriler her zaman canlıdır: döviz kuru Türkiye Cumhuriyet Merkez Bankası'nın resmi XML'inden, ürün fiyatı mağaza sayfasından, otobüs saati obilet'ten okunur. Eski bir veritabanı ve tahminî sayı yoktur.","Bu sunucuların en önemli tasarım ilkesi “salt okunur” olmalarıdır. Hiçbir kullanıcı hesabı, şifre veya jetonları yoktur; hesabınıza giremez, satın alma yapamaz veya rezervasyon yapamazlar. Tek istisna: hepsiburada-mcp, kendi tarayıcı oturum çerezinizi yapılandırmasına eklediğinizde çalışan isteğe bağlı hesap işlemleri (sepet + favoriler) sunar — olmadan diğerleri gibi salt okunur kalır. Bozuk bir sunucunun yapabileceği en kötü şey yanlış bir yanıt döndürmektir — ve bunu siteyi açarak her zaman doğrulayabilirsiniz.","Tüm sunucular açık kaynaklıdır ve kodları GitHub'dadır. Merak ediyorsanız her aracın tam olarak hangi isteği gönderdiğini ve ne döndürdüğünü görebilirsiniz. Kör güven yerine şeffaflık bu projenin ilkesidir."],
         en:["Each server in this catalog is a small Python program that runs with uvx. When your assistant asks a question — “what is the cheapest wireless earphone?” — the server visits the relevant site, reads the page and returns a structured answer.","The data is always live: exchange rates come from the Central Bank of Türkiye's official XML, product prices from the shop page, and bus times from obilet. There is no stale database and no guessed numbers.","The most important design principle of these servers is that they are read-only. They have no user account, no password and no token; they cannot log in to your account, buy anything or make a reservation. One exception: hepsiburada-mcp offers optional account actions (cart + favorites) that work only when you add your own browser session cookie to its config — without it, it stays read-only like the rest. The worst thing a broken server can do is return a wrong answer — and you can always check it by opening the site.","All servers are open source and their code is on GitHub. If you are curious, you can see exactly what request each tool sends and what it returns. Transparency, instead of blind trust, is this project's principle."]}}
];

 conn_track_simple_tag:"پیشنهاد ما",
 conn_track_simple_t:"شروع ساده",
 conn_track_simple_d:"بدون دانش فنی — با برنامهٔ Claude Desktop، قدم‌به‌قدم.",
 conn_track_tech_tag:"دستورها و تنظیمات",
 conn_track_tech_t:"راهنمای فنی",
 conn_track_tech_d:"برای برنامه‌نویس‌ها — همهٔ برنامه‌ها، دستورها و تنظیمات.",
 conn_simple_what_t:"MCP یعنی چه؟",
 conn_simple_what_d:"«MCP» یک راه استاندارد برای وصل کردن دستیار هوش مصنوعی به سرویس‌های واقعی است — مثل یک پریز برق استاندارد: هر سرویس یک «دوشاخه» دارد و دستیار شما آن را وصل می‌کند. بعد از اتصال، به‌جای باز کردن ده تب مرورگر، از دستیارت می‌پرسی — مثلاً «نرخ دلار امروز چنده؟» — و جواب را با عدد و منبع می‌گیری. همهٔ سرورهای این کاتالوگ فقط اطلاعات عمومی سایت‌ها را می‌خوانند؛ چیزی نمی‌خرند و وارد هیچ حسابی نمی‌شوند.",
 conn_simple_note_web:"یک نکتهٔ مهم: این سرورها روی کامپیوتر خودت اجرا می‌شوند و فقط با برنامه‌های دسکتاپ (مثل Claude Desktop) کار می‌کنند — داخل سایت claude.ai یا ChatGPT در مرورگر کار نمی‌کنند.",
 conn_simple_steps_t:"قدم‌به‌قدم: اتصال با Claude Desktop",
 conn_simple_s1_t:"برنامهٔ Claude Desktop را دانلود و نصب کن",
 conn_simple_s1_d:"از صفحهٔ دانلود رسمی Claude، نسخهٔ ویندوز یا مک را بگیر و مثل هر برنامهٔ دیگری نصبش کن. (برای ویندوز و مک منتشر شده؛ برای لینوکس برنامهٔ رسمی نیست — کاربران لینوکس از راهنمای فنی و Claude Code استفاده کنند.)",
 conn_simple_s1_btn:"دانلود Claude Desktop",
 conn_simple_s2_t:"ابزار کوچک «uvx» را نصب کن",
 conn_simple_s2_d:"سرورها با یک ابزار کوچک و رایگان به اسم uvx اجرا می‌شوند. اول باید آن را نصب کنی — یک بار، برای همیشه. ترمینال (خط فرمان) را باز کن، دستور مخصوص سیستم خودت را بچسبان (Paste) و Enter بزن:",
 conn_simple_s2_win:"ویندوز: کلید ویندوز را بزن، «PowerShell» را بنویس و بازش کن؛ بعد این دستور را بچسبان:",
 conn_simple_s2_mac:"مک: کلیدهای Cmd + Space را بزن، «Terminal» را بنویس و بازش کن؛ بعد این دستور را بچسبان:",
 conn_simple_s2_lin:"لینوکس: کلیدهای Ctrl + Alt + T را بزن تا ترمینال باز شود؛ بعد این دستور را بچسبان:",
 conn_simple_s2_check:"برای اینکه مطمئن شوی نصب شده، همین را در ترمینال بنویس و Enter بزن: «uvx --version» — اگر یک شمارهٔ نسخه دیدی، یعنی آماده‌ای.",
 conn_simple_s3_t:"فایل تنظیمات را باز کن",
 conn_simple_s3_d:"ساده‌ترین راه: خود برنامهٔ Claude Desktop را باز کن و برو به «Settings ← Developer ← Edit Config». فایل تنظیمات باز می‌شود. اگر خواستی دستی پیداش کنی، اینجاها زندگی می‌کند:",
 conn_simple_s3_os:"سیستم‌عامل",
 conn_simple_s3_win:"ویندوز",
 conn_simple_s3_mac:"مک",
 conn_simple_s3_lin:"لینوکس (ساخت‌های غیررسمی)",
 conn_simple_s4_t:"این متن را داخل فایل بچسبان",
 conn_simple_s4_d:"سرورت را انتخاب کن، دکمهٔ «کپی» را بزن، و متن را داخل فایل تنظیمات بچسبان. اگر فایل خالی است، کل متن را بچسبان؛ اگر از قبل چیزی داخلش هست، فقط بخش داخل «mcpServers» را اضافه کن. بعد فایل را ذخیره کن (Ctrl + S در ویندوز و لینوکس، Cmd + S در مک).",
 conn_simple_server:"سرور:",
 conn_simple_s5_t:"برنامه را کامل ببند و دوباره باز کن",
 conn_simple_s5_d:"بستن پنجره کافی نیست: در ویندوز روی آیکون Claude در نوار وظیفه راست‌کلیک کن و «Quit» را بزن؛ در مک کلیدهای Cmd + Q را بزن. بعد برنامه را دوباره باز کن.",
 conn_simple_s6_t:"امتحانش کن: یک سؤال بپرس",
 conn_simple_s6_d:"در یک گفت‌وگوی تازه این سؤال را بپرس. اگر جواب با عدد برگشت، اتصال برقرار است.",
 conn_simple_s6_q:"«نرخ دلار به لیر امروز چنده؟»",
 conn_simple_s6_q_generic:"سؤالی بپرس که این سرور جوابش را می‌داند — صفحهٔ سرور می‌گوید چه چیزی را می‌تواند جواب بدهد.",
 conn_simple_tb_t:"مشکلی پیش آمد؟",
 conn_simple_tb1_t:"برنامه سرور را نمی‌بیند",
 conn_simple_tb1_d:"برنامه را کامل ببند و دوباره باز کن (قدم ۵) — بستن پنجره کافی نیست. اگر هنوز ندید، مطمئن شو فایل را ذخیره کرده‌ای.",
 conn_simple_tb2_t:"خطای JSON یا «فایل خراب است»",
 conn_simple_tb2_d:"فایل تنظیمات باید دقیق و بدون اشتباه تایپی باشد. ساده‌ترین راه: همهٔ متن فایل را پاک کن و دوباره از دکمهٔ «کپی» در قدم ۴ بچسبان. مواظب باش ویرگول یا آکولاد اضافه نماند.",
 conn_simple_tb3_t:"«uvx پیدا نشد» یا سرور اجرا نمی‌شود",
 conn_simple_tb3_d:"یعنی ابزار uvx نصب نشده. قدم ۲ را دوباره انجام بده و بعد ترمینال و برنامهٔ Claude Desktop را ببند و دوباره باز کن. با دستور «uvx --version» بررسی کن که نصب شده باشد.",
 conn_simple_next:"بعد از اولین اتصال موفق، سرورهای دیگر را هم می‌توانی به همین روش اضافه کنی — صفحهٔ هر سرور، متن آمادهٔ خودش را دارد.",
 conn_simple_to_tech:"با برنامهٔ دیگری وصل می‌شوی؟ راهنمای فنی",
 conn_tech_intro:"اگر با ترمینال و فایل‌های تنظیمات راحتی، اینجا سریع‌ترین راه برای هر برنامه است.",

const LANGS = {fa:{name:"فارسی",dir:"rtl",locale:"fa-IR"},tr:{name:"Türkçe",dir:"ltr",locale:"tr-TR"},en:{name:"English",dir:"ltr",locale:"en-US"}};

/* ---------------- state & helpers ---------------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const state = {
  lang: store.get("tmp_lang", null) || ((navigator.language||"fa").slice(0,2)==="tr"?"tr":(navigator.language||"").slice(0,2)==="en"?"en":"fa"),
  theme: store.get("tmp_theme", null) || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"),
  page: "home", param: null, anchor: null
};
if(!["fa","tr","en"].includes(state.lang)) state.lang = "fa";
function t(k){ const d = I18N[state.lang]||I18N.en; return d[k]!==undefined?d[k]:(I18N.en[k]!==undefined?I18N.en[k]:k); }
function L(obj){ return obj ? (obj[state.lang]!==undefined?obj[state.lang]:obj.en) : ""; }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
function loc(){ return LANGS[state.lang].locale; }
function fmtNum(n){ try{ return new Intl.NumberFormat(loc()).format(n); }catch(e){ return String(n); } }
function fmtDate(iso){ try{ return new Intl.DateTimeFormat(loc(),{year:"numeric",month:"long",day:"numeric"}).format(new Date(iso+"T00:00:00")); }catch(e){ return iso; } }
function hashFor(page, param){ return "#/" + state.lang + "/" + page + (param?"/"+param:""); }
function catName(id){ return t("cat_"+id.replace("-","_")) || id; }
function catDesc(id){ return t("cat_"+id.replace("-","_")+"_d") || ""; }
function serverDesc(s){ return state.lang==="fa"?s.desc_fa:state.lang==="tr"?s.desc_tr:s.desc; }
function toolSum(tl){ return state.lang==="fa"?tl.sf:state.lang==="tr"?tl.st:tl.s; }
function skillTag(k){ return state.lang==="fa"?k.tag_fa:state.lang==="tr"?k.tag_tr:k.tag; }
function skillGap(k){ return state.lang==="fa"?k.gap_fa:state.lang==="tr"?k.gap_tr:k.gap; }
function favs(){ return store.get("tmp_favs_v1", []); }
function isFav(type,id){ return favs().some(f=>f.type===type&&f.id===id); }
function recent(){ return store.get("tmp_recent_v1", []); }
function pushRecent(type,id){ let r = recent().filter(x=>!(x.type===type&&x.id===id)); r.unshift({type,id,at:Date.now()}); store.set("tmp_recent_v1", r.slice(0,8)); }
function toast(msg){ const el=document.getElementById("toast"); if(!el) return; el.textContent=msg; el.classList.add("show"); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove("show"),2600); }
function copyText(txt, msg){ const done=()=>toast(msg||t("tool_copied"));
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt,done)); }
  else fallbackCopy(txt,done); }
function fallbackCopy(txt, done){ const ta=document.createElement("textarea"); ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); }catch(e){} document.body.removeChild(ta); done(); }

const PAGES = ["home","marketplace","tool","categories","skills","skill","tutorials","tutorial","blog","article","about","contact","favorites","ask","connect"];
function parseHash(){
  const raw = location.hash||"";
  if(raw && !raw.startsWith("#/")){
    const id = raw.slice(1);
    if(/^[A-Za-z][\w-]*$/.test(id)){ state.anchor = id; return; }
  }
  const h = raw.replace(/^#\/?/,"");
  const parts = h.split("/").filter(Boolean);
  let lang = parts[0], page = parts[1]||"home", param = parts[2]||null;
  if(!["fa","tr","en"].includes(lang)){ lang = state.lang; page = parts[0]||"home"; param = parts[1]||null; }
  if(!PAGES.includes(page)){ state.page="404"; state.param=page; state.lang=lang; return; }
  state.lang = lang; state.page = page; state.param = param;
}
function go(page, param){ location.hash = hashFor(page, param); window.scrollTo({top:0}); }

/* marketplace state */
const mp = { q:"", cat:"all", sort:"popular" };
function mpFiltered(){
  let list = SERVERS.slice();
  const q = mp.q.trim().toLowerCase();
  if(q) list = list.filter(s => (s.id+" "+s.title+" "+s.title_tr+" "+serverDesc(s)+" "+s.tools.map(x=>x.n+" "+toolSum(x)).join(" ")).toLowerCase().includes(q));
  if(mp.cat!=="all") list = list.filter(s=>s.cat===mp.cat);
  if(mp.sort==="popular") list.sort((a,b)=>b.tools.length-a.tools.length || a.id.localeCompare(b.id));
  if(mp.sort==="newest") list.sort((a,b)=>b.added-a.added);
  if(mp.sort==="alpha") list.sort((a,b)=>a.id.localeCompare(b.id));
  return list;
}
function mpMatches(q){
  const s = q.trim().toLowerCase(); if(!s) return {skills:[],tuts:[],arts:[]};
  return {
    skills: SKILLS.filter(k=>(k.id+" "+skillTag(k)).toLowerCase().includes(s)),
    tuts: TUTORIALS.filter(x=>(L(x.title)+" "+L(x.ex)).toLowerCase().includes(s)),
    arts: ARTICLES.filter(a=>(L(a.title)+" "+L(a.ex)).toLowerCase().includes(s))
  };
}
function mpResultsHTML(){
  const list = mpFiltered();
  const m = mpMatches(mp.q);
  let h = `<p class="result-count">${fmtNum(list.length)} ${t("results")}</p>`;
  if(!list.length && !m.skills.length && !m.tuts.length && !m.arts.length) return h + emptyHTML();
  if(list.length) h += `<div class="ledger">${list.map(serverCard).join("")}</div>`;
  const extra = [];
  if(m.skills.length) extra.push(`<h3 class="match-head">${t("match_skills")} (${fmtNum(m.skills.length)})</h3><div class="grid grid-3">${m.skills.map(skillCard).join("")}</div>`);
  if(m.tuts.length) extra.push(`<h3 class="match-head">${t("match_tuts")} (${fmtNum(m.tuts.length)})</h3><div class="grid grid-3">${m.tuts.map(tutCard).join("")}</div>`);
  if(m.arts.length) extra.push(`<h3 class="match-head">${t("match_arts")} (${fmtNum(m.arts.length)})</h3><div class="grid grid-3">${m.arts.map(artCard).join("")}</div>`);
  return h + extra.join("");
}

let demoIdx = 0, demoTimer = null, typeToken = 0;
function typeText(el, text, speed, token){
  return new Promise(res=>{
    let i=0;
    (function tick(){
      if(token!==typeToken || !document.body.contains(el)) return res();
      el.textContent = text.slice(0, ++i);
      if(i<text.length) setTimeout(tick, speed); else res();
    })();
  });
}
function hlCode(code){
  const m = code.match(/^([a-z0-9_]+)(\(.*\))$/);
  if(!m) return esc(code);
  let args = esc(m[2]).replace(/(&quot;|")([^"]*)(&quot;|")/g, '<span class="str">"$2"</span>');
  return '<span class="fn">'+esc(m[1])+'</span><span class="arg">'+args+'</span>';
}
async function showDemo(){
  const token = ++typeToken;
  const body = document.getElementById("demo-body");
  const tabs = document.getElementById("demo-tabs");
  if(!body || !tabs) return;
  const d = DEMOS[demoIdx];
  tabs.innerHTML = DEMOS.map((x,i)=>`<button data-i="${i}" class="${i===demoIdx?"active":""}" onclick="App.demoTab(${i})">${esc(x.tab[state.lang])}</button>`).join("");
  body.innerHTML = `<p class="q"><span class="typed"></span><span class="cursor"></span></p><pre style="visibility:hidden"><code></code></pre><p class="status"></p><p class="a"></p><p class="ask"></p>`;
  if(prefersRM()){ body.querySelector(".typed").textContent = d.q[state.lang]; } else { await typeText(body.querySelector(".typed"), d.q[state.lang], 26, token); }
  if(token!==typeToken || !document.body.contains(body)) return;
  const pre = body.querySelector("pre");
  pre.style.visibility = "visible";
  pre.querySelector("code").innerHTML = hlCode(d.code);
  body.querySelector(".status").textContent = d.status[state.lang];
  body.querySelector(".a").textContent = d.a[state.lang];
  body.querySelector(".ask").innerHTML = `<a href="${hashFor("ask", encodeURIComponent(d.q[state.lang]))}">${esc(t("demo_ask"))}</a> · ${esc(t("demo_nosignup"))}`;
}
function startDemo(){
  clearInterval(demoTimer);
  if(prefersRM()){ showDemo(); return; }
  demoTimer = setInterval(()=>{ demoIdx = (demoIdx+1)%DEMOS.length; showDemo(); }, 11000);
  showDemo();
}
function stopDemo(){ clearInterval(demoTimer); typeToken++; }

function askNorm(s){
  return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/ي/g,"ی").replace(/ك/g,"ک").replace(/ة/g,"ه")
    .replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d))
    .replace(/[^a-z0-9\u0600-\u06FF ]/g," ").replace(/\s+/g," ").trim();
}
function askTokens(q){ return askNorm(q).split(" ").filter(w=>w.length>1); }
function askHay(s){
  return askNorm([s.id, s.title, s.title_tr||"", s.desc, s.desc_fa, s.desc_tr||"", s.cat,
    s.tools.map(x=>x.n+" "+x.s+" "+(x.sf||"")+" "+(x.st||"")).join(" ")].join(" "));
}
function askScore(q){
  const toks = askTokens(q);
  if(!toks.length) return [];
  const intents = ASK_INTENTS.map(it=>{
    const kws = Object.keys(it.kw).reduce((a,k)=>a.concat(it.kw[k].map(askNorm)),[]);
    const hit = [];
    toks.forEach(w=>{
      kws.forEach(k=>{
        k.split(" ").forEach(kw=>{
          if(kw && (kw===w || (kw.length>=3 && w.indexOf(kw)>=0) || (w.length>3 && kw.indexOf(w)>=0)) && hit.indexOf(kw)<0) hit.push(kw);
        });
      });
    });
    return {cats:it.cats, hit};
  }).filter(x=>x.hit.length);
  return SERVERS.map(s=>{
    const hay = askHay(s);
    let score = 0; const matched = [];
    toks.forEach(w=>{ if(hay.indexOf(w)>=0){ score += 2; if(matched.indexOf(w)<0) matched.push(w); } });
    intents.forEach(it=>{
      if(it.cats.indexOf(s.cat)>=0){ score += 3*it.hit.length; it.hit.forEach(kw=>{ if(matched.indexOf(kw)<0) matched.push(kw); }); }
    });
    return {s, score, matched};
  }).filter(r=>r.score>0).sort((a,b)=>b.score-a.score).slice(0,3);
}

function connSnippet(app, s){
  const short = s.id.replace("-mcp","");
  const envKeys = s.env ? Object.keys(s.env) : [];
  const envJson = envKeys.length ? ',\n      "env": {' + envKeys.map(k=>'\n        "'+k+'": "'+s.env[k]+'"').join(',') + '\n      }' : '';
  const envToml = envKeys.length ? '\nenv = {' + envKeys.map(k=>k+' = "'+s.env[k]+'"').join(', ') + '}' : '';
  const envCli = envKeys.length ? envKeys.map(k=>' -e '+k+'='+s.env[k]).join('') : '';
  if(app.kind==="cli") return "claude mcp add --transport stdio --scope user "+short+envCli+" -- uvx "+s.pypi;
  if(app.kind==="toml") return '[mcp_servers.'+short+']\ncommand = "uvx"\nargs = ["'+s.pypi+'"]'+envToml;
  if(app.kind==="vscode") return '{\n  "servers": {\n    "'+short+'": {\n      "type": "stdio",\n      "command": "uvx",\n      "args": ["'+s.pypi+'"]'+envJson+'\n    }\n  }\n}';

}

/* paper-unfold entrance (IntersectionObserver stagger; skipped when reduced motion) */
let unfoldObs = null;
function observeUnfold(root){
  const scope = root || document;
  const els = scope.querySelectorAll ? scope.querySelectorAll(".ledger-row, .card, .stat, .step, .plat-card") : [];
  if(prefersRM()){ els.forEach(el=>{ el.classList.add("unfold","in"); }); return; }
  if(!("IntersectionObserver" in window)){ els.forEach(el=>el.classList.add("unfold","in")); return; }
  if(!unfoldObs) unfoldObs = new IntersectionObserver((entries)=>{ entries.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add("in"); unfoldObs.unobserve(en.target); } }); }, {threshold:0.08});
  els.forEach((el,i)=>{ if(el.classList.contains("unfold")) return; el.classList.add("unfold"); el.style.transitionDelay = Math.min(i,8)*45+"ms"; unfoldObs.observe(el); });
}

/* command palette: fuzzy search over servers + FAQ */
const PALETTE = {open:false, q:"", sel:0, items:[]};
function paletteFuzzy(q, text){
  q=askNorm(q); text=askNorm(text);
  if(!q) return 0;
  let score=0, ti=0;
  for(const ch of q){ const ix=text.indexOf(ch, ti); if(ix<0) return 0; score += (ix===ti?2:1); ti=ix+1; }
  if(text.startsWith(q)) score+=10;
  if(text.indexOf(q)>=0) score+=6;
  return score;
}
function paletteResults(q){
  if(!q.trim()) return SERVERS.filter(s=>s.featured).map(s=>({type:"server", s, sc:1}));
  const srv = [];
  SERVERS.forEach(s=>{ const sc=Math.max(paletteFuzzy(q, s.id+" "+s.title+" "+(s.title_tr||"")+" "+serverDesc(s)), paletteFuzzy(q, s.id)); if(sc>0) srv.push({type:"server", s, sc}); });
  const fq = [];
  FAQ.forEach((f,i)=>{ const sc=paletteFuzzy(q, L(f.q)+" "+L(f.a)); if(sc>0) fq.push({type:"faq", f, i, sc}); });
  srv.sort((a,b)=>b.sc-a.sc); fq.sort((a,b)=>b.sc-a.sc);
  return srv.slice(0,5).concat(fq.slice(0,3));
}
function paletteHTML(){
  const items = PALETTE.items;
  const servers = items.filter(i=>i.type==="server"), faqs = items.filter(i=>i.type==="faq");
  let h = "";
  const row = (it, idx)=>{
    const sel = idx===PALETTE.sel;
    if(it.type==="server") return `<button type="button" role="option" aria-selected="${sel}" class="pal-row${sel?" sel":""}" data-idx="${idx}" onclick="App.paletteGo(${idx})"><span class="mono mono-sm" style="--mc:${it.s.color}">${mono(it.s)}</span><span class="pal-main"><span class="pal-name">${esc(it.s.title.split(" — ")[0])}</span><span class="pal-sub latin">${esc(it.s.id)} · ${fmtNum(it.s.tools.length)} ${t("tools_count")}</span></span><span class="pal-jump">↵</span></button>`;
    return `<button type="button" role="option" aria-selected="${sel}" class="pal-row${sel?" sel":""}" data-idx="${idx}" onclick="App.paletteGo(${idx})"><span class="mono mono-sm" style="--mc:#005F73">?</span><span class="pal-main"><span class="pal-name">${esc(L(it.f.q))}</span><span class="pal-sub">${t("faq_title")}</span></span><span class="pal-jump">↵</span></button>`;
  };
  let idx=0;
  if(servers.length){ h += `<p class="pal-group">${t("palette_servers")}</p>` + servers.map(it=>row(it, idx++)).join(""); }
  if(faqs.length){ h += `<p class="pal-group">${t("palette_faq")}</p>` + faqs.map(it=>row(it, idx++)).join(""); }
  if(!h) h = `<p class="pal-empty">${t("palette_empty")}</p>`;
  return h;
}
function renderPalette(){
  const box = document.getElementById("palette-results");
  if(box) box.innerHTML = paletteHTML();
}
function openPalette(){
  PALETTE.open=true; PALETTE.q=""; PALETTE.sel=0; PALETTE.items=paletteResults("");
  const ov=document.getElementById("palette"); if(!ov) return;
  ov.classList.add("open"); ov.setAttribute("aria-hidden","false");
  const inp=document.getElementById("palette-input");
  if(inp){ inp.value=""; inp.placeholder=t("palette_ph"); setTimeout(()=>inp.focus(), 30); }
  const hint=document.querySelector(".palette-hint"); if(hint) hint.textContent=t("palette_hint");
  renderPalette();
}
function closePalette(){
  PALETTE.open=false;
  const ov=document.getElementById("palette");
  if(ov){ ov.classList.remove("open"); ov.setAttribute("aria-hidden","true"); }
}

/* ---------------- App actions ---------------- */
window.App = {
  setLang(l){ if(!LANGS[l]) return; state.lang=l; store.set("tmp_lang", l);
    const h=(location.hash||"").replace(/^#\/?/,""); const parts=h.split("/").filter(Boolean);
    if(["fa","tr","en"].includes(parts[0])) parts[0]=l; else parts.unshift(l);
    location.hash = "#/"+parts.join("/"); render(); },
  toggleTheme(){ state.theme = state.theme==="dark"?"light":"dark"; store.set("tmp_theme", state.theme); document.documentElement.setAttribute("data-theme", state.theme); const b=document.querySelector('button[onclick="App.toggleTheme()"]'); if(b){ const l=t(state.theme==="dark"?"theme_light":"theme_dark"); b.textContent=state.theme==="dark"?"☀":"☾"; b.setAttribute("aria-label",l); b.setAttribute("title",l); } },
  toggleMenu(){ const m=document.getElementById("mobile-menu"); if(m) m.classList.toggle("open"); },
  toggleFav(type,id,ev){ if(ev) ev.stopPropagation();
    let f = favs(); const i = f.findIndex(x=>x.type===type&&x.id===id);
    if(i>=0){ f.splice(i,1); toast(t("fav_removed")); } else { f.push({type,id}); toast(t("fav_added")); }
    store.set("tmp_favs_v1", f); render(); },
  copy(btn, txt){ copyTextRaw(txt); if(btn && btn.classList){ const orig = btn.dataset.orig || btn.textContent; btn.dataset.orig = orig; btn.textContent = t("tool_copied"); btn.classList.add("copied"); const host = btn.closest ? btn.closest(".install-box,.ledger-row,.card") : null; if(host){ host.classList.add("copied-flash"); setTimeout(()=>host.classList.remove("copied-flash"), 700); } clearTimeout(btn._ct); btn._ct = setTimeout(()=>{ btn.textContent = btn.dataset.orig; btn.classList.remove("copied"); }, 1600); } },
  demoTab(i){ demoIdx=i; showDemo(); },
  connApp(id){ CONNECT_STATE.app=id; render(); },
  connTrack(tr){ CONNECT_STATE.track=tr; render(); },
  connSimpleServer(id){ CONNECT_STATE.simpleServer=id; render(); },
  inspect(id){ if(state.page!=="marketplace"){ go("marketplace", id); return; } if(state.param===id) return; INSPECT_SCROLL = window.scrollY||0; INSPECT_KEEP = true; location.hash = hashFor("marketplace", id); },
  toggleDrawer(id){ if(DRAWER.has(id)) DRAWER.delete(id); else DRAWER.add(id); const el=document.getElementById("mp-results"); if(el){ el.innerHTML=mpResultsHTML(); observeUnfold(el); } else render(); },
  toggleSheet(open){ const sh=document.getElementById("filter-sheet"); const bd=document.getElementById("sheet-backdrop"); if(!sh) return; if(open){ App.syncMp(); sh.classList.add("open"); if(bd) bd.classList.add("open"); } else { sh.classList.remove("open"); if(bd) bd.classList.remove("open"); } },
  syncMp(){ ["","2"].forEach(s=>{ const q=document.getElementById("mp-q"+s); if(q && document.activeElement!==q) q.value=mp.q; const c=document.getElementById("mp-cat"+s); if(c) c.value=mp.cat; const so=document.getElementById("mp-sort"+s); if(so) so.value=mp.sort; }); },
  rockerKey(ev,id){ if(ev.key!=="ArrowLeft" && ev.key!=="ArrowRight") return; ev.preventDefault(); const rtl=document.documentElement.dir==="rtl"; const fwd=(ev.key==="ArrowRight")!==rtl; App.connTrack(fwd?"tech":"simple"); },
  openPalette(){ openPalette(); },
  closePalette(){ closePalette(); },
  paletteSearch(v){ PALETTE.q=v; PALETTE.sel=0; PALETTE.items=paletteResults(v); renderPalette(); },
  paletteKey(ev){ const n=PALETTE.items.length; if(ev.key==="ArrowDown"){ ev.preventDefault(); if(n){ PALETTE.sel=(PALETTE.sel+1)%n; renderPalette(); } } else if(ev.key==="ArrowUp"){ ev.preventDefault(); if(n){ PALETTE.sel=(PALETTE.sel-1+n)%n; renderPalette(); } } else if(ev.key==="Enter"){ ev.preventDefault(); App.paletteGo(PALETTE.sel); } else if(ev.key==="Escape"){ closePalette(); } },
  paletteGo(idx){ const it=PALETTE.items[idx]; if(!it) return; closePalette(); if(it.type==="server") go("tool", it.s.id); else { PENDING_SCROLL="faq"; go("about"); } },
  heroSearch(ev){ ev.preventDefault(); const q=document.getElementById("hero-q"); mp.q=q?q.value:""; mp.cat="all"; go("marketplace"); render(); return false; },
  askSearch(v){ ASK_STATE.q=v; const el=document.getElementById("ask-results"); if(el){ el.innerHTML=askResultsHTML(v,askScore(v)); observeUnfold(el); } },
  askChip(txt){ ASK_STATE.q=txt.trim(); const inp=document.getElementById("ask-q"); if(inp) inp.value=ASK_STATE.q; const el=document.getElementById("ask-results"); if(el){ el.innerHTML=askResultsHTML(ASK_STATE.q,askScore(ASK_STATE.q)); observeUnfold(el); } },
  askSubmit(ev){ ev.preventDefault(); const inp=document.getElementById("ask-q"); ASK_STATE.q=inp?inp.value:""; const el=document.getElementById("ask-results"); if(el){ el.innerHTML=askResultsHTML(ASK_STATE.q,askScore(ASK_STATE.q)); observeUnfold(el); } return false; },
  openCategory(id){ mp.cat=id; mp.q=""; go("marketplace"); render(); },
  mpSearch(v){ mp.q=v; App.syncMp(); const el=document.getElementById("mp-results"); if(el){ el.innerHTML=mpResultsHTML(); observeUnfold(el); } },
  mpFilter(k,v){ mp[k]=v; App.syncMp(); const el=document.getElementById("mp-results"); if(el){ el.innerHTML=mpResultsHTML(); observeUnfold(el); } },
  skillSearch(v){ skillsHTML._q=v; const el=document.getElementById("skills-results"); if(!el) return;
    const q=v.trim().toLowerCase(); const cat=skillsHTML._cat||"all";
    const list=SKILLS.filter(k=>(!q||(k.id+" "+skillTag(k)+" "+skillGap(k)).toLowerCase().includes(q))&&(cat==="all"||k.cat===cat));
    el.innerHTML = list.length?`<div class="grid grid-3">${list.map(skillCard).join("")}</div>`:emptyHTML(); observeUnfold(el); },
  skillFilter(v){ skillsHTML._cat=v; App.skillSearch(skillsHTML._q||""); },
};

/* ---------------- init ---------------- */
window.addEventListener("hashchange", ()=>{ const keep=INSPECT_KEEP; INSPECT_KEEP=false; render(); if(keep){ window.scrollTo({top:INSPECT_SCROLL}); } else { const h=location.hash||""; if(h.startsWith("#/") || !h) window.scrollTo({top:0}); } });
if(document.addEventListener) document.addEventListener("keydown", (ev)=>{ if((ev.metaKey||ev.ctrlKey) && ev.key.toLowerCase()==="k"){ ev.preventDefault(); if(PALETTE.open) closePalette(); else openPalette(); } else if(ev.key==="Escape" && PALETTE.open){ closePalette(); } });
if(!location.hash) location.hash = "#/"+state.lang+"/";
render();
</script>
